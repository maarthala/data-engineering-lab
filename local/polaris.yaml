services:
  # Apache Polaris — Iceberg-native governed REST catalog (RBAC + credential
  # vending). The live governance for the stack: one governed catalog for BOTH
  # Trino and Spark on the Iceberg lakehouse. Persistence in Postgres (db polarisdb).
  polaris:
    image: apache/polaris:1.8.0
    container_name: polaris
    environment:
      # Object-storage static credentials (no STS — enabled by ALLOW_INSECURE_STORAGE_TYPES).
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      # realm + bootstrap root principal (client-id=root, client-secret=s3cr3t).
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."ALLOW_NAMESPACE_CUSTOM_LOCATION": "true"
      # A learner's extra catalogs (My catalogs) live inside their bucket, which their main
      # lakehouse <user>_lake already covers — Polaris rejects that overlap unless allowed.
      polaris.features."ALLOW_OVERLAPPING_CATALOG_URLS": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"FILE\",\"S3\"]"
      polaris.readiness.ignore-severe-issues: "true"
      # Auth: Polaris-internal only. Principals (analyst/engineer/lead, root) log in
      # with a client id/secret — no external IdP. (Keycloak dropped from the stack.)
      # Mixed auth: Polaris' own client-id/secret logins (root, personas, pipelines, learner
      # Spark sessions) AND Keycloak tokens from the console's "Sign in with OIDC" — the
      # token's principal_name / principal_roles (= the username) select the learner's
      # Polaris principal + principal-role created at provisioning → their own lakehouse.
      polaris.authentication."POLARIS".type: mixed
      quarkus.oidc.tenant-enabled: "true"
      quarkus.oidc.auth-server-url: http://keycloak:8080/realms/de-lab
      quarkus.oidc.client-id: polaris
      quarkus.oidc.credentials.secret: polaris-secret
      quarkus.oidc.roles.role-claim-path: principal_roles
      polaris.oidc.principal-mapper.name-claim-path: principal_name
      polaris.oidc.principal-roles-mapper.mappings[0].regex: (.+)
      polaris.oidc.principal-roles-mapper.mappings[0].replacement: PRINCIPAL_ROLE:$$1
      # --- Durable persistence: Postgres (db polarisdb) instead of in-memory ---
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polarisdb
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8182/q/health"]
      interval: 10s
      timeout: 10s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully
    networks:
      - sparknet

  # One-shot: bootstrap the Polaris schema + realm into Postgres (runs before polaris).
  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    container_name: polaris-bootstrap
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/polarisdb
      QUARKUS_DATASOURCE_USERNAME: polaris
      QUARKUS_DATASOURCE_PASSWORD: polaris
    command: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,root,s3cr3t"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sparknet
