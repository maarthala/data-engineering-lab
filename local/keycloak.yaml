# Front door: Keycloak (logins + self-registration) → oauth2-proxy (guards the landing
# page) → home-api (who am I + provisions the learner's own lakehouse on first login).
#
# Hostnames: the browser reaches Keycloak at http://localhost:8180, containers at
# http://keycloak:8080. Keycloak issues tokens for the PUBLIC address (KC_HOSTNAME) and
# answers back-channel calls on the internal one (BACKCHANNEL_DYNAMIC); oauth2-proxy
# skips discovery and is told both — so no hosts-file entries and no hostAlias tricks.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      # realm de-lab: registration on, groups learners (default) / managers,
      # client de-lab-home, user manager/manager. Imported only if absent.
      - ../common/keycloak/de-lab-realm.json:/opt/keycloak/data/import/de-lab-realm.json:ro
      # login/register pages styled like the landing page (realm loginTheme=de-lab)
      - ../common/keycloak/themes/de-lab:/opt/keycloak/themes/de-lab:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # no curl in the image — ask the management port with bash's /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks:
      - sparknet

  home-api:
    build:
      context: ../common/dockerfiles
      dockerfile: Dockerfile.home-api
    container_name: home-api
    environment:
      POLARIS_URL: http://polaris:8181
      LEARNER_QUOTA_MB: "100"      # each learner's bucket <user>-lake (hard limit)
      AIRFLOW_HOST_PORT: ${AIRFLOW_HOST_PORT:-8001}   # so the home page's Airflow tile follows .env
      # home page: tiles of stopped units (make status) are greyed — tile=host:port it checks
      LAB_SERVICES: jupyter=jupyterhub:8000,spark=spark-master:8080,sqlpad=sqlpad:3000,airflow=airflow-apiserver:8080,superset=superset:8088,governance=polaris-proxy:8189
      # ⚙️ Settings → Services shows each unit's state (here they're switched in make status)
      LAB_VERSION: ${LAB_VERSION:-}            # the release tag — the Makefile sets it (git describe)
      LAB_UPDATE_CHECK: ${LAB_UPDATE_CHECK:-1}  # 0: no "newer release" banner for managers
      LAB_UPDATE_REPO: ${LAB_UPDATE_REPO:-maarthala/data-engineering-lab}   # a fork: its own repo
      LAB_UNITS: "SQL=trino:8080,sqlpad:3000;Notebooks=jupyterhub:8000;Spark=spark-master:8080,spark-connect:15002;Airflow=airflow-apiserver:8080;Superset=superset:8088;Polaris console=polaris-proxy:8189"
      TRINO_RULES_PATH: /trino-access/rules.json      # Trino's access rules, kept in step with Polaris
      # "Manage members" (managers only): Keycloak admin + a JupyterHub service token
      KEYCLOAK_ADMIN: admin:admin
      HUB_ADMIN_TOKEN: lab-admin-local-hub-token
      AIRFLOW_ADMIN: airflow:airflow                  # delete also tidies the member's Airflow role / history
      # "My secrets" — the key vault (vault.yaml); same lab-only token as there
      VAULT_ADDR: http://vault:8200
      VAULT_ADMIN_TOKEN: ${VAULT_ADMIN_TOKEN:-lab-vault-admin-local-token}
      # "📝 Mock exams" — the portal's own database (portal-db makes it)
      PORTAL_DB_URL: postgresql://portal:portal@postgres:5432/portal
    volumes:
      - ./configs/trino/access:/trino-access
      # lab code mounted over the image's copies (as on Kubernetes) — edits need only a restart
      - ../common/dockerfiles/add/lakehouse.py:/app/lakehouse.py:ro
      - ../common/dockerfiles/add/home-api.py:/app/app.py:ro
      - ../common/dockerfiles/add/labadmin.py:/app/labadmin.py:ro
      - ../common/dockerfiles/add/labvault.py:/app/labvault.py:ro
      - ../common/dockerfiles/add/labexams.py:/app/labexams.py:ro
      - ../common/dockerfiles/add/exam_demo.json:/app/exam_demo.json:ro
    depends_on:                      # it provisions in all three: wait for them (a stopped one has no DNS name)
      portal-db:
        condition: service_completed_successfully
      polaris:
        condition: service_started
      storage:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sparknet

  # One-shot: the portal's database + login in the stack's Postgres (mock exams …) — also on a
  # stack made before it existed (Postgres runs its init scripts only on an empty volume). Members'
  # PostgreSQL login `learner` may not connect to it.
  portal-db:
    image: postgres:18
    container_name: portal-db
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    command:
      - sh
      - -c
      - |
        psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'portal'" | grep -q 1 || psql -c "CREATE USER portal WITH PASSWORD 'portal'"
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'portal'" | grep -q 1 || psql -c "CREATE DATABASE portal OWNER portal"
        psql -qc "REVOKE CONNECT ON DATABASE portal FROM PUBLIC"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sparknet

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: oauth2-proxy
    ports:
      - "8000:4180"          # the landing page — now behind a Keycloak login
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: de-lab-home
      OAUTH2_PROXY_CLIENT_SECRET: de-lab-home-secret
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # browser-facing issuer/login; container-facing token + keys
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://localhost:8180/realms/de-lab
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_LOGIN_URL: http://localhost:8180/realms/de-lab/protocol/openid-connect/auth
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/de-lab/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/de-lab/protocol/openid-connect/certs
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:8000/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: http://home:80/,http://home-api:8000/api/
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"   # self-registered users
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: preferred_username            # registration asks no email — use the username
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"                   # straight to Keycloak's login/register page
      OAUTH2_PROXY_COOKIE_SECRET: "de-lab-local-cookie-secret-32ch!"   # must be 16/24/32 bytes (lab only)
      OAUTH2_PROXY_COOKIE_SECURE: "false"                         # plain http in the lab
      OAUTH2_PROXY_COOKIE_NAME: _de_lab
      # one CSRF/PKCE cookie per login attempt — a second tab or a stale login page
      # otherwise breaks the newer flow (pkce_verification_failed → 500)
      OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST: "true"
      OAUTH2_PROXY_COOKIE_CSRF_EXPIRE: 15m
      # Session kept server-side in Redis: the browser holds only a short session id. A cookie
      # with the tokens inside grew past 8 KB — and browsers send localhost cookies to EVERY
      # port, so it broke other tools too ("400 Request Header Or Cookie Too Large").
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://redis:6379/1
      # Follow the Keycloak session: every minute (on the next request) the session is refreshed
      # with Keycloak, which refuses once its session has ended (2 h idle / 12 h at most, or Log
      # out in another tool) → straight back to the login page. 12 h = Keycloak's longest session.
      OAUTH2_PROXY_COOKIE_REFRESH: 1m
      OAUTH2_PROXY_COOKIE_EXPIRE: 12h
      # where "Log out" lands after oauth2-proxy clears its cookie (Keycloak ends the SSO session)
      OAUTH2_PROXY_WHITELIST_DOMAINS: localhost:8180
    depends_on:
      keycloak:
        condition: service_healthy
      redis:
        condition: service_healthy   # session store
    restart: unless-stopped
    networks:
      - sparknet
