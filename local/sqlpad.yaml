
services:
  # SQLPad — a web SQL workbench for running ANY SQL (SELECT + INSERT/UPDATE/DELETE
  # + DDL/MERGE) against both the OLTP source (Postgres) and the OLAP lakehouse
  # (Trino/Iceberg). Unlike Superset (read-only BI), SQLPad executes raw
  # SQL, so it's the tool for the write/DDL lessons. Connections are pre-seeded.
  sqlpad:
    image: sqlpad/sqlpad:7.5.7
    container_name: sqlpad
    restart: always
    environment:
      SQLPAD_ADMIN: "admin@de.local"
      SQLPAD_ADMIN_PASSWORD: "admin1234"
      SQLPAD_APP_LOG_LEVEL: warn
      # Sign in with the lab account (Keycloak realm de-lab, client sqlpad). SQLPad uses the
      # username as the user id (no email needed); learners are pre-created ("invited") by
      # home-api / JupyterHub on first lab login, so SQLPad lets them in; managers (realm
      # role admin → `roles` claim) are SQLPad admins. The admin above still logs in locally.
      PUBLIC_URL: http://sqlpad.lab.localhost:8000
      SQLPAD_OIDC_ISSUER: http://keycloak:8080/realms/de-lab
      SQLPAD_OIDC_CLIENT_ID: sqlpad
      SQLPAD_OIDC_CLIENT_SECRET: sqlpad-secret
      SQLPAD_OIDC_SCOPE: openid profile
      SQLPAD_OIDC_LINK_HTML: "Sign in with Epireum lab account"
      SQLPAD_QUERY_RESULT_MAX_ROWS: "50000"
      # --- pre-seeded connections (full read + write) ---
      # OLTP — ShopFlow (Postgres)
      SQLPAD_CONNECTIONS__shopflow__name: "ShopFlow — OLTP (Postgres)"
      SQLPAD_CONNECTIONS__shopflow__driver: postgres
      SQLPAD_CONNECTIONS__shopflow__host: postgres
      SQLPAD_CONNECTIONS__shopflow__port: "5432"
      SQLPAD_CONNECTIONS__shopflow__database: shopflow
      SQLPAD_CONNECTIONS__shopflow__username: learner
      SQLPAD_CONNECTIONS__shopflow__password: learner
      # OLTP — AdventureWorks (Postgres)
      SQLPAD_CONNECTIONS__adventureworks__name: "AdventureWorks — OLTP (Postgres)"
      SQLPAD_CONNECTIONS__adventureworks__driver: postgres
      SQLPAD_CONNECTIONS__adventureworks__host: postgres
      SQLPAD_CONNECTIONS__adventureworks__port: "5432"
      SQLPAD_CONNECTIONS__adventureworks__database: adventureworks
      SQLPAD_CONNECTIONS__adventureworks__username: learner
      SQLPAD_CONNECTIONS__adventureworks__password: learner
      # OLAP — Lakehouse (Trino / Iceberg, governed by Polaris)
    volumes:
      - sqlpad-data:/var/lib/sqlpad
    depends_on:
      - postgres
      - trino
      - keycloak
    networks:
      - sparknet

volumes:
  sqlpad-data:
