# The Flink unit (off until needed: make status → Flink → s) — a small Flink cluster for Apache Beam
# pipelines with more than one slot (like Dataflow's workers), and its UI at flink.lab.localhost:8000.
#  flink-jobmanager      the coordinator: plans each job, places its subtasks in slots, checkpoints; the UI
#  flink-taskmanager-N   the workers, 2 slots each (2 × 2 = 4 parallel copies of a pipeline's steps)
#  beam-worker-N         Beam's Python worker next to each TaskManager (same network): runs the
#                        pipeline's Python code (Map, DoFn …) for that TaskManager's slots
#  beam-job-server       takes a Beam pipeline from a notebook (PortableRunner) and turns it into a Flink job
# Without this unit, Beam still runs in Jupyter on its local runner (Prism) — one machine, no slots.
x-flink: &flink
  image: flink:1.20.5-scala_2.12-java17
  profiles: ["flink"]
  restart: unless-stopped
  networks:
    - sparknet
  volumes:
    - flink-data:/opt/flink/data              # checkpoints, shared by the JobManager and the TaskManagers

# (Flink's own settings: no comments inside — they'd become part of a value.) Network memory 128 MB:
# Beam's shuffles between 4 parallel copies need more than the default 64 MB.
x-flink-conf: &flink-conf |
  jobmanager.rpc.address: flink-jobmanager
  jobmanager.memory.process.size: 768m
  taskmanager.memory.process.size: 1280m
  taskmanager.memory.network.min: 128mb
  taskmanager.memory.network.max: 128mb
  taskmanager.numberOfTaskSlots: 2
  parallelism.default: 2
  state.checkpoints.dir: file:///opt/flink/data/checkpoints
  state.savepoints.dir: file:///opt/flink/data/savepoints
  web.submit.enable: false
  web.cancel.enable: false

x-beam-worker: &beam-worker
  build:                                       # Apache's Beam 2.77.0 / Python 3.10 worker + boto3 (s3://)
    context: ../common/dockerfiles
    dockerfile: Dockerfile.beam-worker
  image: local-beam-worker
  profiles: ["flink"]
  entrypoint: ["/opt/apache/beam/boot", "--worker_pool"]
  restart: unless-stopped

services:
  flink-jobmanager:
    <<: *flink
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: *flink-conf

  flink-taskmanager-1:
    <<: *flink
    container_name: flink-taskmanager-1
    hostname: flink-taskmanager-1
    command: taskmanager
    environment:
      FLINK_PROPERTIES: *flink-conf
    depends_on: [flink-jobmanager]

  flink-taskmanager-2:
    <<: *flink
    container_name: flink-taskmanager-2
    hostname: flink-taskmanager-2
    command: taskmanager
    environment:
      FLINK_PROPERTIES: *flink-conf
    depends_on: [flink-jobmanager]

  beam-worker-1:
    <<: *beam-worker
    container_name: beam-worker-1
    network_mode: "service:flink-taskmanager-1"   # localhost:50000 for its TaskManager
    depends_on: [flink-taskmanager-1]

  beam-worker-2:
    <<: *beam-worker
    container_name: beam-worker-2
    network_mode: "service:flink-taskmanager-2"
    depends_on: [flink-taskmanager-2]

  beam-job-server:
    image: apache/beam_flink1.20_job_server:2.77.0
    container_name: beam-job-server
    profiles: ["flink"]
    # a pipeline's files (its Python code, packages) go to the shared volume: the TaskManagers hand
    # them to their Beam worker from there
    command: ["--flink-master=flink-jobmanager:8081", "--job-host=0.0.0.0", "--artifacts-dir=/opt/flink/data/beam-artifacts"]
    volumes:
      - flink-data:/opt/flink/data
    depends_on: [flink-jobmanager]
    restart: unless-stopped
    networks:
      - sparknet

volumes:
  flink-data:
