# The Flink unit (off until needed: make status → Flink → s) — a small Flink cluster for Apache Beam
# pipelines with more than one slot (like Dataflow's workers), and its UI at flink.lab.localhost:8000.
#  flink-jobmanager    the coordinator: plans each job, places its subtasks in slots, checkpoints; the UI
#  flink-taskmanager   the workers — FLINK_TASKMANAGERS of them, FLINK_SLOTS slots each (2 × 2 = 4
#                      parallel copies of a pipeline's steps). Each one also runs Beam's Python worker
#                      (Dockerfile.flink-taskmanager), which runs the pipeline's Python code (Map, DoFn …)
#  beam-job-server     takes a Beam pipeline from a notebook (PortableRunner) and turns it into a Flink job
# The sizes are a lab manager's (⚙️ Settings → Flink cluster); make status passes them in when it starts
# the unit (FLINK_TASKMANAGERS, FLINK_SLOTS, FLINK_TM_MEMORY — defaults below).
# Without this unit, Beam still runs in Jupyter on its local runner (Prism) — one machine, no slots.

# Flink's own settings — no comments inside (they'd become part of a value). The JobManager's don't
# name the TaskManagers' sizes, so resizing them doesn't restart it. A TaskManager's memory is
# 1280 MB + 256 MB per slot (make status works it out; less fails Flink's memory check). Network memory 256 MB:
# Beam's shuffles between parallel copies need far more than the default 64 MB (a pipeline with a few
# shuffles failed with 128); managed memory (Flink's own sorting / state — Beam barely uses it) 10 %; off-heap 256 + 128 MB: Beam's data
# channels to its Python worker (with less, a Reshuffle failed with "OutOfMemoryError: Direct buffer memory").
x-jm-conf: &jm-conf |
  jobmanager.rpc.address: flink-jobmanager
  jobmanager.memory.process.size: 768m
  parallelism.default: 2
  state.checkpoints.dir: file:///opt/flink/data/checkpoints
  state.savepoints.dir: file:///opt/flink/data/savepoints
  web.submit.enable: false
  web.cancel.enable: false

x-tm-conf: &tm-conf |
  jobmanager.rpc.address: flink-jobmanager
  taskmanager.memory.process.size: ${FLINK_TM_MEMORY:-1792m}
  taskmanager.memory.network.min: 256mb
  taskmanager.memory.network.max: 256mb
  taskmanager.memory.managed.fraction: 0.1
  taskmanager.memory.framework.off-heap.size: 256mb
  taskmanager.memory.task.off-heap.size: 128mb
  taskmanager.numberOfTaskSlots: ${FLINK_SLOTS:-2}
  state.checkpoints.dir: file:///opt/flink/data/checkpoints

services:
  flink-jobmanager:
    image: flink:1.20.5-scala_2.12-java17
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    profiles: ["flink"]
    command: jobmanager
    environment:
      FLINK_PROPERTIES: *jm-conf
    volumes:
      - flink-data:/opt/flink/data              # checkpoints, and the pipelines' files (beam-job-server)
    restart: unless-stopped
    networks:
      - sparknet

  # local-flink-taskmanager-1, -2 … (no container_name: compose numbers them)
  flink-taskmanager:
    build:
      context: ../common/dockerfiles
      dockerfile: Dockerfile.flink-taskmanager
    image: local-flink-taskmanager
    profiles: ["flink"]
    command: taskmanager
    environment:
      FLINK_PROPERTIES: *tm-conf
    deploy:
      replicas: ${FLINK_TASKMANAGERS:-2}
    volumes:
      - flink-data:/opt/flink/data
    depends_on: [flink-jobmanager]
    restart: unless-stopped
    networks:
      - sparknet

  beam-job-server:
    image: apache/beam_flink1.20_job_server:2.77.0
    container_name: beam-job-server
    profiles: ["flink"]
    # a pipeline's files (its Python code, packages) go to the shared volume: the TaskManagers hand
    # them to their Beam worker from there
    command: ["--flink-master=flink-jobmanager:8081", "--job-host=0.0.0.0", "--artifacts-dir=/opt/flink/data/beam-artifacts"]
    volumes:
      - flink-data:/opt/flink/data
    depends_on: [flink-jobmanager]
    restart: unless-stopped
    networks:
      - sparknet

volumes:
  flink-data:
