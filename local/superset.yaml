
services:
  superset:
    build:
      context: ../common/dockerfiles
      dockerfile: Dockerfile.superset
    container_name: superset
    restart: always
    environment:
      - SUPERSET_SECRET_KEY=your_secret_key
      - DATABASE_URL=postgresql+psycopg2://superset:superset@postgres:5432/superset
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CSRF_ENABLED=False
      - WTF_CSRF_ENABLED=False
      - TALISMAN_ENABLED=False
      # Sign in with the lab account (Keycloak, client superset) — see superset_config.py
      - KEYCLOAK_ENABLED=1
    depends_on:              # healthy, not just started — else `superset db upgrade` races Postgres init
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    volumes:   # lab code mounted over the image's copies (as on Kubernetes) — edits need only a restart
      - ../common/dockerfiles/add/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ../common/dockerfiles/add/connections.py:/extras/connections.py:ro
    command: >
      /bin/bash -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Superset --lastname Admin --email admin@superset.com --password admin &&
        superset init && python /extras/connections.py &&
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
      "
    networks:
      - sparknet