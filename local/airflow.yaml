
x-airflow-common:
  &airflow-common
  build:
    context: ../common/dockerfiles
    dockerfile: Dockerfile.airflow
  environment:
    &airflow-common-env
    # LocalExecutor runs tasks in-process (single-machine) — no Celery broker or
    # worker container needed. redis is no longer required by Airflow.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    AIRFLOW_CONN_SPARK_DEFAULT: 'spark://spark-master:7077'
    AIRFLOW__CORE__DAGS_FOLDER: /code/airflow/dags
    # Region/creds for the AWS SDK v2 used by Iceberg S3FileIO (object storage).
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: admin
    AWS_SECRET_ACCESS_KEY: admin123
    # UI login with the lab account (Keycloak, client airflow) — see airflow_webserver_config.py
    KEYCLOAK_ENABLED: '1'
    # DAG sources: the stack's own dags folder + every learner's <user>-lake/dags/ (one
    # bundle for all learners — see airflow_learner_dags.py; dag-id prefix rule in
    # airflow_local_settings.py). Learner DAGs show up within ~30 s of saving.
    PYTHONPATH: /opt/airflow/lab
    AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
      [{"name": "dags-folder", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle", "kwargs": {}},
       {"name": "learners", "classpath": "learner_dags.LearnerDagsBundle", "kwargs": {"refresh_interval": 30}}]
    # Polaris login for the platform's own Spark jobs (shopflow_medallion → the shared lake);
    # the Spark cluster itself holds none.
    POLARIS_CREDENTIAL: root:s3cr3t
    # key_vault() in learner DAGs reads the DAG owner's secrets from the key vault
    VAULT_ADDR: http://vault:8200
    VAULT_ADMIN_TOKEN: ${VAULT_ADMIN_TOKEN:-lab-vault-admin-local-token}
    # the learners bundle reads members' dags/ folders with storage user dags-reader (that folder
    # only — airflow_lab_guard.py makes it). Here the scheduler needs it too: on the local stack
    # member tasks run inside Airflow (k8s: in their own pods, see k8s/helm/de-stack/templates/airflow.yaml)
    LAB_DAGS_S3_KEY: dags-reader
    LAB_DAGS_S3_SECRET: ${LAB_DAGS_READER_SECRET:-lab-dags-reader-local}
  volumes:
    - ./code:/code
    - ../common/dockerfiles/add/airflow_webserver_config.py:/opt/airflow/webserver_config.py:ro
    - ../common/dockerfiles/add/airflow_learner_dags.py:/opt/airflow/lab/learner_dags.py:ro
    - ../common/dockerfiles/add/airflow_local_settings.py:/opt/airflow/lab/airflow_local_settings.py:ro
    # lab_spark(): a Spark session for a learner's DAG, signed in as that learner (+ its deps)
    - ../common/dockerfiles/add/lab_spark.py:/opt/airflow/lab/lab_spark.py:ro
    - ../common/dockerfiles/add/lakehouse.py:/opt/airflow/lab/lakehouse.py:ro
    - ../common/dockerfiles/add/labvault.py:/opt/airflow/lab/labvault.py:ro
    - ../common/dockerfiles/add/lab_jobs.py:/opt/airflow/lab/lab_jobs.py:ro
    - ../common/dockerfiles/add/airflow_lab_guard.py:/opt/airflow/lab/airflow_lab_guard.py:ro
    - ./configs/airflow.cfg:/opt/airflow/config/airflow.cfg
    - ./configs/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    - ./configs/spark/fairscheduler.xml:/opt/spark/conf/fairscheduler.xml
    - ./init_scripts/airflow:/init_scripts
    # Shared task-log dir so the api-server (UI) can read logs written by the
    # scheduler/dag-processor directly — no cross-container fetch over port 8793.
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy
  networks:
    - sparknet

services:
  airflow-apiserver:
      <<: *airflow-common
      command: api-server
      container_name: airflow-apiserver
      ports:
        - "${AIRFLOW_HOST_PORT:-8001}:8080"   # override in .env if 8001 is taken
      healthcheck:
        test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 30s
      restart: always
      depends_on:
        <<: *airflow-common-depends-on
        airflow-init:
          condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: airflow-scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # the stack's own DAGs; also the trusted side of the members' processor (airflow_lab_guard.py:
  # its database grants, the dags-reader storage user, members' DAG permissions)
  airflow-dag-processor:
    <<: *airflow-common
    command: ["bash", "-c", "python /opt/airflow/lab/airflow_lab_guard.py & exec airflow dag-processor --bundle-name dags-folder"]
    container_name: airflow-dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # Members' DAG files run here (top-level code, DAG callbacks) — with no admin login: database
  # login airflow_parser (no logins, connections, variables, XComs …), storage user dags-reader,
  # no FAB (can't grant itself anything). Not under the common env/volumes on purpose.
  airflow-dag-processor-learners:
    <<: *airflow-common
    command: dag-processor --bundle-name learners
    container_name: airflow-dag-processor-learners
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_parser:airflow_parser@postgres/airflow
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: /code/airflow/dags
      AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST: >-
        [{"name": "dags-folder", "classpath": "airflow.dag_processing.bundles.local.LocalDagBundle", "kwargs": {}},
         {"name": "learners", "classpath": "learner_dags.LearnerDagsBundle", "kwargs": {"refresh_interval": 30}}]
      PYTHONPATH: /opt/airflow/lab
      LAB_DAGS_S3_KEY: dags-reader
      LAB_DAGS_S3_SECRET: ${LAB_DAGS_READER_SECRET:-lab-dags-reader-local}
      AWS_REGION: us-east-1
    volumes:
      - ../common/dockerfiles/add/airflow_learner_dags.py:/opt/airflow/lab/learner_dags.py:ro
      - ../common/dockerfiles/add/airflow_local_settings.py:/opt/airflow/lab/airflow_local_settings.py:ro
      - ../common/dockerfiles/add/lab_spark.py:/opt/airflow/lab/lab_spark.py:ro
      - ../common/dockerfiles/add/lakehouse.py:/opt/airflow/lab/lakehouse.py:ro
      - ../common/dockerfiles/add/labvault.py:/opt/airflow/lab/labvault.py:ro
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      airflow-dag-processor:          # its guard grants this login's tables first
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    container_name: airflow-init
    command: ["/init_scripts/airflow-init.sh"]
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

volumes:
  # Shared across all Airflow services so task logs are readable in the web UI.
  airflow-logs: