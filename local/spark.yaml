
x-spark-common:
  &spark-common
    restart: always
    build:
      context: ../common/dockerfiles
      dockerfile: Dockerfile.spark
    environment:
      - SPARK_CONF_DIR=/opt/spark/conf/
      # Region for the AWS SDK v2 used by Iceberg's S3FileIO. No storage keys on the cluster:
      # sessions bring their own (learner key / keys vended by Polaris per table).
      - AWS_REGION=us-east-1
    volumes:
      - ./code:/code
      - ./configs/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
      - ./configs/spark/fairscheduler.xml:/opt/spark/conf/fairscheduler.xml
      - ./configs/hive/hive-site.xml:/opt/spark/conf/hive-site.xml
    networks:
      - sparknet

services:
  spark-master:
    <<: *spark-common
    hostname: spark-master
    container_name: spark-master
    entrypoint: ["/bin/bash", "-c", "/opt/spark/sbin/start-master.sh  --host spark-master && tail -f /dev/null"]


  spark-worker-1:
    <<: *spark-common
    hostname: worker-1
    container_name: spark-worker-1
    depends_on:
      - spark-master
    entrypoint: ["/bin/bash", "-c", "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null"]

  # Spark Connect server — the gRPC endpoint the Jupyter client (sc://spark-connect:15002)
  # talks to. Runs the driver on the standalone cluster; carries the iceberg catalog config
  # from spark-defaults.conf. catalogImplementation=in-memory because this stack has no Hive Metastore.
  spark-connect:
    <<: *spark-common
    hostname: spark-connect
    container_name: spark-connect
    depends_on:
      - spark-master
      - spark-worker-1
    # cap cores so notebook (Connect) work leaves room for Airflow spark-submit jobs
    # on the shared standalone cluster (otherwise one app grabs all cores).
    # Runs in the FOREGROUND (SPARK_NO_DAEMONIZE): if the server dies — e.g. killed when Docker
    # runs out of memory — the container exits and `restart: always` brings it back. (It used to
    # daemonize + `tail -f`, so a dead server left a live-looking container and every query hung.)
    # --driver-memory caps the server's heap so it isn't the first thing killed.
    environment:                  # (replaces the common list — keep its entries)
      - SPARK_CONF_DIR=/opt/spark/conf/
      - AWS_REGION=us-east-1
      - SPARK_NO_DAEMONIZE=1
    entrypoint: ["/bin/bash", "-c", "exec /opt/spark/sbin/start-connect-server.sh --master spark://spark-master:7077 --driver-memory 2g --conf spark.sql.catalogImplementation=in-memory --conf spark.connect.grpc.binding.port=15002 --conf spark.cores.max=2 --conf spark.executor.cores=1"]

