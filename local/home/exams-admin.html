<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exams — Epireum's Data Engineering Lab</title>
  <link rel="stylesheet" href="/admin.css?v=8">
  <style>
    .qtags{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px} .qtag{font-size:.74rem; padding:1px 7px; border:1px solid var(--line2); border-radius:999px; color:var(--muted); background:var(--panel2)}
    button.qtag{cursor:pointer} button.qtag:hover{border-color:var(--accent); color:var(--accent)}
    .upl{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; max-width:820px}
    .upl label, .form label{display:flex; flex-direction:column; gap:5px; font-size:.84rem; color:var(--muted)}
    .upl input[type=file]{font-size:.86rem; color:var(--muted)}
    @media (max-width:760px){ .upl{grid-template-columns:1fr} }
    .form{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; max-width:640px}
    .form input, .form select{width:100%}
    .seg{display:inline-flex; gap:4px; flex-wrap:wrap}
    .delab{margin-left:8px; font-size:.72rem; padding:1px 7px; border-radius:999px; background:var(--accent-bg); color:var(--accent)}
    .teampick{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px}
    .teampick label{display:flex; gap:6px; align-items:center; font-size:.9rem; color:var(--ink)}
    tr.link{cursor:pointer}
    .back{font-size:.88rem; color:var(--muted)} .back:hover{color:var(--accent)}
    .head{display:flex; align-items:center; gap:10px; flex-wrap:wrap} .head h2{margin:0; font-size:1.15rem}
    .id{color:var(--muted); font-size:.82rem; font-family:ui-monospace,Menlo,monospace}
    .subtabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin:4px 0 2px}
    .subtabs a{padding:8px 12px; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; font-weight:500; cursor:pointer}
    .subtabs a.on{color:var(--accent); border-bottom-color:var(--accent)}
    .pass{color:var(--ok-ink); font-weight:600} .fail{color:var(--bad-ink)}
    .danger-zone{border-color:#f1b5b0}
    .seg{display:inline-flex; border:1px solid var(--line2); border-radius:9px; overflow:hidden}
    .seg button{border:0; border-radius:0; background:transparent; padding:6px 14px} .seg button + button{border-left:1px solid var(--line2)}
    .seg button.on{background:var(--accent); color:#fff}
    .palette button.fix{background:var(--warn-bg); border-color:#e8b04a; color:#8a5a00}
    .card.needsfix{border-color:#e8b04a; background:#fffbf0}
    .fixnote{margin:0 0 10px; padding:8px 12px; border-radius:8px; background:var(--warn-bg); border:1px solid #f0d9a8; font-size:.9rem; color:#6b4a00}
    tr.why > td{background:var(--panel2); padding:8px 14px}
    .addbank{border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:10px 0 14px; background:var(--panel2)}
    .qfilter{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px} .qfilter input[type=search]{flex:1; min-width:200px}
    .palette{display:flex; flex-wrap:wrap; gap:5px; max-height:180px; overflow:auto}
    .palette button{min-width:38px; padding:4px 6px; font-size:.8rem} .palette button.cur{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
    .q{font-size:1.02rem; line-height:1.55; margin:6px 0 14px}
    .opt{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; line-height:1.45}
    .opt .k{font-weight:700; color:var(--muted); min-width:18px} .opt.ok{border-color:var(--accent2); background:rgba(57,208,196,.1)}
    .expl{margin-top:10px; padding:10px 12px; border-left:3px solid var(--accent); background:var(--panel2); border-radius:6px; font-size:.92rem; line-height:1.55}
    .expl a{color:var(--accent)}
  </style>
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=13"></script>
  <main id="main">
    <div class="placeholder">Loading…</div>
  </main>
  <script src="/admin.js?v=5"></script>
  <script src="/exam-render.js?v=5"></script>
  <script>
    // Exams — every certification exam (+ New exam). Click one: Question banks (+ Add question bank:
    // an encrypted bank + its key — used once, not kept — or a plain exam.json; the upload history) ·
    // Questions · Settings · In progress · Results. #exams/<id>/<section> in the address.
    var el = admin.el, data = null;
    admin.page('Exams', 'Mock certification exams — question banks, who may take them, and results.');


    function ask(btn, question, yesText, yes, danger) {          // inline "are you sure?" (no popups)
      var y = el('button', {class: 'small ' + (danger ? 'danger' : 'primary'), text: yesText});
      var n = el('button', {class: 'small', text: 'Cancel'});
      var box = el('span', {class: 'ask'}, [el('span', {text: question}), y, n]);
      btn.hidden = true; btn.parentNode.insertBefore(box, btn.nextSibling);
      n.addEventListener('click', function () { box.remove(); btn.hidden = false; });
      y.addEventListener('click', function () { box.remove(); btn.hidden = false; yes(btn); });
    }
    // Delete an exam (asked inline): a soft delete — the exam and members' attempts and results are
    // hidden, kept in the database
    function delButton(e, small) {
      var del = el('button', {class: (small ? 'small ' : '') + 'danger', text: small ? 'Delete' : 'Delete exam'});
      del.addEventListener('click', function (x) {
        x.stopPropagation();
        ask(del, 'Delete ' + e.name + '? Members\' attempts and results go with it' + (e.ongoing.length ? ' (' + e.ongoing.length + ' in progress)' : '') + '.', 'Yes, delete', function () {
          admin.api('POST', '/api/admin/exams/delete', {exam: e.id})
            .then(function () { admin.show('Deleted ' + e.name, ['Members no longer see it or their results for it.']); history.replaceState(null, '', '#exams'); load(); })
            .catch(function (y) { admin.show('Could not delete', [y.message], null, true); });
        }, true);
        var box = del.nextSibling; if (box) box.addEventListener('click', function (y) { y.stopPropagation(); });
      });
      return del;
    }
    function when(iso) { return new Date(iso).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}); }
    var NUM = /^(Questions|Attempts|Average|In progress|Score|Best|Passed|Time|Left out|Updated|Per attempt|Pass mark|New|Removed|Unchanged)$/;
    function th(list) { return el('thead', {}, [el('tr', {}, list.map(function (h) { return el('th', {class: NUM.test(h) ? 'r' : '', text: h}); }))]); }
    function who(e) { return el('span', {class: 'tag' + (e.enabled ? ' on' : ''), style: 'margin:0', text: e.audience === 'all' ? 'all members' : (e.teams || []).join(', ')}); }
    // Enabled / Disabled, switched in one click (in the list and in Settings): disabled, members can't
    // start it, and an attempt in progress can only be submitted as it is
    function onOff(e) {
      var b = el('button', {class: 'small' + (e.enabled ? ' on' : ''), text: e.enabled ? '● Enabled' : '○ Disabled',
                            title: e.enabled ? 'Members can take it — click to disable' : 'Members can\'t start it — click to enable'});
      b.addEventListener('click', function (x) {
        x.stopPropagation(); b.disabled = true;
        admin.api('POST', '/api/admin/exams/settings', {exam: e.id, enabled: !e.enabled}).then(function () {
          admin.show((e.enabled ? 'Disabled ' : 'Enabled ') + e.name, e.enabled
            ? ['Members can\'t start it.'].concat(e.ongoing.length ? [e.ongoing.length + ' attempt(s) in progress can\'t be changed any more — only submitted as they are.'] : [])
            : ['Members can take it again' + (e.ongoing.length ? ', and continue the attempts in progress.' : '.')]);
          load();
        }).catch(function (y) { admin.show('Could not change it', [y.message], null, true); b.disabled = false; });
      });
      return b;
    }
    function go(hash) { history.replaceState(null, '', '#' + hash); route(); }

    // ---- All exams ----------------------------------------------------------------------------------
    function listCard() {
      var add = el('button', {class: 'primary', text: '+ New exam'});
      add.addEventListener('click', function () {
        var name = el('input', {type: 'text', placeholder: 'e.g. Microsoft Fabric DP-700'});
        var ok = el('button', {class: 'small primary', text: 'Create'}), no = el('button', {class: 'small', text: 'Cancel'});
        var box = el('span', {class: 'ask'}, [name, ok, no]);
        add.hidden = true; add.parentNode.insertBefore(box, add.nextSibling); name.focus();
        no.addEventListener('click', function () { box.remove(); add.hidden = false; });
        function create() {
          ok.disabled = true;
          admin.api('POST', '/api/admin/exams/create', {name: name.value}).then(function (r) {
            admin.show('Exam created: ' + r.name, ['Next: + Add question bank. It is disabled for members until you enable it.']);
            admin.api('GET', '/api/admin/exams').then(function (d) { data = d; go('exams/' + r.exam + '/banks'); });
          }).catch(function (x) { admin.show('Could not create', [x.message], null, true); ok.disabled = false; });
        }
        ok.addEventListener('click', create);
        name.addEventListener('keydown', function (x) { if (x.key === 'Enter') create(); });
      });
      // ⟳ Sync DE exams: the DE lab chapters' exams, fresh from their public GitHub folder
      var sync = el('button', {text: '⟳ Sync DE exams', title: 'Load the DE lab chapters\' question banks from GitHub — new chapters, new and updated questions'});
      sync.addEventListener('click', function () {
        sync.disabled = true; sync.textContent = 'Syncing…';
        admin.api('POST', '/api/admin/exams/sync-delab', {}).then(function (r) {
          // just "Sync completed" — plus, only when a file on GitHub has a mistake, what to fix
          var lines = r.chapters.filter(function (c) { return c.problems.length; }).map(function (c) {
            return '✗ ' + (c.name || c.chapter) + ': ' + c.problems.join('; ');
          });
          admin.show('Sync completed', lines, null, lines.length > 0);
          load();
        }).catch(function (x) { admin.show('Sync failed', [x.message], null, true); sync.disabled = false; sync.textContent = '⟳ Sync DE exams'; });
      });
      var head = el('div', {class: 'bar'}, [el('h3', {style: 'margin:0', text: data.exams.length ? data.exams.length + ' exam' + (data.exams.length === 1 ? '' : 's') + ' — click one to manage it' : 'No exams yet'}),
        el('div', {class: 'row'}, [sync, add])]);
      if (!data.exams.length) return el('div', {class: 'card'}, [head, el('div', {class: 'sub', text: 'Create an exam, then add its question banks.'})]);
      // search + a quick filter; rows are added 20 at a time as you scroll (lazy)
      var KINDS = [['', 'All'], ['delab', 'DE lab'], ['other', 'Other'], ['on', 'Enabled'], ['off', 'Disabled']];
      var search = el('input', {type: 'search', placeholder: 'Search exams…', value: listFilt.q, style: 'max-width:240px'});
      var seg = el('span', {class: 'seg'}, KINDS.map(function (k) {
        var b = el('button', {class: 'small' + (listFilt.kind === k[0] ? ' on' : ''), text: k[1]});
        b.addEventListener('click', function () { listFilt.kind = k[0]; [].forEach.call(seg.children, function (x) { x.classList.toggle('on', x === b); }); fill(); });
        return b;
      }));
      var count = el('span', {class: 'sub'}), more = el('div', {class: 'sub', style: 'text-align:center; padding:8px'});
      var shown = [], next = 0, timer;
      function match(e) {
        var k = listFilt.kind, hay = [e.name, e.id, e.provider || ''].join(' ').toLowerCase();
        return (!k || (k === 'delab') === (e.source === 'delab') && (k === 'delab' || k === 'other') || k === 'on' && e.enabled || k === 'off' && !e.enabled) &&
               listFilt.q.toLowerCase().split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
      }
      function fill() { body.innerHTML = ''; shown = data.exams.filter(match); next = 0; grow(); }
      function grow() {
        shown.slice(next, next + 20).forEach(function (e) { body.appendChild(row(e)); });
        next = Math.min(next + 20, shown.length);
        count.textContent = shown.length === data.exams.length ? '' : shown.length + ' of ' + data.exams.length;
        more.textContent = !shown.length ? 'No exam matches.' : next < shown.length ? 'Scroll for more…' : '';
      }
      search.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { listFilt.q = search.value.trim(); fill(); }, 200); });
      if (window.IntersectionObserver) new IntersectionObserver(function (es) { if (es[0].isIntersecting && next < shown.length) grow(); }, {rootMargin: '200px'}).observe(more);
      var body = el('tbody');
      function row(e) {
        var tr = el('tr', {class: 'link'}, [
          el('td', {}, [el('b', {text: e.name}), e.source === 'delab' ? el('span', {class: 'delab', text: 'DE lab'}) : null, el('div', {class: 'id', text: e.id})]),
          el('td', {}, [onOff(e)]), el('td', {}, [who(e)]),
          el('td', {class: 'r', text: String(e.pool)}), el('td', {class: 'r', text: String(Math.min(e.num_questions, e.pool || e.num_questions))}),
          el('td', {class: 'r', text: e.pass_percent + ' %'}), el('td', {class: 'r', text: String(e.attempts)}),
          el('td', {class: 'r', text: e.avg_score === null ? '—' : e.avg_score + ' %'}), el('td', {class: 'r', text: String(e.ongoing.length)}),
          el('td', {class: 'acts'}, [delButton(e, true)])]);
        tr.addEventListener('click', function () { go('exams/' + e.id + '/banks'); });
        return tr;
      }
      fill();
      return el('div', {class: 'card'}, [head, el('div', {class: 'row', style: 'gap:10px; margin:0 0 10px'}, [search, seg, count]),
        el('div', {class: 'wrap'}, [el('table', {}, [th(['Exam', 'Status', 'Who can take it', 'Questions', 'Per attempt', 'Pass mark', 'Attempts', 'Average', 'In progress', '']), body])]), more]);
    }
    var listFilt = {q: '', kind: ''};                      // kept while you move around the page

    // ---- reading the chosen files ------------------------------------------------------------------
    function readJson(input) {
      return new Promise(function (resolve, reject) {
        var f = input.files[0];
        if (!f) return reject(new Error('choose a file'));
        var r = new FileReader();
        r.onload = function () { try { resolve(JSON.parse(r.result)); } catch (e) { reject(new Error(f.name + ' is not JSON')); } };
        r.onerror = function () { reject(new Error('could not read ' + f.name)); };
        r.readAsText(f);
      });
    }
    function readText(input) {
      return new Promise(function (resolve) {
        var f = input.files[0];
        if (!f) return resolve('');
        var r = new FileReader(); r.onload = function () { resolve(r.result); }; r.readAsText(f);
      });
    }
    // ---- one exam ---------------------------------------------------------------------------------
    function stat(v, label) { return el('div', {class: 'stat'}, [el('b', {text: String(v)}), el('span', {text: label})]); }
    function examView(e, section) {
      var subs = [['banks', 'Question banks (' + e.banks.length + ')'], ['questions', 'Questions (' + e.pool + (e.needs_fix ? ' · ' + e.needs_fix + ' need fix' : '') + ')'], ['settings', 'Settings'],
                  ['progress', 'In progress (' + e.ongoing.length + ')'], ['results', 'Results']];
      var back = el('a', {class: 'back', href: '#exams', text: '← All exams'});
      back.addEventListener('click', function (x) { x.preventDefault(); go('exams'); });
      var nav = el('div', {class: 'subtabs'}, subs.map(function (s) {
        var a = el('a', {class: s[0] === section ? 'on' : '', text: s[1]});
        a.addEventListener('click', function () { go('exams/' + e.id + '/' + s[0]); });
        return a;
      }));
      var body = section === 'banks' ? banksCard(e) : section === 'questions' ? questionsCard(e) : section === 'progress' ? progressCard(e)
               : section === 'results' ? resultsCard(e) : settingsCard(e);
      return [el('div', {}, [back]),
        el('div', {class: 'head'}, [el('h2', {text: e.name}), who(e), el('span', {class: 'id', text: e.id + (e.provider ? ' · ' + e.provider : '')})]),
        el('div', {class: 'stat-row'}, [stat(e.pool, 'questions in the pool'), stat(e.attempts, 'attempts submitted'), stat(e.members, 'members'),
          stat(e.avg_score === null ? '—' : e.avg_score + ' %', 'average score')]),
        nav].concat(body);
    }

    function settingsCard(e) {
      var name = el('input', {type: 'text', value: e.name});
      var n = el('input', {type: 'number', min: 1, max: Math.max(1, e.pool), value: Math.min(e.num_questions, e.pool || e.num_questions)});
      var pass = el('input', {type: 'number', min: 1, max: 100, value: e.pass_percent});
      var audience = el('select', {}, [['all', 'All members'], ['teams', 'Chosen teams']].map(function (o) {
        var opt = el('option', {value: o[0], text: o[1]}); if (o[0] === e.audience) opt.selected = true; return opt;
      }));
      var picks = data.teams.map(function (t) { var c = el('input', {type: 'checkbox', value: t}); c.checked = (e.teams || []).indexOf(t) >= 0; return {t: t, c: c}; });
      var pickBox = el('div', {class: 'teampick'}, picks.length ? picks.map(function (p) { return el('label', {}, [p.c, p.t]); })
        : [el('span', {class: 'sub', text: 'No teams yet — create them on Teams.'})]);
      // what members see with each question (the results by domain stay either way)
      var showDomain = el('input', {type: 'checkbox'}), showTags = el('input', {type: 'checkbox'});
      showDomain.checked = e.show_domain !== false; showTags.checked = e.show_tags !== false;
      var enabled = el('input', {type: 'checkbox'}); enabled.checked = !!e.enabled;
      var status = el('div', {class: 'teampick'}, [el('label', {}, [enabled, ' Enabled — members can start it']),
        el('span', {class: 'sub', text: 'Disabled: no new attempts; one in progress can only be submitted as it is.'})]);
      var labels = el('div', {class: 'teampick'}, [el('span', {class: 'sub', text: 'Members see with each question:'}),
        el('label', {}, [showDomain, ' Domain']), el('label', {}, [showTags, ' Tags'])]);
      function sync() { pickBox.hidden = audience.value !== 'teams'; }
      audience.addEventListener('change', sync); sync();
      var save = el('button', {class: 'primary', text: 'Save'});
      save.addEventListener('click', function () {
        save.disabled = true;
        admin.api('POST', '/api/admin/exams/settings', {exam: e.id, name: name.value, num_questions: +n.value, pass_percent: +pass.value,
          audience: audience.value, teams: picks.filter(function (p) { return p.c.checked; }).map(function (p) { return p.t; }),
          show_domain: showDomain.checked, show_tags: showTags.checked, enabled: enabled.checked})
          .then(function () {
            admin.show('Saved ' + name.value, [(enabled.checked ? 'Enabled' : 'Disabled — members can\'t start it') + ' · ' + (audience.value === 'all'
              ? 'all members.' : 'the chosen teams.')].concat(e.ongoing.length ? [e.ongoing.length +
              ' attempt(s) in progress keep their questions — delete them under In progress to start them with the new settings.'] : []));
            load();
          }).catch(function (x) { admin.show('Could not save', [x.message], null, true); save.disabled = false; });
      });
      var del = delButton(e);
      return [el('div', {class: 'card'}, [el('h3', {text: 'Exam settings'}),
          el('div', {class: 'form'}, [el('label', {}, ['Name', name]), el('label', {}, ['Who can take it', audience]),
            el('label', {}, ['Questions per attempt (pool: ' + e.pool + ')', n]), el('label', {}, ['Pass mark (%)', pass])]),
          pickBox, status, labels, el('div', {class: 'row', style: 'margin-top:16px'}, [save])]),
        el('div', {class: 'card danger-zone'}, [el('h3', {text: 'Delete'}),
          el('div', {class: 'sub', style: 'margin-bottom:10px', text: 'Removes the exam for everyone: members no longer see it, nor their attempts and results for it.'}), el('div', {class: 'row'}, [del])])];
    }

    // Question banks: what the exam has now, + Add question bank (file + key → uploaded, then what it
    // did: new · updated · removed · unchanged), and the history of every file added
    function num(v) { return v === null || v === undefined ? '—' : String(v); }
    // the questions an upload left out, each with why — the file's mistakes, and those marked needs-fix
    // each as: id (no. N in the source) "the question's first words" — why
    function problems(p) {
      var bad = (p && p.left_out) || [], nf = (p && p.needs_fix) || [], off = (p && p.disabled) || [];
      if (p && p.bank_disabled) return ['The whole bank is disabled at its source' + (p.bank_disabled === true ? '' : ': ' + p.bank_disabled) + ' — removed from the exam.'];
      function which(x) {
        if (typeof x === 'string') return x;                 // older uploads kept only the id
        return x.id + (x.number ? ' (no. ' + x.number + ')' : '') + (x.text ? ' “' + x.text + '”' : '');
      }
      return bad.slice(0, 30).map(function (x) { return '✗ ' + which(x) + ' — ' + x.reason; })
        .concat(bad.length > 30 ? ['… and ' + (bad.length - 30) + ' more'] : [])
        .concat(bad.length ? ['Fix them in the file and add it again — the other questions are in.'] : [])
        .concat(nf.length ? ['Marked needs-fix in the file (left out on purpose):'] : [])
        .concat(nf.slice(0, 30).map(function (x) { return '• ' + which(x) + (x.reason ? ' — ' + x.reason : ''); }))
        .concat(nf.length > 30 ? ['… and ' + (nf.length - 30) + ' more'] : [])
        .concat(off.length ? ['Disabled at the source (not loaded; removed if they were in):'] : [])
        .concat(off.slice(0, 30).map(function (x) { return '○ ' + which(x) + (x.reason ? ' — ' + x.reason : ''); }))
        .concat(off.length > 30 ? ['… and ' + (off.length - 30) + ' more'] : []);
    }
    function banksCard(e) {
      var delab = e.source === 'delab';                   // its banks come from GitHub: ⟳ Sync DE exams, not by hand
      var rows = e.banks.map(function (b) {
        var x = el('button', {class: 'small danger', text: 'Remove'});
        x.addEventListener('click', function () {
          ask(x, 'Remove ' + b.bank + ' (' + b.questions + ' questions)? Submitted attempts keep them in their reviews.', 'Yes, remove', function () {
            admin.api('POST', '/api/admin/exams/delete', {exam: e.id, bank: b.bank})
              .then(function () { admin.show('Removed ' + b.bank, []); load(); })
              .catch(function (y) { admin.show('Could not remove', [y.message], null, true); });
          }, true);
        });
        return el('tr', {}, [el('td', {}, [el('b', {text: b.bank})]), el('td', {class: 'r', text: String(b.questions)}),
          el('td', {class: 'r', text: String(b.updated || 0)}), el('td', {class: 'r', text: String(b.skipped || 0)}),
          el('td', {class: 'muted', text: when(b.uploaded_at) + ' · ' + (b.uploaded_by || '')}), el('td', {class: 'acts'}, delab ? [] : [x])]);
      });
      var add = el('button', {class: 'primary', text: '+ Add question bank'}), form = addForm(e);
      form.hidden = true;
      add.addEventListener('click', function () { form.hidden = false; add.hidden = true; });
      form.addEventListener('lab:cancel', function () { form.hidden = true; add.hidden = false; });
      var hist = (e.uploads || []).map(function (u) {
        var how = {encrypted: 'encrypted file', link: 'link', file: 'own file', sync: 'DE lab sync'}[u.via];
        return el('tr', {}, [el('td', {class: 'muted', text: when(u.uploaded_at)}), el('td', {style: 'max-width:340px; overflow-wrap:anywhere'}, [el('b', {text: u.filename || u.bank}),
            el('div', {class: 'id', text: (u.filename ? u.bank : '') + (how ? (u.filename ? ' · ' : '') + how : '')})]),
          el('td', {class: 'r', text: num(u.questions)}), el('td', {class: 'r', text: num(u.new)}), el('td', {class: 'r', text: num(u.changed)}),
          el('td', {class: 'r', text: num(u.removed)}), el('td', {class: 'r', text: num(u.unchanged)}), el('td', {class: 'r'}, [num(u.skipped)].concat(u.problems ? [' ', why(u)] : [])),
          el('td', {class: 'muted', text: u.uploaded_by || ''})]);
      });
      function why(u) {                                      // the reasons, in a row under the upload
        var b = el('button', {class: 'small', text: 'why'}), row = null;
        b.addEventListener('click', function () {
          if (row) { row.remove(); row = null; return; }
          var tr = b.closest('tr');
          row = el('tr', {class: 'why'}, [el('td', {colspan: '9'}, problems(u.problems).map(function (l) { return el('div', {class: 'sub', text: l}); }))]);
          tr.parentNode.insertBefore(row, tr.nextSibling);
        });
        return b;
      }
      if (delab) add.hidden = true;
      return [el('div', {class: 'card'}, [el('div', {class: 'bar'}, [el('h3', {style: 'margin:0', text: 'Question banks'}), add]), form,
          delab ? el('div', {class: 'sub', style: 'margin-bottom:8px', text: 'A DE lab exam — its question banks come from GitHub. ⟳ Sync DE exams (on All exams) loads new and updated questions.'}) : null,
          rows.length ? el('div', {class: 'wrap'}, [el('table', {}, [th(['Bank', 'Questions', 'Updated', 'Left out', 'Last upload', '']), el('tbody', {}, rows)])])
                      : el('div', {class: 'sub', text: 'No question banks yet — + Add question bank.'})]),
        el('div', {class: 'card'}, [el('h3', {text: 'Upload history'}),
          hist.length ? el('div', {class: 'wrap'}, [el('table', {}, [th(['When', 'File', 'Questions', 'New', 'Updated', 'Removed', 'Unchanged', 'Left out', 'By']),
            el('tbody', {}, hist)])]) : el('div', {class: 'sub', text: 'Nothing uploaded yet.'})])];
    }
    // + Add question bank — three ways: an encrypted file + its key; a link to the plain file (a public
    // GitHub file or an S3 presigned URL — no key); or an own file made from the template (no key).
    // Uploaded at once; the result says what changed. (A plain exam.json works as a file too.)
    function addForm(e) {
      var WAYS = [['encrypted', 'Encrypted file'], ['link', 'Link'], ['own', 'Own file']], way = 'encrypted';
      var file = el('input', {type: 'file', accept: '.json,application/json'});
      var key = el('input', {type: 'password', placeholder: 'paste the key (base64)', autocomplete: 'off'});
      var keyFile = el('input', {type: 'file', accept: '.key,.txt'});
      var url = el('input', {type: 'url', placeholder: 'https://github.com/…/blob/main/questions/set1.json  or an S3 presigned URL'});
      var help = el('div', {class: 'sub', style: 'margin:10px 0'});
      var fileBox = el('label', {}, ['Question bank (.json)', file]), keyBox = el('label', {}, ['Key — paste it, or choose the .key file', key, keyFile]);
      var urlBox = el('label', {style: 'grid-column:1 / -1'}, ['Link to the question bank', url]);
      var tpl = el('a', {href: '/exam-template.json', download: 'exam-template.json', text: '⬇ Download the template'});
      var tplBox = el('div', {class: 'sub', style: 'margin-bottom:10px'}, [tpl, ' — a question bank with one question of each kind (one answer, several answers, ' +
        'hotspot, drag and drop, yes / no) and a case study. Replace them with yours; keep the structure. exam_id and source name the bank ' +
        '(lowercase, dashes): it shows as exam_id/source. Question ids start with the source (set1-001 …) and must not change later — ' +
        'uploading the file again then updates those questions.']);
      var seg = el('div', {class: 'seg'}, WAYS.map(function (w) {
        var b = el('button', {type: 'button', text: w[1]});
        b.addEventListener('click', function () { way = w[0]; paint(); });
        return b;
      }));
      var go_ = el('button', {class: 'primary', text: 'Upload'}), cancel = el('button', {text: 'Cancel'});
      function paint() {
        Array.prototype.forEach.call(seg.children, function (b, i) { b.className = WAYS[i][0] === way ? 'on' : ''; });
        keyBox.hidden = way !== 'encrypted'; fileBox.hidden = way === 'link'; urlBox.hidden = way !== 'link'; tplBox.hidden = way !== 'own';
        help.textContent = way === 'encrypted' ? 'A question bank you received encrypted (…enc.json) and its key — the key is used once and not kept.'
          : way === 'link' ? 'A public file on GitHub, or an AWS S3 presigned URL (it works until it expires). No key — the portal downloads the file once.'
          : 'A question bank you prepared yourself — plain JSON, no key.';
        go_.textContent = way === 'link' ? 'Add from link' : 'Upload';
      }
      var box = el('div', {class: 'addbank'}, [seg, help, tplBox,
        el('div', {class: 'upl'}, [fileBox, keyBox, urlBox]),
        el('div', {class: 'sub', style: 'margin-top:10px', text: 'A bank this exam has already is updated: changed questions get a new version, ' +
          'removed ones leave the pool — submitted attempts keep what they were marked on.'}),
        el('div', {class: 'row', style: 'margin-top:12px'}, [go_, cancel])]);
      paint();
      cancel.addEventListener('click', function () { box.dispatchEvent(new Event('lab:cancel')); });
      go_.addEventListener('click', function () {
        var label = go_.textContent, name = file.files[0] ? file.files[0].name : '';
        go_.disabled = true; go_.textContent = way === 'link' ? 'Downloading…' : 'Uploading…';
        (way === 'link'
          ? (url.value.trim() ? Promise.resolve({exam: e.id, url: url.value.trim()}) : Promise.reject(new Error('paste the link')))
          : readJson(file).then(function (d) {
              if (way === 'encrypted' && !d.format) throw new Error('this file isn\'t encrypted — choose Own file');
              if (!d.format) return {exam: e.id, file: d, filename: name};
              return (key.value.trim() ? Promise.resolve(key.value) : readText(keyFile)).then(function (k) {
                if (!k.trim()) throw new Error('this file is encrypted — paste its key or choose the .key file');
                return {exam: e.id, file: d, key: k.trim(), filename: name};
              });
            })
        ).then(function (body) { return admin.api('POST', '/api/admin/exams/upload', body); }).then(function (r) {
          if (r.details) return admin.show('Exam details saved', [r.domains + ' domains from ' + (name || 'the file')]);
          if (r.bank_disabled) return admin.show(r.bank + ' is disabled at its source', [(r.replaces ? 'Removed from the exam — its ' + r.removed +
            ' questions are out (submitted attempts keep them in their reviews).' : 'Not added.') + (r.reason ? ' Reason: ' + r.reason : ''), r.pool + ' questions in the exam now.']);
          var from = way === 'link' ? 'the link' : name, nothing = r.replaces && !r.new && !r.changed && !r.removed;
          admin.show(nothing ? r.bank + ': nothing changed' : (r.replaces ? 'Updated ' : 'Added ') + r.bank + ' from ' + from, [
            r.new + ' new · ' + r.changed + ' updated · ' + r.removed + ' removed · ' + r.unchanged + ' unchanged' +
            (r.skipped ? ' · ' + r.skipped + ' left out' : '') + ' — ' + r.pool + ' questions in the exam now.']
            .concat(r.changed_ids.length ? ['Updated: ' + r.changed_ids.join(', ') + (r.changed > r.changed_ids.length ? ' …' : '')] : [])
            .concat(r.removed_ids.length ? ['Removed: ' + r.removed_ids.join(', ') + (r.removed > r.removed_ids.length ? ' …' : '')] : [])
            .concat(problems(r))
            .concat(way === 'encrypted' ? ['The key was not stored.'] : []));
        }).then(load).catch(function (x) { admin.show('Upload failed', [x.message], null, true); go_.disabled = false; go_.textContent = label; });
      });
      return box;
    }

    // ---- Questions: every question of the exam with its right answer — filter, number grid, one at a time
    var TYPE = {choice: 'Multiple choice', hotspot: 'Hotspot', 'drag-drop': 'Drag and drop', 'yes-no': 'Yes / No'};
    function questionsCard(e) {
      var card = el('div', {class: 'card'}, [el('h3', {text: 'Questions'}), el('div', {class: 'sub', text: 'Loading…'})]);
      admin.api('GET', '/api/admin/exams/questions?exam=' + encodeURIComponent(e.id)).then(function (d) {
        var all = d.questions, shown = all, cur = 0;
        if (!all.length) { card.lastChild.textContent = 'No questions — upload a question bank.'; return; }
        var search = el('input', {type: 'search', placeholder: 'Search the text, options, answers, explanation or id…'});
        function pick(label, values) {
          return el('select', {}, [el('option', {value: '', text: label})].concat(values.map(function (v) { return el('option', {value: v, text: TYPE[v] || v}); })));
        }
        function uniq(f) { return all.map(f).filter(function (v, i, a) { return v && a.indexOf(v) === i; }).sort(); }
        var source = pick('All banks', uniq(function (q) { return q.bank; })), type = pick('All types', uniq(function (q) { return q.type; }));
        var domain = pick('All domains', uniq(function (q) { return q.domain; }));
        [].slice.call(domain.options, 1).forEach(function (o) {     // "1.1 · Science"
          var q = all.filter(function (x) { return x.domain === o.value; })[0];
          o.textContent = domainOf(d, q).replace(/^Domain /, '');
        });
        var tags = all.reduce(function (a, q) { return a.concat(q.tags || []); }, []).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
        var tag = pick('All tags', tags); tag.hidden = !tags.length;
        var state = el('select', {}, [['', 'All questions'], ['fix', 'Need fix'], ['ok', 'In the exam']].map(function (o) { return el('option', {value: o[0], text: o[1]}); }));
        var count = el('span', {class: 'sub'}), pal = el('div', {class: 'palette'}), box = el('div');
        var hay = all.map(function (q) {
          return [q.ref, q.question, q.explanation, (q.tags || []).join(' '), (q.options || []).map(function (o) { return o.text; }).join(' '),
                  (q.slots || []).map(function (s) { return s.label + ' ' + s.answer.join(' '); }).join(' ')].join(' ').toLowerCase();
        });
        function filter() {
          var t = search.value.trim().toLowerCase();
          shown = all.filter(function (q, n) {
            return (!t || hay[n].indexOf(t) >= 0) && (!source.value || q.bank === source.value) &&
                   (!type.value || q.type === type.value) && (!domain.value || q.domain === domain.value) &&
                   (!tag.value || (q.tags || []).indexOf(tag.value) >= 0) &&
                   (!state.value || (state.value === 'fix') === !!q.needs_fix);
          });
          cur = 0; paint();
        }
        [search, source, type, domain, tag, state].forEach(function (x) { x.addEventListener(x === search ? 'input' : 'change', filter); });
        function paint() {
          var fix = all.filter(function (q) { return q.needs_fix; }).length;
          count.textContent = (shown.length === all.length ? all.length + ' questions' : shown.length + ' of ' + all.length + ' questions') +
            (fix ? ' · ' + fix + ' need fix' : '');
          pal.innerHTML = ''; box.innerHTML = '';
          shown.forEach(function (q, n) {
            var b = el('button', {class: (n === cur ? 'cur' : '') + (q.needs_fix ? ' fix' : ''), text: String(n + 1),
                                  title: q.bank + '/' + q.ref + (q.needs_fix ? ' — needs fix' : '')});
            b.addEventListener('click', function () { cur = n; paint(); });
            pal.appendChild(b);
          });
          if (!shown.length) return box.appendChild(el('div', {class: 'card'}, [el('div', {class: 'sub', text: 'No question matches.'})]));
          var q = shown[cur];
          var prev = el('button', {text: '← Previous'}); prev.disabled = cur === 0;
          prev.addEventListener('click', function () { cur--; paint(); });
          var next = el('button', {text: 'Next →'}); next.disabled = cur === shown.length - 1;
          next.addEventListener('click', function () { cur++; paint(); });
          var refs = (q.refs || []).filter(function (x) { return /^https?:\/\//.test(x.url || ''); });
          box.appendChild(el('div', {class: 'card' + (q.needs_fix ? ' needsfix' : '')}, [
            q.needs_fix ? el('div', {class: 'fixnote'}, [el('b', {text: '⚠ Needs fix — not in members\' exams. '}),
              el('span', {text: (q.note || 'Marked needs-fix in the file.') + ' Fix it in the file and add the bank again.'})]) : null,
            el('div', {class: 'bar'}, [el('b', {text: 'Question ' + (cur + 1) + ' of ' + shown.length}),
              el('span', {class: 'id', text: q.bank + '/' + q.ref + (q.version > 1 ? ' · version ' + q.version + ' since ' + when(q.since) : '') + ' · ' + (TYPE[q.type] || q.type)})]),
            domainOf(d, q) ? el('div', {class: 'sub', style: 'color:var(--accent)', text: domainOf(d, q)}) : null,
            tagList(q, function (t) { tag.value = t; filter(); }),
            caseBox(d, q), el('div', {class: 'q md', html: md(q.question)}),
            q.slots ? el('table', {class: 'slots'}, [el('tbody', {}, [el('tr', {}, ['', 'Correct', 'Choices'].map(function (h) { return el('td', {class: 'muted', text: h}); }))]
              .concat(q.slots.map(function (s) {
                return el('tr', {}, [el('td', {class: 'md', html: mdLine(s.label || s.id)}), el('td', {class: 'ok', text: s.answer.join(' / ')}),
                  el('td', {class: 'muted', text: s.choices.join(' · ')})]);
              })))])
              : el('div', {}, q.options.map(function (o) {
                var good = q.answer.indexOf(o.key) >= 0;
                return el('div', {class: 'opt' + (good ? ' ok' : '')}, [el('span', {class: 'k', text: o.key}), el('span', {class: 'md', html: mdLine(o.text)}),
                  el('span', {class: 'muted', style: 'margin-left:auto; white-space:nowrap', text: good ? 'correct' : ''})]);
              })),
            q.explanation || refs.length ? el('div', {class: 'expl md', html: md(q.explanation) + (refs.length ? '<p>' + refs.map(function (x) {
              return '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title || x.url) + '</a>'; }).join(' · ') + '</p>' : '')}) : null,
            el('div', {class: 'row', style: 'justify-content:space-between; margin-top:12px'}, [prev, next])]));
        }
        card.innerHTML = '';
        card.appendChild(el('div', {class: 'qfilter'}, [search, source, type, domain, tag, state, count]));
        card.appendChild(pal);
        card.parentNode.insertBefore(box, card.nextSibling);
        paint();
      }).catch(function (x) { card.lastChild.textContent = 'Could not load: ' + x.message; });
      return [card];
    }

    function progressCard(e) {
      function discard(ctl, body, what) {
        ask(ctl, 'Delete ' + what + '? Their answers so far are lost.', 'Yes, delete', function () {
          ctl.disabled = true;
          admin.api('POST', '/api/admin/exams/discard', Object.assign({exam: e.id}, body))
            .then(function (r) { admin.show('Deleted ' + r.deleted + ' attempt(s) in progress', ['They start afresh, with the current settings.']); load(); })
            .catch(function (x) { admin.show('Could not delete', [x.message], null, true); ctl.disabled = false; });
        }, true);
      }
      if (!e.ongoing.length) return [el('div', {class: 'card'}, [el('h3', {text: 'In progress'}), el('div', {class: 'sub', text: 'No attempts in progress.'})])];
      var all = el('button', {class: 'small danger', text: 'Delete all in progress'});
      all.addEventListener('click', function () { discard(all, {}, 'all ' + e.ongoing.length + ' attempts in progress'); });
      return [el('div', {class: 'card'}, [el('div', {class: 'bar'}, [el('h3', {style: 'margin:0', text: 'In progress'}), all]),
        el('div', {class: 'sub', style: 'margin-bottom:10px', text: 'Started or paused, not submitted. Delete one and that member\'s next start draws a new set with the current settings.'}),
        el('div', {class: 'wrap'}, [el('table', {}, [th(['Member', 'Started', 'Answered', '']), el('tbody', {}, e.ongoing.map(function (a) {
          var x = el('button', {class: 'small danger', text: 'Delete'});
          x.addEventListener('click', function () { discard(x, {attempt: a.id}, a.member + '\'s attempt'); });
          return el('tr', {}, [el('td', {}, [el('b', {text: a.member})]), el('td', {class: 'muted', text: when(a.started_at)}),
            el('td', {text: a.answered + ' / ' + a.total}), el('td', {class: 'acts'}, [x])]);
        }))])])])];
    }

    function resultsCard(e) {
      var card = el('div', {class: 'card'}, [el('h3', {text: 'Results'}), el('div', {class: 'sub', text: 'Loading…'})]);
      admin.api('GET', '/api/admin/exams/results?exam=' + encodeURIComponent(e.id)).then(function (r) {
        card.innerHTML = '';
        if (!r.members.length) {
          card.appendChild(el('h3', {text: 'Results'}));
          return card.appendChild(el('div', {class: 'sub', text: 'Nobody has submitted this exam yet.'}));
        }
        card.appendChild(el('h3', {text: 'Per member'}));
        card.appendChild(el('div', {class: 'wrap'}, [el('table', {}, [th(['Member', 'Attempts', 'Passed', 'Best', 'Average', 'Last attempt']),
          el('tbody', {}, r.members.map(function (m) {
            return el('tr', {}, [el('td', {}, [el('b', {text: m.member})]), el('td', {class: 'r', text: String(m.attempts)}),
              el('td', {class: 'r', text: String(m.passed)}), el('td', {class: 'r', text: m.best + ' %'}),
              el('td', {class: 'r', text: m.average + ' %'}), el('td', {class: 'muted', text: when(m.last)})]);
          }))])]));
        card.appendChild(el('h3', {style: 'margin-top:20px', text: 'Latest attempts'}));
        card.appendChild(el('div', {class: 'wrap'}, [el('table', {}, [th(['When', 'Member', 'Score', 'Result', 'Time']),
          el('tbody', {}, r.recent.map(function (a) {
            return el('tr', {}, [el('td', {class: 'muted', text: when(a.finished_at)}), el('td', {text: a.member}),
              el('td', {class: 'r', text: a.score + ' % (' + a.correct + '/' + a.total + ')'}),
              el('td', {class: a.passed ? 'pass' : 'fail', text: a.passed ? 'passed' : 'not passed'}), el('td', {class: 'r muted', text: a.minutes + ' min'})]);
          }))])]));
      }).catch(function (x) { card.lastChild.textContent = 'Could not load: ' + x.message; });
      return [card];
    }

    function route() {
      if (!data) return;
      var m = /^exams\/([a-z0-9-]+)(?:\/(\w+))?/.exec(location.hash.slice(1));
      var e = m && data.exams.filter(function (x) { return x.id === m[1]; })[0];
      admin.fill(e ? examView(e, m[2] || 'banks') : [listCard()]);
    }
    function load() {
      admin.api('GET', '/api/admin/exams').then(function (d) { data = d; route(); }).catch(admin.failed);
    }
    load();
  </script>
</body>
</html>
