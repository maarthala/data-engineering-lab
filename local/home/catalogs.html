<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My catalogs — Epireum's Data Engineering Lab</title>
  <link rel="stylesheet" href="/admin.css?v=8">
  <style>
    body{display:flex; flex-direction:column; min-height:100vh}
    a{color:inherit; text-decoration:none}
    /* page title (under the shared lab header, lab-header.js) */
    .app{flex:1; display:grid; grid-template-columns:290px 1fr; min-height:0}
    aside{border-right:1px solid var(--line); background:var(--panel2); overflow:auto; padding:12px 10px}
    .title{font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:10px 8px 6px; display:flex; justify-content:space-between; align-items:center}
    .cat{display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:.93rem}
    .cat:hover{background:rgba(109,139,255,.08); color:var(--ink)}
    .cat.active{background:rgba(109,139,255,.16); color:var(--ink); font-weight:600}
    .tag{font-size:.68rem; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); margin-left:auto}
    .tag.read{border-color:rgba(57,208,196,.5); color:var(--accent2)} .tag.write{border-color:rgba(226,185,59,.55); color:var(--warn-ink)}
    .newcat{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 8px} .newcat input{flex:1; min-width:90px}
    .empty{color:var(--muted); padding:10px 9px; font-size:.88rem}
    main{overflow:auto; padding:18px 22px; display:flex; flex-direction:column; gap:14px}
    .card h2{margin:0 0 4px; font-size:1.15rem} .card h3{margin:0 0 10px; font-size:.95rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
    .sub{color:var(--muted); font-size:.88rem}
    td.r{text-align:right; white-space:nowrap}
    .ns td:first-child{font-weight:600; cursor:pointer; user-select:none} .ns:hover td{background:rgba(109,139,255,.06)}
    .ns .car{display:inline-block; width:14px; color:var(--muted); transition:transform .15s} .ns.open .car{transform:rotate(90deg)}
    .tbl td:first-child{padding-left:38px; color:var(--muted)} .tbl .full{font-family:ui-monospace,Menlo,monospace; font-size:.8rem; margin-left:10px; opacity:.7}
    td.r button + button{margin-left:4px}
    .helpbtn{float:right} .helpbox{margin-top:12px; padding:12px; border:1px dashed var(--line); border-radius:9px; background:var(--panel2)}
    .helpbox pre{margin-bottom:8px}
    .cardhead{display:flex; align-items:center; justify-content:space-between; gap:8px} .cardhead h3{margin:0}
    .invite{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:8px}
    .invite input{width:240px} .invite select{max-width:100%}
    .lookup{position:relative} .lookup ul{position:absolute; left:0; right:0; top:calc(100% + 4px); z-index:5; margin:0; padding:4px;
      list-style:none; background:var(--panel2); border:1px solid var(--line); border-radius:9px; box-shadow:var(--shadow)}
    .lookup li{padding:6px 10px; border-radius:7px; cursor:pointer; font-size:.92rem} .lookup li.on, .lookup li:hover{background:rgba(109,139,255,.18)}
    .lookup li.none{color:var(--muted); cursor:default; background:none}
    pre{margin:0; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow:auto; font-size:.86rem}
    .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line);
           padding:10px 16px; border-radius:10px; box-shadow:var(--shadow); display:none; z-index:10}
    .toast.err{border-color:var(--danger); color:var(--bad-ink)}
    .placeholder{color:var(--muted); padding:40px; text-align:center}
    /* a table's own panel: columns · snapshots · properties */
    .tbl td:first-child .tname{cursor:pointer; color:var(--ink)} .tbl td:first-child .tname:hover{color:var(--accent); text-decoration:underline}
    .tbl.sel td{background:var(--accent-bg)}
    .tstats{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:10px; margin:10px 0 12px}
    .tstats div{border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--panel)}
    .tstats b{display:block; font-size:1.1rem} .tstats span{font-size:.76rem; color:var(--muted)}
    .ttabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin:4px 0 10px}
    .ttabs a{padding:7px 12px; cursor:pointer; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; font-size:.88rem}
    .ttabs a.on{color:var(--accent); border-bottom-color:var(--accent)}
    .mono{font-family:ui-monospace,Menlo,monospace; font-size:.8rem}
    .pillk{font-size:.7rem; padding:1px 7px; border-radius:999px; background:var(--accent-bg); color:var(--accent); margin-left:6px}
    .tscroll{max-height:380px; overflow:auto}
    @media (max-width:760px){ .app{grid-template-columns:1fr} aside{max-height:35vh; border-right:0; border-bottom:1px solid var(--line)} }
</style>
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=16"></script>
  <div class="pagebar"><h1>🗂️ My catalogs <span class="dot">·</span> your namespaces, tables and who you share them with</h1></div>
  <div class="app">
    <aside>
      <div class="title"><span>My catalogs</span><button class="small" id="new">＋ New</button></div>
      <div id="newrow"></div>
      <div id="owned"><div class="empty">Loading…</div></div>
      <div class="title"><span>Shared with me</span></div>
      <div id="shared"></div>
    </aside>
    <main id="main"><div class="placeholder">Select a catalog on the left.</div></main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // Everything goes through /api/catalogs (home-api, behind the Keycloak login). The server
    // checks you OWN a catalog before creating, listing or changing its shares; Polaris then
    // enforces what each learner may read or write.
    var $ = function (id) { return document.getElementById(id); };
    var state = {data: null, sel: null, user: ''};
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function toast(m, err) { var t = $('toast'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
      clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 3500); }
    function api(method, path, params) {
      var q = new URLSearchParams(params || {}).toString();
      return fetch('/api/catalogs' + path + (q ? '?' + q : ''), {method: method, credentials: 'same-origin'})
        .then(function (r) { return r.json().then(function (j) { return {ok: r.ok, body: j}; }); });
    }
    // what a share covers, in words
    function what(s) {
      return s.scope === 'lake' || !s.namespace ? 'the whole lake (every namespace and table)'
        : s.table ? 'table ' + s.namespace + '.' + s.table : 'namespace ' + s.namespace + ' (all its tables)';
    }

    function snippet(cat, ns, table) {
      var pre = el('pre');
      pre.textContent = 'use_catalog("' + cat + '")\n' +
        (ns ? 'spark.sql("SELECT * FROM ' + cat + '.' + ns + '.' + (table || '<table>') + '").show()'
            : 'spark.sql("SHOW NAMESPACES IN ' + cat + '").show()');
      return pre;
    }

    // "ⓘ How to use it" in a catalog's header card: the notebook / SQL hint, closed until asked for
    function help(head, nodes) {
      var b = el('button', 'small helpbtn', 'ⓘ How to use it'), box = el('div', 'helpbox'); box.hidden = true;
      nodes.forEach(function (x) { box.appendChild(x); });
      b.onclick = function () { box.hidden = !box.hidden; b.textContent = box.hidden ? 'ⓘ How to use it' : '✕ Hide help'; };
      head.insertBefore(b, head.firstChild); head.appendChild(box);
    }
    function load(keep) {
      return api('GET', '').then(function (r) {
        if (!r.ok) return toast(r.body.error || 'could not load catalogs', true);
        state.data = r.body; sidebar();
        if (keep && state.sel) return open(state.sel.name, state.sel.kind);
        var want = decodeURIComponent(location.hash.slice(1)), all = state.data.owned.concat(state.data.shared);
        var c = all.filter(function (x) { return x.name === want; })[0] || state.data.owned.filter(function (x) { return x.default; })[0];
        if (c) open(c.name, state.data.shared.indexOf(c) >= 0 ? 'shared' : 'owned');
      });
    }
    function sidebar() {
      var o = $('owned'); o.innerHTML = '';
      state.data.owned.forEach(function (c) {
        var d = el('div', 'cat'); d.appendChild(el('span', null, '🗂️ ' + c.name));
        if (c.default) d.appendChild(el('span', 'tag', 'main lakehouse'));
        if (c.team) d.appendChild(el('span', 'tag', 'team lakehouse'));
        d.onclick = function () { open(c.name, 'owned'); }; d.dataset.name = c.name; o.appendChild(d);
      });
      var s = $('shared'); s.innerHTML = '';
      if (!state.data.shared.length) s.appendChild(el('div', 'empty', 'Nothing shared with you yet.'));
      state.data.shared.forEach(function (c) {
        var d = el('div', 'cat'); d.appendChild(el('span', null, '🤝 ' + c.name));
        var w = c.shares.some(function (x) { return x.access === 'write'; });
        d.appendChild(el('span', 'tag ' + (w ? 'write' : 'read'), w ? 'read + write' : 'read'));
        d.onclick = function () { open(c.name, 'shared'); }; d.dataset.name = c.name; s.appendChild(d);
      });
      highlight();
    }
    function highlight() {
      Array.prototype.forEach.call(document.querySelectorAll('.cat'), function (d) {
        d.classList.toggle('active', !!state.sel && d.dataset.name === state.sel.name); });
    }

    function open(name, kind) {
      state.sel = {name: name, kind: kind}; highlight();
      history.replaceState(null, '', '#' + encodeURIComponent(name));
      var m = $('main'); m.innerHTML = '';
      if (kind === 'shared') {
        var c = state.data.shared.filter(function (x) { return x.name === name; })[0];
        var card = el('div', 'card'); card.appendChild(el('h2', null, '🤝 ' + name));
        card.appendChild(el('div', 'sub', 'Shared with you by ' + name.split('_')[0] + '.'));
        m.appendChild(card);
        var acc = el('div', 'card'); acc.appendChild(el('h3', null, 'What you can access'));
        var t = el('table'); t.innerHTML = '<tr><th>What</th><th>Access</th></tr>';
        c.shares.forEach(function (s) {
          var tr = el('tr'); tr.appendChild(el('td', null, what(s)));
          var td = el('td'); td.appendChild(el('span', 'tag ' + s.access, s.access === 'write' ? 'read + write' : 'read')); tr.appendChild(td); t.appendChild(tr);
        });
        acc.appendChild(t);
        if (/_lake$/.test(name) && c.shares.some(function (s) { return s.scope === 'lake' || !s.namespace; }))
          acc.appendChild(el('div', 'sub', 'Their files come with the lake: 📁 My files → 🤝 Shared with me.'));
        m.appendChild(acc);
        help(card, [snippet(name, c.shares[0].namespace, c.shares[0].table)]);
        return;
      }
      var info = state.data.owned.filter(function (x) { return x.name === name; })[0];
      var head = el('div', 'card'); head.appendChild(el('h2', null, '🗂️ ' + name));
      if (info.team) {          // the team's: every member reads and writes it, nothing to share
        head.appendChild(el('div', 'sub', 'Your team\'s lakehouse — every member of the team reads and writes it, by its name ' + name + ' in notebooks, SQLPad and Superset · stored in ' + info.location));
        m.appendChild(head);
        var tp = el('pre'); tp.textContent = '# notebooks: already set up\nspark.sql("SHOW TABLES IN ' + name + '.bronze").show()\n\n-- SQLPad\nSELECT * FROM ' + name + '.bronze.<table>;';
        help(head, [tp]);
        return;
      }
      head.appendChild(el('div', 'sub', (info.default ? 'Your main lakehouse (`my` in your notebooks)' : 'Your catalog') + ' · stored in ' + info.location));
      m.appendChild(head);
      // 🤝 Invite: closed until asked for; its namespace list is fetched when it opens
      var inv = el('div', 'card'), ihead = el('div', 'cardhead');
      ihead.appendChild(el('h3', null, '🤝 Sharing'));
      var iopen = el('button', 'small', '＋ Invite a member'); ihead.appendChild(iopen); inv.appendChild(ihead);
      var ibody = el('div'); ibody.style.display = 'none'; ibody.style.marginTop = '10px';
      var who = el('input'); who.type = 'text'; who.placeholder = 'member username (type 3+ letters)'; who.autocomplete = 'off';
      // lookup: from 3 letters, the matching members in a list under the box (↑ ↓ Enter, or click)
      var look = el('div', 'lookup'), found = el('ul'); found.hidden = true; look.appendChild(who); look.appendChild(found);
      var lookT, pick = -1;
      function names() { return Array.prototype.filter.call(found.children, function (li) { return !li.classList.contains('none'); }); }
      function mark(i) { var n = names(); pick = n.length ? (i + n.length) % n.length : -1; n.forEach(function (li, j) { li.classList.toggle('on', j === pick); }); }
      function choose(n) { who.value = n; found.hidden = true; acc.focus(); }
      who.oninput = function () {
        clearTimeout(lookT); var q = who.value.trim().toLowerCase();
        if (q.length < 3) { found.hidden = true; return; }
        lookT = setTimeout(function () {
          api('GET', '/members', {q: q}).then(function (r) {
            if (!r.ok || who.value.trim().toLowerCase() !== q) return;
            found.innerHTML = ''; pick = -1;
            if (!r.body.length) found.appendChild(el('li', 'none', 'no member matches “' + q + '”'));
            r.body.forEach(function (n) {
              var li = el('li', null, n); found.appendChild(li);
              li.onmousedown = function (e) { e.preventDefault(); choose(n); };
            });
            found.hidden = false;
          });
        }, 200);
      };
      who.onblur = function () { found.hidden = true; };
      var acc = el('select'); acc.innerHTML = '<option value="read">read</option><option value="write">read + write</option>';
      var scope = el('select'); scope.innerHTML = '<option value="">the whole lake</option>';
      var go = el('button', 'primary small', 'Invite');
      var irow = el('div', 'invite'); [look, acc, el('span', 'sub', 'to'), scope, go].forEach(function (x) { irow.appendChild(x); });
      ibody.appendChild(irow);
      ibody.appendChild(el('div', 'sub', 'The whole lake: every namespace and its tables, also ones you make later (read + write: they can also create and drop tables)' +
        (info.default ? ', and your files (files/ in your bucket, under 📁 My files → 🤝 Shared with me for them)' : '') +
        '. Or one namespace (e.g. bronze) and all its tables. They find it under Shared with me.'));
      inv.appendChild(ibody);
      var scoped = false;
      iopen.onclick = function () {
        var show = ibody.style.display === 'none';
        ibody.style.display = show ? '' : 'none'; iopen.textContent = show ? 'Close' : '＋ Invite a member';
        if (show) who.focus();
        if (show && !scoped) { scoped = true; namespaces().then(function (list) {
          list.forEach(function (n) { scope.appendChild(el('option', null, 'namespace ' + n)).value = n; }); }); }
      };
      var stab = el('table'); stab.style.marginTop = '8px'; inv.appendChild(stab);
      // Namespaces & tables: namespaces closed; a namespace's tables load when it's opened
      var tree = el('div', 'card'), thead = el('div', 'cardhead'), nsNew = el('button', 'small', '＋ New namespace');
      thead.appendChild(el('h3', null, 'Namespaces & tables')); thead.appendChild(nsNew); tree.appendChild(thead);
      var nsBox = el('div', 'invite'); nsBox.hidden = true; tree.appendChild(nsBox);
      nsNew.onclick = function () {             // name + Create / Cancel, in place
        if (!nsBox.hidden) return nsBox.querySelector('input').focus();
        nsBox.innerHTML = ''; nsBox.hidden = false;
        var inp = el('input'); inp.type = 'text'; inp.placeholder = 'e.g. bronze'; inp.autocomplete = 'off';
        var ok = el('button', 'small primary', 'Create'), no = el('button', 'small', 'Cancel');
        [inp, ok, no].forEach(function (x) { nsBox.appendChild(x); }); inp.focus();
        function close() { nsBox.hidden = true; nsBox.innerHTML = ''; }
        function create() {
          var n = inp.value.trim().toLowerCase(); if (!n) return inp.focus();
          ok.disabled = true;
          api('POST', '/namespaces', {catalog: name, namespace: n}).then(function (r) {
            ok.disabled = false;
            if (!r.ok) return toast(r.body.error, true);
            toast('Created namespace ' + n); close(); open(name, 'owned');
          });
        }
        ok.onclick = create; no.onclick = close;
        inp.onkeydown = function (e) { if (e.key === 'Enter') create(); if (e.key === 'Escape') close(); };
      };
      var tbody = el('table'); tree.appendChild(tbody); m.appendChild(tree);
      var pane = el('div'); m.appendChild(pane);                   // the opened table's card
      m.appendChild(inv);
      tbody.innerHTML = '<tr><td class="sub">Loading…</td></tr>';
      help(head, [info.default ? (function () { var p = el('pre'); p.textContent = '# notebooks: already set up as `my`\nspark.sql("SHOW NAMESPACES IN my").show()\n\n-- SQL editor\nSELECT * FROM ' + name + '.<namespace>.<table>;'; return p; })() : snippet(name),
        el('div', 'sub', 'Tables are made by code (e.g. df.writeTo("' + (info.default ? 'my' : name) + '.bronze.orders").create()) or by 📡 Ingestion. ⧉ next to a table copies its full name.')]);

      var nsList;
      function namespaces() {
        return nsList || (nsList = api('GET', '/tree', {catalog: name}).then(function (r) {
          if (!r.ok) { nsList = null; toast(r.body.error, true); return []; }
          return r.body;
        }));
      }
      namespaces().then(function (list) {
        tbody.innerHTML = '';
        if (!list.length) { var e = el('tr'); var td = el('td', 'sub', 'No namespaces yet — click ＋ New namespace.'); e.appendChild(td); tbody.appendChild(e); }
        list.forEach(function (n) {
          var tr = el('tr', 'ns'), td = el('td');
          td.appendChild(el('span', 'car', '▸')); td.appendChild(document.createTextNode(' 📁 ' + n));
          tr.appendChild(td); tbody.appendChild(tr);
          var rows = null;
          tr.appendChild(del('namespace ' + n + ' (it must be empty)', '/namespaces', {catalog: name, namespace: n}, function () {
            (rows || []).forEach(function (x) { x.remove(); }); tr.remove();
          }));
          tr.onclick = function (e) {
            if (e.target.closest('td.r')) return;
            var opening = !tr.classList.contains('open'); tr.classList.toggle('open', opening);
            if (rows) { rows.forEach(function (x) { x.style.display = opening ? '' : 'none'; }); return; }
            var wait = row('Loading…', 'tbl'); tr.after(wait); rows = [wait];
            api('GET', '/tree', {catalog: name, namespace: n}).then(function (r) {
              wait.remove();
              if (!r.ok) { rows = null; tr.classList.remove('open'); return toast(r.body.error, true); }
              rows = (r.body.length ? r.body.map(function (t) {
                var x = el('tr', 'tbl'), full = name + '.' + n + '.' + t, cell = el('td');
                var tn = el('span', 'tname', '▦ ' + t); tn.title = 'Open the table'; cell.appendChild(tn); x.appendChild(cell);
                x.firstChild.appendChild(el('span', 'full', full));
                tn.onclick = function () { detail(n, t, x); };
                x.appendChild(del('table ' + n + '.' + t + ' and its files', '/tables', {catalog: name, namespace: n, table: t}, function () {
                  x.remove(); rows.splice(rows.indexOf(x), 1);
                }, full));
                return x;
              }) : [row('no tables yet — write one from a notebook, or with 📡 Ingestion', 'tbl')]);
              var at = tr; rows.forEach(function (x) { x.style.display = tr.classList.contains('open') ? '' : 'none'; at.after(x); at = x; });
            });
          };
        });
      });
      shares();

      function row(label, cls) { var tr = el('tr', cls); tr.appendChild(el('td', null, label)); return tr; }
      function detail(n, t, tr) { tableCard(pane, name, n, t, tr); }
      // 🗑 → "Delete …? Yes / Cancel" in the same cell (no browser popups)
      function del(what, path, params, gone, copy, label) {
        var td = el('td', 'r');
        function idle() {
          td.innerHTML = '';
          if (copy) {                                // ⧉ the table's full name, for SQL
            var c = el('button', 'small', '⧉'); c.title = 'Copy ' + copy; td.appendChild(c);
            c.onclick = function () {
              (navigator.clipboard ? navigator.clipboard.writeText(copy) : Promise.reject()).then(
                function () { toast('Copied ' + copy); }, function () { toast(copy); });
            };
          }
          var b = el('button', label ? 'small danger' : 'small', label || '🗑'); b.title = label || 'Delete'; td.appendChild(b);
          b.onclick = function () {
            td.innerHTML = ''; td.appendChild(el('span', 'sub', 'Delete ' + what + '? '));
            var yes = el('button', 'small danger', 'Yes'), no = el('button', 'small', 'Cancel');
            td.appendChild(yes); td.appendChild(document.createTextNode(' ')); td.appendChild(no);
            no.onclick = idle;
            yes.onclick = function () {
              yes.disabled = no.disabled = true;
              api('DELETE', path, params).then(function (r) {
                if (!r.ok) { idle(); return toast(r.body.error, true); }
                toast((label ? label + 'd: ' : 'Deleted ') + what.split(' (')[0].replace(' and its files', '')); nsList = null; gone();
              });
            };
          };
        }
        idle(); return td;
      }
      function invite() {
        if (!who.value.trim()) return who.focus();
        var p = {catalog: name, grantee: who.value.trim(), access: acc.value};
        if (scope.value) p.namespace = scope.value;
        go.disabled = true;
        api('POST', '/shares', p).then(function (r) {
          go.disabled = false;
          if (!r.ok) return toast(r.body.error, true);
          toast('Invited ' + r.body.grantee + (r.body.files ? ' — tables and files' : '')); who.value = ''; shares();
        });
      }
      go.onclick = invite;
      who.onkeydown = function (e) {
        var open = !found.hidden && names().length;
        if (e.key === 'ArrowDown' && open) { e.preventDefault(); mark(pick + 1); }
        else if (e.key === 'ArrowUp' && open) { e.preventDefault(); mark(pick - 1); }
        else if (e.key === 'Escape') found.hidden = true;
        else if (e.key === 'Enter') { if (open && pick >= 0) choose(names()[pick].textContent); else invite(); }
      };
      function shares() {
        api('GET', '/shares', {catalog: name}).then(function (r) {
          stab.innerHTML = '';
          if (!r.ok) return toast(r.body.error, true);
          if (!r.body.length) { var e = el('tr'); e.appendChild(el('td', 'sub', 'Not shared with anyone yet.')); stab.appendChild(e); return; }
          stab.innerHTML = '<tr><th>Member</th><th>What</th><th>Access</th><th></th></tr>';
          r.body.forEach(function (s) {
            var tr = el('tr'); tr.appendChild(el('td', null, s.grantees.join(', ')));
            tr.appendChild(el('td', null, what(s) + (info.default && (s.scope === 'lake' || !s.namespace) ? ' + your files' : '')));
            var a = el('td'); a.appendChild(el('span', 'tag ' + s.access, s.access === 'write' ? 'read + write' : 'read')); tr.appendChild(a);
            tr.appendChild(del(s.grantees.join(', ') + '\'s access', '/shares', {catalog: name, role: s.role}, shares, null, 'Revoke'));
            stab.appendChild(tr);
          });
        });
      }
    }

    // ---- a table's card -----------------------------------------------------------------------
    function size(b) { var u = ['B', 'KB', 'MB', 'GB', 'TB'], i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return (i ? b.toFixed(1) : b) + ' ' + u[i]; }
    function when(ms) { return ms ? new Date(ms).toLocaleString([], {dateStyle: 'medium', timeStyle: 'medium'}) : '—'; }
    function copyBtn(label, text, title) {
      var c = el('button', 'small', label); c.title = title || ('Copy: ' + text);
      c.onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
        function () { toast('Copied'); }, function () { toast(text); }); };
      return c;
    }
    function tableCard(pane, cat, ns, table, tr) {
      Array.prototype.forEach.call(document.querySelectorAll('.tbl.sel'), function (x) { x.classList.remove('sel'); });
      if (tr) tr.classList.add('sel');
      pane.innerHTML = '';
      var card = el('div', 'card'); pane.appendChild(card);
      card.appendChild(el('div', 'sub', 'Loading ' + ns + '.' + table + '…'));
      card.scrollIntoView({behavior: 'smooth', block: 'nearest'});
      api('GET', '/table', {catalog: cat, namespace: ns, table: table}).then(function (r) {
        card.innerHTML = '';
        if (!r.ok) return card.appendChild(el('div', 'sub', '✗ ' + (r.body.error || 'could not load the table')));
        var d = r.body, head = el('div', 'cardhead');
        var h = el('h2', null, '▦ ' + ns + '.' + table); h.style.fontSize = '1.05rem'; head.appendChild(h);
        var acts = el('span'); acts.appendChild(copyBtn('⧉ Name', d.name));
        var x = el('button', 'small', '✕'); x.title = 'Close'; x.style.marginLeft = '6px';
        x.onclick = function () { pane.innerHTML = ''; if (tr) tr.classList.remove('sel'); }; acts.appendChild(x);
        head.appendChild(acts); card.appendChild(head);
        card.appendChild(el('div', 'sub', d.name + ' · Iceberg v' + d.format_version + ' · changed ' + when(d.updated)));
        var st = el('div', 'tstats'), now = d.now || {records: 0, data_files: 0, delete_files: 0, bytes: 0};
        [[now.records.toLocaleString(), 'rows'], [now.data_files, 'data files'], [now.delete_files, 'delete files'],
         [size(now.bytes), 'on storage'], [d.snapshot_count, 'snapshots']].forEach(function (x) {
          var b = el('div'); b.appendChild(el('b', null, String(x[0]))); b.appendChild(el('span', null, x[1])); st.appendChild(b); });
        card.appendChild(st);
        if (now.delete_files)
          card.appendChild(el('div', 'sub', '↳ ' + now.delete_files + ' delete file(s): changes not yet merged into the data files — compaction (maintenance) merges them.'));
        var tabs = el('div', 'ttabs'), body = el('div'); card.appendChild(tabs); card.appendChild(body);
        var pages = [
          ['Columns (' + d.columns.length + ')', function () {
            var t = el('table'); t.innerHTML = '<tr><th>#</th><th>Column</th><th>Type</th><th></th></tr>';
            d.columns.forEach(function (c) {
              var tr = el('tr'); tr.appendChild(el('td', 'sub', String(c.id)));
              var nm = el('td', null, c.name); if (c.key) nm.appendChild(el('span', 'pillk', 'key')); tr.appendChild(nm);
              tr.appendChild(el('td', 'mono', c.type)); tr.appendChild(el('td', 'sub', c.required ? 'not null' : ''));
              t.appendChild(tr);
            });
            body.appendChild(t);
            body.appendChild(el('div', 'sub', 'Partitioned by: ' + (d.partitioning.length ? d.partitioning.join(', ') : 'nothing (one partition)')));
          }],
          ['Snapshots (' + d.snapshot_count + ')', function () {
            body.appendChild(el('div', 'sub', 'Every write makes a snapshot — a version of the table you can still read (time travel), until maintenance expires it.'));
            var w = el('div', 'tscroll'), t = el('table'); w.appendChild(t);
            t.innerHTML = '<tr><th>When</th><th>Operation</th><th class="r">Rows +</th><th class="r">Rows −</th><th class="r">Files + / −</th><th class="r">Rows then</th><th></th></tr>';
            d.snapshots.forEach(function (s) {
              var tr = el('tr'), w0 = el('td', null, when(s.at));
              if (s.current) w0.appendChild(el('span', 'pillk', 'current'));
              tr.appendChild(w0); tr.appendChild(el('td', null, (s.operation || '') + (s.engine ? ' · ' + s.engine : '')));
              [s.added_records, s.deleted_records].forEach(function (v) { tr.appendChild(el('td', 'r', v ? v.toLocaleString() : '—')); });
              tr.appendChild(el('td', 'r', s.added_files + ' / ' + s.removed_files));
              tr.appendChild(el('td', 'r', s.total_records.toLocaleString()));
              var a = el('td', 'r');
              a.appendChild(copyBtn('⧉ SQL', 'SELECT * FROM ' + d.name + ' FOR VERSION AS OF ' + s.id,
                'Copy a query of the table as it was then (SQL editor / Trino)'));
              tr.appendChild(a); t.appendChild(tr);
            });
            body.appendChild(w);
            if (d.snapshot_count > d.snapshots.length) body.appendChild(el('div', 'sub', 'The newest ' + d.snapshots.length + ' of ' + d.snapshot_count + '.'));
            var p = el('pre'); p.style.marginTop = '10px';
            p.textContent = '-- SQL editor (Trino): the table as it was\nSELECT * FROM ' + d.name + ' FOR VERSION AS OF <snapshot id>;\nSELECT * FROM ' + d.name +
              ' FOR TIMESTAMP AS OF TIMESTAMP \'2026-11-03 10:00:00 UTC\';\n\n# notebooks (Spark)\nspark.sql("SELECT * FROM ' + d.name + ' VERSION AS OF <snapshot id>").show()';
            body.appendChild(p);
          }],
          ['Properties', function () {
            var t = el('table'); t.innerHTML = '<tr><th>Property</th><th>Value</th></tr>';
            var tr0 = el('tr'); tr0.appendChild(el('td', null, 'location')); tr0.appendChild(el('td', 'mono', d.location)); t.appendChild(tr0);
            Object.keys(d.properties).sort().forEach(function (k) {
              var tr = el('tr'); tr.appendChild(el('td', 'mono', k)); tr.appendChild(el('td', 'mono', d.properties[k])); t.appendChild(tr); });
            body.appendChild(t);
          }]];
        pages.forEach(function (pg, i) {
          var a = el('a', i ? '' : 'on', pg[0]); tabs.appendChild(a);
          a.onclick = function () { Array.prototype.forEach.call(tabs.children, function (x) { x.classList.toggle('on', x === a); });
            body.innerHTML = ''; pg[1](); };
        });
        pages[0][1]();
      });
    }

    $('new').onclick = function () {
      var box = $('newrow'); if (box.firstChild) { box.innerHTML = ''; return; }   // ＋ New again = close
      var d = el('div', 'newcat'), inp = el('input'); inp.type = 'text'; inp.placeholder = 'name, e.g. sales';
      var ok = el('button', 'primary small', 'Create'), cancel = el('button', 'small', 'Cancel');
      d.appendChild(el('span', 'sub', state.user + '_')); d.appendChild(inp); d.appendChild(ok); d.appendChild(cancel);
      box.appendChild(d); inp.focus();
      cancel.onclick = function () { box.innerHTML = ''; };
      function create() {
        api('POST', '', {name: inp.value.trim().toLowerCase()}).then(function (r) {
          if (!r.ok) return toast(r.body.error, true);
          toast('Created ' + r.body.name); box.innerHTML = ''; load().then(function () { open(r.body.name, 'owned'); });
        });
      }
      ok.onclick = create; inp.onkeydown = function (e) { if (e.key === 'Enter') create(); if (e.key === 'Escape') box.innerHTML = ''; };
    };
    document.addEventListener('lab:me', function (e) { state.user = e.detail.principal || e.detail.user; });
    load();
  </script>
</body>
</html>
