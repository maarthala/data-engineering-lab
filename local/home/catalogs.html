<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My catalogs — Epireum's Data Engineering Lab</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#141b2e; --panel2:#1b2438; --line:#2a3550;
      --ink:#e8edf7; --muted:#9aa8c7; --accent:#6d8bff; --accent2:#39d0c4; --danger:#ff6b6b; --gold:#e2b93b;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; color:var(--ink); display:flex; flex-direction:column;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:radial-gradient(1200px 600px at 80% -10%, rgba(109,139,255,.18), transparent 60%),
                 radial-gradient(900px 500px at -10% 10%, rgba(57,208,196,.12), transparent 55%), var(--bg)}
    a{color:inherit; text-decoration:none}
    button{font:inherit; cursor:pointer; border-radius:9px; padding:6px 12px; border:1px solid var(--line); background:var(--panel2); color:var(--ink)}
    button:hover{border-color:var(--accent)}
    button.primary{border:0; font-weight:700; color:#0b1020; background:linear-gradient(135deg,var(--accent),var(--accent2))}
    button.small{padding:3px 9px; font-size:.82rem}
    button.danger{border-color:rgba(255,107,107,.55); color:#ffb3b0}
    input[type=text], select{font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 9px; outline:none}
    input[type=text]:focus, select:focus{border-color:var(--accent)}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent2)}
    /* page title (under the shared lab header, lab-header.js) */
    .pagebar{padding:10px 28px; border-bottom:1px solid var(--line); background:rgba(20,27,46,.45)}
    .pagebar h1{margin:0; font-size:1.1rem; font-weight:800} .pagebar h1 .dot{color:var(--accent)}
    .app{flex:1; display:grid; grid-template-columns:290px 1fr; min-height:0}
    aside{border-right:1px solid var(--line); background:rgba(20,27,46,.55); overflow:auto; padding:12px 10px}
    .title{font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:10px 8px 6px; display:flex; justify-content:space-between; align-items:center}
    .cat{display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:8px; cursor:pointer; color:var(--muted); font-size:.93rem}
    .cat:hover{background:rgba(109,139,255,.08); color:var(--ink)}
    .cat.active{background:rgba(109,139,255,.16); color:var(--ink); font-weight:600}
    .tag{font-size:.68rem; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); margin-left:auto}
    .tag.read{border-color:rgba(57,208,196,.5); color:var(--accent2)} .tag.write{border-color:rgba(226,185,59,.55); color:#f3d98b}
    .newcat{display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:6px 8px} .newcat input{flex:1; min-width:90px}
    .empty{color:var(--muted); padding:10px 9px; font-size:.88rem}
    main{overflow:auto; padding:18px 22px; display:flex; flex-direction:column; gap:14px}
    .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
    .card h2{margin:0 0 4px; font-size:1.15rem} .card h3{margin:0 0 10px; font-size:.95rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
    .sub{color:var(--muted); font-size:.88rem}
    table{width:100%; border-collapse:collapse}
    td,th{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:.92rem; vertical-align:middle}
    th{color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.05em}
    tr:last-child td{border-bottom:0}
    td.r{text-align:right; white-space:nowrap}
    .ns td:first-child{font-weight:600} .tbl td:first-child{padding-left:30px; color:var(--muted)}
    .shareform td{background:rgba(57,208,196,.06)}
    .shareform input{width:170px}
    pre{margin:0; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px; overflow:auto; font-size:.86rem}
    .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--line);
           padding:10px 16px; border-radius:10px; box-shadow:var(--shadow); display:none; z-index:10}
    .toast.err{border-color:var(--danger); color:#ffb3b0}
    .placeholder{color:var(--muted); padding:40px; text-align:center}
    @media (max-width:760px){ .app{grid-template-columns:1fr} aside{max-height:35vh; border-right:0; border-bottom:1px solid var(--line)} }
    .plink{display:inline-block;margin-top:8px;font-size:.88rem;color:var(--accent);font-weight:600}
</style>
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=7"></script>
  <div class="pagebar"><h1>🗂️ My catalogs <span class="dot">·</span> Polaris</h1></div>
  <div class="app">
    <aside>
      <div class="title"><span>My catalogs</span><button class="small" id="new">＋ New</button></div>
      <div id="newrow"></div>
      <div id="owned"><div class="empty">Loading…</div></div>
      <div class="title"><span>Shared with me</span></div>
      <div id="shared"></div>
    </aside>
    <main id="main"><div class="placeholder">Select a catalog on the left.</div></main>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    // Everything goes through /api/catalogs (home-api, behind the Keycloak login). The server
    // checks you OWN a catalog before creating, listing or changing its shares; Polaris then
    // enforces what each learner may read or write.
    var $ = function (id) { return document.getElementById(id); };
    var state = {data: null, sel: null, user: ''};
    // The Polaris Console can't LIST catalogs for learners (only its admin role may), but it
    // opens a catalog you own directly by name.
    var POLARIS_UI = /(^|\.)de\.lan$/.test(location.hostname) ? 'http://polaris-console.' + location.hostname : 'http://localhost:8189';
    function polarisLink(name) {
      var a = el('a', 'plink', 'Open in Polaris Console ↗'); a.href = POLARIS_UI + '/catalogs/' + encodeURIComponent(name);
      a.target = '_blank'; a.rel = 'noopener'; return a;
    }
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function toast(m, err) { var t = $('toast'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
      clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 3500); }
    function api(method, path, params) {
      var q = new URLSearchParams(params || {}).toString();
      return fetch('/api/catalogs' + path + (q ? '?' + q : ''), {method: method, credentials: 'same-origin'})
        .then(function (r) { return r.json().then(function (j) { return {ok: r.ok, body: j}; }); });
    }
    function snippet(cat, ns, table) {
      var pre = el('pre');
      pre.textContent = 'use_catalog("' + cat + '")\n' +
        (ns ? 'spark.sql("SELECT * FROM ' + cat + '.' + ns + '.' + (table || '<table>') + '").show()'
            : 'spark.sql("SHOW NAMESPACES IN ' + cat + '").show()');
      return pre;
    }

    function load(keep) {
      return api('GET', '').then(function (r) {
        if (!r.ok) return toast(r.body.error || 'could not load catalogs', true);
        state.data = r.body; sidebar();
        if (keep && state.sel) open(state.sel.name, state.sel.kind);
      });
    }
    function sidebar() {
      var o = $('owned'); o.innerHTML = '';
      state.data.owned.forEach(function (c) {
        var d = el('div', 'cat'); d.appendChild(el('span', null, '🗂️ ' + c.name));
        if (c.default) d.appendChild(el('span', 'tag', 'main lakehouse'));
        if (c.team) d.appendChild(el('span', 'tag', 'team lakehouse'));
        d.onclick = function () { open(c.name, 'owned'); }; d.dataset.name = c.name; o.appendChild(d);
      });
      var s = $('shared'); s.innerHTML = '';
      if (!state.data.shared.length) s.appendChild(el('div', 'empty', 'Nothing shared with you yet.'));
      state.data.shared.forEach(function (c) {
        var d = el('div', 'cat'); d.appendChild(el('span', null, '🤝 ' + c.name));
        var w = c.shares.some(function (x) { return x.access === 'write'; });
        d.appendChild(el('span', 'tag ' + (w ? 'write' : 'read'), w ? 'read + write' : 'read'));
        d.onclick = function () { open(c.name, 'shared'); }; d.dataset.name = c.name; s.appendChild(d);
      });
      highlight();
    }
    function highlight() {
      Array.prototype.forEach.call(document.querySelectorAll('.cat'), function (d) {
        d.classList.toggle('active', !!state.sel && d.dataset.name === state.sel.name); });
    }

    function open(name, kind) {
      state.sel = {name: name, kind: kind}; highlight();
      var m = $('main'); m.innerHTML = '';
      if (kind === 'shared') {
        var c = state.data.shared.filter(function (x) { return x.name === name; })[0];
        var card = el('div', 'card'); card.appendChild(el('h2', null, '🤝 ' + name));
        card.appendChild(el('div', 'sub', 'Shared with you by ' + name.split('_')[0] + '.'));
        card.appendChild(polarisLink(name));
        m.appendChild(card);
        var acc = el('div', 'card'); acc.appendChild(el('h3', null, 'What you can access'));
        var t = el('table'); t.innerHTML = '<tr><th>Namespace</th><th>Table</th><th>Access</th></tr>';
        c.shares.forEach(function (s) {
          var tr = el('tr'); tr.appendChild(el('td', null, s.namespace)); tr.appendChild(el('td', null, s.table || 'all tables'));
          var td = el('td'); td.appendChild(el('span', 'tag ' + s.access, s.access === 'write' ? 'read + write' : 'read')); tr.appendChild(td); t.appendChild(tr);
        });
        acc.appendChild(t); m.appendChild(acc);
        var nb = el('div', 'card'); nb.appendChild(el('h3', null, 'Use it in a notebook'));
        nb.appendChild(snippet(name, c.shares[0].namespace, c.shares[0].table)); m.appendChild(nb);
        return;
      }
      var info = state.data.owned.filter(function (x) { return x.name === name; })[0];
      var head = el('div', 'card'); head.appendChild(el('h2', null, '🗂️ ' + name));
      if (info.team) {          // the team's: every member reads and writes it, nothing to share
        head.appendChild(el('div', 'sub', 'Your team\'s lakehouse — every member of the team reads and writes it (the `team` catalog in your notebooks) · stored in ' + info.location));
        head.appendChild(polarisLink(name)); m.appendChild(head);
        var tnb = el('div', 'card'); tnb.appendChild(el('h3', null, 'Use it'));
        var tp = el('pre'); tp.textContent = '# notebooks: already set up as `team`\nspark.sql("SHOW TABLES IN team.bronze").show()\n\n-- SQLPad: by its name\nSELECT * FROM ' + name + '.bronze.<table>;';
        tnb.appendChild(tp); m.appendChild(tnb);
        return;
      }
      head.appendChild(el('div', 'sub', (info.default ? 'Your main lakehouse (the `iceberg` catalog in your notebooks)' : 'Your catalog') + ' · stored in ' + info.location));
      head.appendChild(polarisLink(name));
      m.appendChild(head);
      var tree = el('div', 'card'); tree.appendChild(el('h3', null, 'Namespaces & tables — share with another learner'));
      var tbody = el('table'); tree.appendChild(tbody); m.appendChild(tree);
      tbody.innerHTML = '<tr><td class="sub">Loading…</td></tr>';
      var sh = el('div', 'card'); sh.appendChild(el('h3', null, 'Current shares')); var stab = el('table'); sh.appendChild(stab); m.appendChild(sh);
      var nb = el('div', 'card'); nb.appendChild(el('h3', null, 'Use it in a notebook'));
      nb.appendChild(info.default ? (function () { var p = el('pre'); p.textContent = '# already set up as `iceberg`\nspark.sql("SHOW NAMESPACES IN iceberg").show()'; return p; })() : snippet(name));
      nb.appendChild(el('div', 'sub', 'Create namespaces & tables from Spark, e.g. spark.sql("CREATE NAMESPACE ' + (info.default ? 'iceberg' : name) + '.sales")'));
      m.appendChild(nb);

      api('GET', '/tree', {catalog: name}).then(function (r) {
        tbody.innerHTML = '';
        if (!r.ok) { tbody.innerHTML = ''; return toast(r.body.error, true); }
        if (!r.body.length) { var e = el('tr'); var td = el('td', 'sub', 'No namespaces yet — create one from a notebook (see below).'); e.appendChild(td); tbody.appendChild(e); }
        r.body.forEach(function (ns) {
          tbody.appendChild(row('📁 ' + ns.namespace, ns.namespace, null, 'ns'));
          ns.tables.forEach(function (t) { tbody.appendChild(row('▦ ' + t, ns.namespace, t, 'tbl')); });
        });
      });
      shares();

      function row(label, ns, table, cls) {
        var tr = el('tr', cls); tr.appendChild(el('td', null, label));
        var td = el('td', 'r'); var b = el('button', 'small', '🤝 Share'); td.appendChild(b); tr.appendChild(td);
        b.onclick = function () { shareForm(tr, ns, table); };
        return tr;
      }
      function shareForm(after, ns, table) {
        var old = tbody.querySelector('tr.shareform'); if (old) old.remove();
        var tr = el('tr', 'shareform'), td = el('td'); td.colSpan = 2;
        var who = el('input'); who.type = 'text'; who.placeholder = 'learner username';
        var acc = el('select'); acc.innerHTML = '<option value="read">read</option><option value="write">read + write</option>';
        var go = el('button', 'primary small', 'Share'), cancel = el('button', 'small', 'Cancel');
        td.appendChild(document.createTextNode('Share ' + (table ? 'table ' + ns + '.' + table : 'namespace ' + ns + ' (all its tables)') + ' with '));
        [who, acc, go, cancel].forEach(function (x) { td.appendChild(document.createTextNode(' ')); td.appendChild(x); });
        tr.appendChild(td); after.parentNode.insertBefore(tr, after.nextSibling); who.focus();
        cancel.onclick = function () { tr.remove(); };
        function submit() {
          if (!who.value.trim()) return who.focus();
          var p = {catalog: name, grantee: who.value.trim(), access: acc.value, namespace: ns}; if (table) p.table = table;
          api('POST', '/shares', p).then(function (r) {
            if (!r.ok) return toast(r.body.error, true);
            toast('Shared with ' + r.body.grantee); tr.remove(); shares();
          });
        }
        go.onclick = submit; who.onkeydown = function (e) { if (e.key === 'Enter') submit(); if (e.key === 'Escape') tr.remove(); };
      }
      function shares() {
        api('GET', '/shares', {catalog: name}).then(function (r) {
          stab.innerHTML = '';
          if (!r.ok) return toast(r.body.error, true);
          if (!r.body.length) { var e = el('tr'); e.appendChild(el('td', 'sub', 'Not shared with anyone.')); stab.appendChild(e); return; }
          stab.innerHTML = '<tr><th>Learner</th><th>Namespace</th><th>Table</th><th>Access</th><th></th></tr>';
          r.body.forEach(function (s) {
            var tr = el('tr'); tr.appendChild(el('td', null, s.grantees.join(', ')));
            tr.appendChild(el('td', null, s.namespace)); tr.appendChild(el('td', null, s.table || 'all tables'));
            var a = el('td'); a.appendChild(el('span', 'tag ' + s.access, s.access === 'write' ? 'read + write' : 'read')); tr.appendChild(a);
            var td = el('td', 'r'), b = el('button', 'small danger', 'Revoke'); td.appendChild(b); tr.appendChild(td);
            b.onclick = function () { api('DELETE', '/shares', {catalog: name, role: s.role}).then(function (x) {
              x.ok ? (toast('Revoked'), shares()) : toast(x.body.error, true); }); };
            stab.appendChild(tr);
          });
        });
      }
    }

    $('new').onclick = function () {
      var box = $('newrow'); if (box.firstChild) { box.innerHTML = ''; return; }   // ＋ New again = close
      var d = el('div', 'newcat'), inp = el('input'); inp.type = 'text'; inp.placeholder = 'name, e.g. sales';
      var ok = el('button', 'primary small', 'Create'), cancel = el('button', 'small', 'Cancel');
      d.appendChild(el('span', 'sub', state.user + '_')); d.appendChild(inp); d.appendChild(ok); d.appendChild(cancel);
      box.appendChild(d); inp.focus();
      cancel.onclick = function () { box.innerHTML = ''; };
      function create() {
        api('POST', '', {name: inp.value.trim().toLowerCase()}).then(function (r) {
          if (!r.ok) return toast(r.body.error, true);
          toast('Created ' + r.body.name); box.innerHTML = ''; load().then(function () { open(r.body.name, 'owned'); });
        });
      }
      ok.onclick = create; inp.onkeydown = function (e) { if (e.key === 'Enter') create(); if (e.key === 'Escape') box.innerHTML = ''; };
    };
    document.addEventListener('lab:me', function (e) { state.user = e.detail.principal || e.detail.user; });
    load();
  </script>
</body>
</html>
