<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data sync — Epireum's Data Engineering Lab</title>
  <link rel="stylesheet" href="/admin.css?v=8">
  <style>
    main{max-width:none}
    .seg{display:inline-flex; gap:4px; flex-wrap:wrap}
    button.on{border-color:var(--accent); color:var(--accent)}
    .ok{color:var(--accent2)} .bad{color:var(--bad-ink)} .run{color:var(--accent)}
    .crumbs{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.9rem; color:var(--muted); margin:0 0 10px}
    .crumbs a{color:var(--accent); text-decoration:none; cursor:pointer} .crumbs a:hover{text-decoration:underline}
    .crumbs b{color:var(--ink)}
    .lst td{vertical-align:middle} .lst .acts{white-space:nowrap; text-align:right}
    .lst tr.more > td{background:var(--panel2); padding:8px 14px 12px}
    a.name{font-weight:600; color:var(--ink); text-decoration:none; cursor:pointer} a.name:hover{color:var(--accent)}
    dd a, .facts a{color:var(--accent); cursor:pointer}
    .form{display:grid; grid-template-columns:160px minmax(0, 440px); gap:10px 14px; align-items:center; margin:6px 0 12px}
    .form label{color:var(--muted); font-size:.88rem}
    .form input[type=text], .form input[type=password], .form input[type=number], .form select{width:100%}
    .tables{display:flex; flex-direction:column; gap:4px; max-height:320px; overflow:auto; padding:6px 8px;
            border:1px solid var(--line); border-radius:8px; background:var(--panel2)}
    .tables label{display:flex; gap:8px; align-items:center; cursor:pointer}
    pre.log{max-height:420px; overflow:auto; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
            padding:8px 10px; font-size:.78rem; line-height:1.4; white-space:pre-wrap; word-break:break-all; margin:8px 0 0}
    .notes{margin:6px 0 0; padding-left:18px; font-size:.86rem}
    .ask{display:inline-flex; flex-wrap:wrap; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--gold); border-radius:9px; background:rgba(226,185,59,.08); font-size:.88rem}
    /* the New job guide: ① Source → ② Destination → ③ Tables → ④ Schedule & review */
    .steps{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 14px; padding:0; list-style:none}
    .steps li{display:flex; align-items:center; gap:8px; padding:6px 12px; border:1px solid var(--line); border-radius:999px;
              font-size:.88rem; color:var(--muted); background:var(--panel)}
    .steps li i{font-style:normal; display:inline-flex; width:20px; height:20px; border-radius:50%; align-items:center; justify-content:center;
                font-size:.75rem; background:var(--panel2); border:1px solid var(--line2)}
    .steps li.done{cursor:pointer; color:var(--ink)} .steps li.done i{background:var(--accent2); border-color:var(--accent2); color:#fff}
    .steps li.cur{border-color:var(--accent); color:var(--accent); font-weight:600} .steps li.cur i{background:var(--accent); border-color:var(--accent); color:#fff}
    .picks{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; margin:6px 0 10px}
    .pick{border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; background:var(--panel)}
    .pick:hover{border-color:var(--accent)} .pick.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-bg)}
    .pick b{display:block; margin-bottom:2px} .pick .sub{font-size:.82rem}
    .pick.add{display:flex; align-items:center; justify-content:center; color:var(--accent); border-style:dashed; font-weight:600; min-height:58px}
    .facts{display:grid; grid-template-columns:150px 1fr; gap:6px 14px; font-size:.92rem; margin:4px 0 12px}
    .facts dt{color:var(--muted)} .facts dd{margin:0}
    .navbtns{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-top:14px}
    .flash{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
    @media (max-width:640px){ .form, .facts{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=13"></script>
  <div class="pagebar"><h1>📡 Data sync <span class="dot">·</span> copy tables from your databases into your lakehouse</h1></div>
  <main id="main"><div class="placeholder">Loading…</div></main>
  <script>
    // 📡 Data sync (CDC) — a SOURCE is a database you can reach (PostgreSQL, MySQL, SQL Server); a
    // DESTINATION is one of your lakehouse catalogs (+ a namespace); a JOB copies chosen tables from a
    // source to a destination: a full load, then — with CDC — only the inserts, updates and deletes
    // since the last run, on a schedule or when you press Run now. The work runs in the lab (OLake's
    // engine), as you. Every screen has its own address (#jobs, #new-job, #job/3, #new-source,
    // #source/2 …), so the browser's Back button works; New job is a 4-step guide.
    var main = document.getElementById('main');
    function el(tag, attrs, kids) {
      var e = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === 'text') e.textContent = attrs[k];
        else if (k === 'html') e.innerHTML = attrs[k];
        else e.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }
    function on(e, ev, f) { e.addEventListener(ev, f); return e; }
    function api(method, path, body) {
      return fetch(path, {method: method, credentials: 'same-origin',
          headers: body ? {'Content-Type': 'application/json', 'X-Lab-Request': '1'} : {},
          body: body ? JSON.stringify(body) : undefined})
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
    }
    // inline "are you sure?" next to a button (no browser popups)
    function ask(btn, question, yesText, yes) {
      var y = el('button', {class: 'small danger', text: yesText}), n = el('button', {class: 'small', text: 'Cancel'});
      var box = el('span', {class: 'ask'}, [el('span', {text: question}), y, n]);
      btn.hidden = true; btn.parentNode.insertBefore(box, btn.nextSibling);
      on(n, 'click', function () { box.remove(); btn.hidden = false; });
      on(y, 'click', function () { box.remove(); btn.hidden = false; yes(btn); });
    }
    function when(iso) { return iso ? new Date(iso).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}) : '—'; }
    function seg(options, value, onPick) {             // segmented buttons
      var s = el('span', {class: 'seg'});
      options.forEach(function (o) {
        var b = on(el('button', {type: 'button', class: 'small' + (o[0] === value ? ' on' : ''), text: o[1]}), 'click', function () {
          [].forEach.call(s.children, function (x) { x.classList.toggle('on', x === b); }); onPick(o[0]);
        });
        s.appendChild(b);
      });
      return s;
    }
    function note(text, cls) { return el('div', {class: 'sub ' + (cls || ''), style: 'margin-top:6px', text: text}); }
    function inp(v, type, ph) { var i = el('input', {type: type || 'text'}); if (v !== undefined && v !== null) i.value = v; if (ph) i.placeholder = ph;
      i.autocomplete = type === 'password' ? 'new-password' : 'off';   // no browser autofill of the portal login
      return i; }
    function card(kids) { return el('div', {class: 'card', style: 'margin-bottom:12px'}, kids); }
    // a task (check / list tables / run) is done by the lab in the background: ask until it ends
    function watch(id, done) {
      api('GET', '/api/cdc/task?id=' + id).then(function (t) {
        if (t.status === 'queued' || t.status === 'running') return setTimeout(function () { watch(id, done); }, 2000);
        done(t);
      }).catch(function (e) { done({status: 'failed', error: e.message}); });
    }

    var SCHED = {'': 'Manual', '15m': 'Every 15 min', '1h': 'Hourly', '1d': 'Daily'};
    var MODE = {cdc: 'Full load + CDC', full_refresh: 'Full reload every run'};
    var data = null, timer = null, busy = {}, flash = null;
    var wiz = null;          // the New job guide's choices — kept while you add a source / destination on the way

    // ---- navigation ----------------------------------------------------------------------------
    function route() { var h = location.hash.slice(1) || 'jobs', i = h.indexOf('/'); return i < 0 ? [h, null] : [h.slice(0, i), h.slice(i + 1)]; }
    function go(hash) { if (location.hash.slice(1) !== hash) history.pushState(null, '', '#' + hash); show(); }
    window.addEventListener('popstate', show);
    function link(text, hash, cls) { return on(el('a', {text: text, class: cls || ''}), 'click', function () { go(hash); }); }
    function crumbs(parts) {                            // Data sync › Jobs › New job
      var c = el('div', {class: 'crumbs'}, [link('Data sync', 'jobs')]);
      parts.forEach(function (p, i) { c.appendChild(document.createTextNode('›')); c.appendChild(i === parts.length - 1 ? el('b', {text: p[0]}) : link(p[0], p[1])); });
      return c;
    }
    function load() {
      clearTimeout(timer);
      return api('GET', '/api/cdc').then(function (d) { data = d; }).catch(function (e) {
        main.innerHTML = ''; main.appendChild(el('div', {class: 'placeholder', text: 'Could not load: ' + e.message})); throw e;
      });
    }
    function show() { load().then(draw, function () {}); }
    function draw() {
      clearTimeout(timer);
      var r = route(), page = r[0], id = r[1];
      main.innerHTML = '';
      if (page === 'new-job') return jobGuide();
      if (page === 'job') return jobPage(+id);
      if (page === 'new-source') return sourcePage({kind: 'postgres', cdc: true});
      if (page === 'source') return sourcePage(byId(data.sources, +id));
      if (page === 'new-destination') return destPage({});
      if (page === 'destination') return destPage(byId(data.destinations, +id));
      listPage(['jobs', 'sources', 'destinations'].indexOf(page) >= 0 ? page : 'jobs');
    }
    function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0] || null; }
    function showFlash() {
      if (!flash) return;
      var f = flash; flash = null;
      main.appendChild(el('div', {class: 'card result', style: 'margin-bottom:12px'}, [el('div', {class: 'flash'}, [el('span', {text: f.text}),
        f.action ? on(el('button', {class: 'small primary', text: f.action[0]}), 'click', f.action[1]) : null])]));
    }
    function alert_(msg) { main.insertBefore(el('div', {class: 'card result err', style: 'margin-bottom:12px'}, [el('div', {text: msg})]), main.firstChild); }

    // ---- the three lists (tabs) ----------------------------------------------------------------
    function listPage(tab) {
      var tabs = seg([['jobs', 'Jobs (' + data.jobs.length + ')'], ['sources', 'Sources (' + data.sources.length + ')'],
                      ['destinations', 'Destinations (' + data.destinations.length + ')']], tab, function (k) { go(k); });
      var add = {jobs: ['+ New job', function () { wiz = null; go('new-job'); }], sources: ['+ New source', function () { wiz = null; go('new-source'); }],
                 destinations: ['+ New destination', function () { wiz = null; go('new-destination'); }]}[tab];
      main.appendChild(el('div', {class: 'bar'}, [tabs, on(el('button', {class: 'primary', text: add[0]}), 'click', add[1])]));
      showFlash();
      main.appendChild({jobs: jobList, sources: sourceList, destinations: destList}[tab]());
      if (data.jobs.some(function (j) { return j.busy; }) || Object.keys(busy).length) timer = setTimeout(show, 4000);
    }
    function checked(c, isBusy) {
      if (isBusy) return el('span', {class: 'run', text: '… checking'});
      if (!c) return el('span', {class: 'muted', text: 'not checked yet'});
      return el('span', {class: c.ok ? 'ok' : 'bad', title: c.message || '', text: c.ok ? '✓ connected' : '✗ ' + (c.message || 'failed').slice(0, 140)});
    }
    function last(j) {
      var r = j.last;
      if (j.busy && !(r && r.status === 'running')) return el('span', {class: 'run', text: '… starting'});
      if (!r) return el('span', {class: 'muted', text: 'not run yet'});
      if (r.status === 'running') return el('span', {class: 'run', text: '… running since ' + when(r.started_at)});
      return el('span', {class: r.status === 'ok' ? 'ok' : 'bad', title: r.error || '',
        text: (r.status === 'ok' ? '✓ ' + (r.records === null ? '' : r.records + ' rows · ') : '✗ failed · ') + when(r.finished_at)});
    }
    function table(heads, body) {
      return el('div', {class: 'wrap'}, [el('table', {class: 'lst'}, [el('thead', {}, [el('tr', {}, heads.map(function (h) { return el('th', {text: h}); }))]), body])]);
    }
    function empty(text, btn) { return card([el('div', {class: 'sub', text: text}), btn ? el('div', {style: 'margin-top:10px'}, [btn]) : null]); }

    function jobList() {
      if (!data.jobs.length) return empty('No jobs yet. A job copies tables from a source to a destination — the guide takes you through it in four steps.',
        on(el('button', {class: 'primary', text: '+ New job'}), 'click', function () { wiz = null; go('new-job'); }));
      var body = el('tbody');
      data.jobs.forEach(function (j) {
        var runNow = on(el('button', {class: 'small primary', text: 'Run now'}), 'click', function () {
          runNow.disabled = true;
          api('POST', '/api/cdc/jobs/run', {id: j.id}).then(function () { setTimeout(show, 1200); }).catch(function (e) { alert_(e.message); runNow.disabled = false; });
        });
        runNow.disabled = !!j.busy;
        body.appendChild(el('tr', {}, [el('td', {}, [link(j.name, 'job/' + j.id, 'name')]),
          el('td', {text: j.source_name + ' → ' + j.dest_name}),
          el('td', {title: j.tables.join(', '), text: j.tables.length === 1 ? j.tables[0] : j.tables.length + ' tables'}),
          el('td', {text: MODE[j.mode]}), el('td', {text: (SCHED[j.schedule] || j.schedule) + (j.schedule && !j.enabled ? ' (paused)' : '')}),
          el('td', {}, [last(j)]),
          el('td', {class: 'acts'}, [runNow, ' ', on(el('button', {class: 'small', text: 'Open'}), 'click', function () { go('job/' + j.id); })])]));
      });
      return card([table(['Job', 'Source → destination', 'Tables', 'Mode', 'Schedule', 'Last run', ''], body)]);
    }

    function sourceList() {
      if (!data.sources.length) return empty('No sources yet. A source is a database you can reach — PostgreSQL, MySQL or SQL Server: its host, database and a login.',
        on(el('button', {class: 'primary', text: '+ New source'}), 'click', function () { go('new-source'); }));
      var body = el('tbody');
      data.sources.forEach(function (s) {
        var chk = on(el('button', {class: 'small', text: 'Check'}), 'click', function () {
          busy['s' + s.id] = 1; draw();
          api('POST', '/api/cdc/sources/check', {id: s.id}).then(function (r) { watch(r.task, function () { delete busy['s' + s.id]; show(); }); })
            .catch(function (e) { delete busy['s' + s.id]; alert_(e.message); });
        });
        var more = el('tr', {class: 'more', hidden: ''}, [el('td', {colspan: '6'})]);
        var tbl = on(el('button', {class: 'small', text: 'Tables'}), 'click', function () {
          more.hidden = !more.hidden; tbl.classList.toggle('on', !more.hidden);
          if (!more.hidden) readTables({id: s.id}, '/api/cdc/sources/tables', more.firstChild);
        });
        var job = on(el('button', {class: 'small primary', text: 'New job'}), 'click', function () { startJob({source: s.id}); });
        var del = on(el('button', {class: 'small', text: 'Delete'}), 'click', function () {
          ask(del, s.cdc && s.slot ? 'Delete it (its replication slot is dropped too)?' : 'Delete it?', 'Yes, delete', function () {
            api('POST', '/api/cdc/sources/delete', {id: s.id}).then(function (r) {
              if (r.task) watch(r.task, function (t) { if (t.result && t.result.note) flash = {text: t.result.note}; show(); }); else show();
            }).catch(function (e) { alert_(e.message); });
          });
        });
        var c = s.checked, info = [];
        if (c && (c.notes || []).length) info = info.concat(c.notes);
        if (c) (c.prerequisites || []).filter(function (p) { return !p.passed; }).forEach(function (p) {
          info.push((p.required ? '✗ needed: ' : 'tip: ') + p.name + ' is ' + p.current + ' — ' + p.recommended);
        });
        body.appendChild(el('tr', {}, [el('td', {}, [link(s.name, 'source/' + s.id, 'name')]),
          el('td', {}, [el('div', {text: s.host + ':' + s.port + ' / ' + s.database}), el('div', {class: 'sub', text: data.kinds[s.kind].name})]),
          el('td', {text: s.username}), el('td', {text: s.cdc ? 'on' : 'off'}),
          el('td', {}, [checked(c, busy['s' + s.id]), info.length ? el('ul', {class: 'notes'}, info.map(function (x) { return el('li', {text: x}); })) : null]),
          el('td', {class: 'acts'}, [job, ' ', chk, ' ', tbl, ' ', on(el('button', {class: 'small', text: 'Edit'}), 'click', function () { wiz = null; go('source/' + s.id); }), ' ', del])]));
        body.appendChild(more);
      });
      return card([table(['Source', 'Database', 'User', 'CDC', 'Status', ''], body)]);
    }

    function destList() {
      var body = el('tbody');
      data.destinations.forEach(function (d) {
        var chk = on(el('button', {class: 'small', text: 'Check'}), 'click', function () {
          busy['d' + d.id] = 1; draw();
          api('POST', '/api/cdc/destinations/check', {id: d.id}).then(function (r) { watch(r.task, function () { delete busy['d' + d.id]; show(); }); })
            .catch(function (e) { delete busy['d' + d.id]; alert_(e.message); });
        });
        var del = on(el('button', {class: 'small', text: 'Delete'}), 'click', function () {
          ask(del, 'Delete it? (the tables stay in your lakehouse)', 'Yes, delete', function () {
            api('POST', '/api/cdc/destinations/delete', {id: d.id}).then(show).catch(function (e) { alert_(e.message); });
          });
        });
        body.appendChild(el('tr', {}, [el('td', {}, [link(d.name, 'destination/' + d.id, 'name')]), el('td', {text: d.catalog}),
          el('td', {text: d.namespace || '(the source\'s database_schema)'}), el('td', {}, [checked(d.checked, busy['d' + d.id])]),
          el('td', {class: 'acts'}, [chk, ' ', on(el('button', {class: 'small', text: 'Edit'}), 'click', function () { wiz = null; go('destination/' + d.id); }), ' ', del])]));
      });
      return card([table(['Destination', 'Lakehouse', 'Namespace', 'Status', ''], body),
        el('div', {class: 'sub', style: 'margin-top:8px', text: 'Tables land as Iceberg tables in that lakehouse and namespace — query them in SQL, notebooks or Superset. The lab writes them as you: no keys to type.'})]);
    }
    // the tables of a source (saved: its id · or a form) → read-only list in `box`
    function readTables(body, path, box) {
      box.innerHTML = ''; box.appendChild(el('div', {class: 'sub run', text: '… reading the tables'}));
      api('POST', path, body).then(function (r) { watch(r.task, function (t) { box.innerHTML = ''; box.appendChild(tableList(t)); }); })
        .catch(function (e) { box.innerHTML = ''; box.appendChild(note(e.message, 'bad')); });
    }
    function tableList(t) {
      if (t.status !== 'done') return note('✗ ' + (t.error || 'failed'), 'bad');
      var tb = t.result.tables;
      if (!tb.length) return note('No tables found.');
      return el('div', {style: 'margin-top:8px'}, [el('div', {class: 'sub', text: tb.length + (tb.length === 1 ? ' table' : ' tables')}),
        el('div', {class: 'tables'}, tb.map(function (x) {
          return el('div', {}, [el('span', {text: x.table}), el('span', {class: 'muted', text: ' · ' + x.columns + ' columns'})]);
        }))]);
    }

    // ---- a source: new or edit (its own page) ----------------------------------------------------
    function sourcePage(s) {
      if (!s) return go('sources');
      var back = wiz ? ['New job', 'new-job'] : ['Sources', 'sources'];
      main.appendChild(crumbs([back, [s.id ? s.name : 'New source']]));
      var kind = s.kind || 'postgres';
      var f = {name: inp(s.name), host: inp(s.host), port: inp(s.port || data.kinds[kind].port, 'number'), database: inp(s.database), username: inp(s.username),
               password: inp('', 'password', s.id ? 'unchanged' : ''), schemas: inp((s.schemas || []).join(', '), 'text', 'all — or e.g. public, sales')};
      var cdc = !!s.cdc, schemaLabel = el('label', {text: 'Schemas'}), hint = el('div', {class: 'sub'});
      function kindChanged() {                          // the type's port, schemas (Postgres only), what CDC needs
        var k = data.kinds[kind], ports = Object.keys(data.kinds).map(function (x) { return String(data.kinds[x].port); });
        if (!f.port.value || ports.indexOf(f.port.value) >= 0) f.port.value = k.port;
        schemaLabel.hidden = f.schemas.hidden = kind !== 'postgres';
        hint.textContent = 'CDC reads the database\'s change log. ' + k.name + ' needs: ' + k.cdc + '.';
      }
      var kinds = el('select', {}, Object.keys(data.kinds).map(function (k) { return el('option', {value: k, text: data.kinds[k].name}); }));
      kinds.value = kind; kinds.disabled = !!s.id;      // a saved source keeps its type
      on(kinds, 'change', function () { kind = kinds.value; kindChanged(); });
      function form() {
        return {id: s.id, kind: kind, name: f.name.value, host: f.host.value, port: f.port.value, database: f.database.value,
                username: f.username.value, password: f.password.value, cdc: cdc,
                schemas: f.schemas.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean)};
      }
      var msg = el('div');
      var test = on(el('button', {type: 'button', text: 'Test connection'}), 'click', function () {
        test.disabled = true; msg.innerHTML = ''; msg.appendChild(el('div', {class: 'sub run', text: '… connecting'}));
        api('POST', '/api/cdc/sources/test', form()).then(function (r) {
          watch(r.task, function (t) {
            test.disabled = false; msg.innerHTML = '';
            var ok = t.status === 'done' && t.result && t.result.ok;
            msg.appendChild(note(ok ? '✓ Connected' : '✗ ' + ((t.result && t.result.message) || t.error || 'failed'), ok ? 'ok' : 'bad'));
          });
        }).catch(function (e) { test.disabled = false; msg.innerHTML = ''; msg.appendChild(note(e.message, 'bad')); });
      });
      var browse = on(el('button', {type: 'button', text: 'Browse tables'}), 'click', function () { readTables(form(), '/api/cdc/sources/browse', msg); });
      var save = on(el('button', {class: 'primary', text: s.id ? 'Save' : 'Save source'}), 'click', function () {
        save.disabled = true; msg.innerHTML = ''; msg.appendChild(note('Saving…'));
        api('POST', '/api/cdc/sources', form()).then(function (r) {
          busy['s' + r.id] = 1; watch(r.task, function () { delete busy['s' + r.id]; });
          if (wiz) { wiz.source = r.id; wiz.found = null; wiz.picked = null; wiz.step = 2; return go('new-job'); }   // back to the guide
          flash = {text: '✓ Source "' + f.name.value + '" saved — the lab is checking the connection.',
                   action: ['Create a job from it →', function () { startJob({source: r.id}); }]};
          go('sources');
        }).catch(function (e) { save.disabled = false; msg.innerHTML = ''; msg.appendChild(note(e.message, 'bad')); });
      });
      kindChanged();
      main.appendChild(card([el('h3', {text: s.id ? 'Edit source ' + s.name : 'New source — a database you can reach'}),
        el('div', {class: 'form'}, [
          el('label', {text: 'Database type'}), kinds, el('label', {text: 'Name'}), f.name, el('label', {text: 'Host'}), f.host, el('label', {text: 'Port'}), f.port,
          el('label', {text: 'Database'}), f.database, el('label', {text: 'User'}), f.username, el('label', {text: 'Password'}), f.password,
          schemaLabel, f.schemas,
          el('label', {text: 'Change data capture'}), seg([[true, 'On — copy inserts, updates, deletes'], [false, 'Off — full reloads only']], cdc, function (v) { cdc = v; })]),
        hint,
        el('div', {class: 'navbtns'}, [el('span', {class: 'row'}, [on(el('button', {text: '← ' + back[0]}), 'click', function () { go(back[1]); }), test, browse]), save]),
        msg]));
    }

    // ---- a destination: new or edit -------------------------------------------------------------
    function destPage(d) {
      if (!d) return go('destinations');
      var back = wiz ? ['New job', 'new-job'] : ['Destinations', 'destinations'];
      main.appendChild(crumbs([back, [d.id ? d.name : 'New destination']]));
      var name = inp(d.name), ns = inp(d.namespace, 'text', 'e.g. bronze_cdc — empty: <database>_<schema>'), cat = d.catalog || data.catalogs[0], msg = el('div');
      var save = on(el('button', {class: 'primary', text: d.id ? 'Save' : 'Save destination'}), 'click', function () {
        save.disabled = true;
        api('POST', '/api/cdc/destinations', {id: d.id, name: name.value, catalog: cat, namespace: ns.value}).then(function (r) {
          busy['d' + r.id] = 1; watch(r.task, function () { delete busy['d' + r.id]; });
          if (wiz) { wiz.dest = r.id; wiz.step = 3; return go('new-job'); }
          flash = {text: '✓ Destination "' + name.value + '" saved.'};
          go('destinations');
        }).catch(function (e) { save.disabled = false; msg.innerHTML = ''; msg.appendChild(note(e.message, 'bad')); });
      });
      main.appendChild(card([el('h3', {text: d.id ? 'Edit destination ' + d.name : 'New destination — one of your lakehouses'}),
        el('div', {class: 'form'}, [el('label', {text: 'Name'}), name,
          el('label', {text: 'Lakehouse'}), seg(data.catalogs.map(function (c) { return [c, c]; }), cat, function (v) { cat = v; }),
          el('label', {text: 'Namespace'}), ns]),
        el('div', {class: 'sub', text: 'Each table lands as <lakehouse>.<namespace>.<table>. Two jobs can\'t write the same table into one namespace.'}),
        el('div', {class: 'navbtns'}, [on(el('button', {text: '← ' + back[0]}), 'click', function () { go(back[1]); }), save]), msg]));
    }

    // ---- New job: the 4-step guide --------------------------------------------------------------
    var STEPS = ['Source', 'Destination', 'Tables', 'Schedule & review'];
    function startJob(pre) { wiz = {step: pre.source ? 2 : 1, source: pre.source || null, dest: null}; go('new-job'); }
    function jobGuide() {
      if (!wiz) wiz = {step: 1, source: null, dest: null};
      if (wiz.source && !byId(data.sources, wiz.source)) { wiz.source = null; wiz.step = 1; }
      if (!wiz.dest && data.destinations.length === 1) wiz.dest = data.destinations[0].id;
      main.appendChild(crumbs([['Jobs', 'jobs'], ['New job']]));
      var ok = [!!wiz.source, !!wiz.dest, !!(wiz.picked && chosen().length)];
      main.appendChild(el('ol', {class: 'steps'}, STEPS.map(function (s, i) {
        var n = i + 1, done = n !== wiz.step && ok.slice(0, n - 1).every(Boolean);    // a step you can go (back) to
        var li = el('li', {class: n === wiz.step ? 'cur' : done ? 'done' : ''}, [el('i', {text: n < wiz.step ? '✓' : String(n)}), s]);
        if (done) on(li, 'click', function () { wiz.step = n; draw(); });
        return li;
      })));
      var body = el('div'), next = el('button', {class: 'primary', text: wiz.step === 4 ? 'Create & run' : 'Next →'});
      var backB = on(el('button', {text: wiz.step === 1 ? 'Cancel' : '← Back'}), 'click', function () {
        if (wiz.step === 1) { wiz = null; return go('jobs'); }
        wiz.step--; draw();
      });
      var msg = el('div');
      main.appendChild(card([body, el('div', {class: 'navbtns'}, [backB, next]), msg]));
      [stepSource, stepDest, stepTables, stepReview][wiz.step - 1](body, next, msg);
    }
    // a source's change stream feeds one CDC job (one replication slot): that job, if any
    function cdcJob(sid) { return data.jobs.filter(function (j) { return j.source === sid && j.mode === 'cdc'; })[0] || null; }
    function chosen() { return (wiz.found || []).map(function (x) { return x.table; }).filter(function (k) { return (wiz.picked || {})[k]; }); }
    function picks(items, current, onPick, addText, onAdd) {     // cards to choose one, + "add new"
      var g = el('div', {class: 'picks'});
      items.forEach(function (it) {
        g.appendChild(on(el('div', {class: 'pick' + (it.id === current ? ' on' : '')},
          [el('b', {text: (it.id === current ? '● ' : '') + it.title})].concat(it.lines.map(function (l) { return el('div', {class: 'sub', text: l}); }))),
          'click', function () { onPick(it.id); }));
      });
      g.appendChild(on(el('div', {class: 'pick add', text: addText}), 'click', onAdd));
      return g;
    }
    function stepSource(body, next) {
      body.appendChild(el('h3', {text: '① Which database do you copy from?'}));
      body.appendChild(picks(data.sources.map(function (s) {
        return {id: s.id, title: s.name, lines: [data.kinds[s.kind].name + ' · ' + s.host + ' / ' + s.database,
          (s.cdc ? (cdcJob(s.id) ? 'CDC used by job ' + cdcJob(s.id).name + ' — full reloads only' : 'CDC on') : 'CDC off') + ' · ' +
          (s.checked ? (s.checked.ok ? '✓ connected' : '✗ last check failed') : 'not checked yet')]};
      }), wiz.source, function (id) { if (wiz.source !== id) { wiz.found = null; wiz.picked = null; } wiz.source = id; draw(); },
        '+ New source', function () { go('new-source'); }));
      next.disabled = !wiz.source;
      on(next, 'click', function () { wiz.step = 2; draw(); });
    }
    function stepDest(body, next) {
      body.appendChild(el('h3', {text: '② Where do the tables land?'}));
      body.appendChild(picks(data.destinations.map(function (d) {
        return {id: d.id, title: d.name, lines: [d.catalog + '.' + (d.namespace || '<database>_<schema>'), d.checked ? (d.checked.ok ? '✓ ready' : '✗ last check failed') : 'not checked yet']};
      }), wiz.dest, function (id) { wiz.dest = id; draw(); }, '+ New destination', function () { go('new-destination'); }));
      next.disabled = !wiz.dest;
      on(next, 'click', function () { wiz.step = 3; draw(); });
    }
    function stepTables(body, next) {
      var s = byId(data.sources, wiz.source);
      body.appendChild(el('h3', {text: '③ Which tables of ' + s.name + '?'}));
      var list = el('div', {class: 'tables'}), count = el('span', {class: 'sub'});
      var bulk = el('span', {class: 'row'}, [count,
        on(el('button', {type: 'button', class: 'small', text: 'Select all'}), 'click', function () { wiz.found.forEach(function (x) { wiz.picked[x.table] = true; }); paint(); }),
        on(el('button', {type: 'button', class: 'small', text: 'None'}), 'click', function () { wiz.picked = {}; paint(); }),
        on(el('button', {type: 'button', class: 'small', text: '↻ Reload'}), 'click', function () { wiz.found = null; read(); })]);
      body.appendChild(el('div', {class: 'row', style: 'margin-bottom:6px'}, [bulk]));
      body.appendChild(list);
      function paint() {
        bulk.hidden = !wiz.found;
        list.innerHTML = '';
        if (!wiz.found) return;
        if (!wiz.found.length) return list.appendChild(el('span', {class: 'muted', text: 'No tables found.'}));
        wiz.found.forEach(function (x) {
          var cb = on(el('input', {type: 'checkbox'}), 'change', function () { wiz.picked[x.table] = cb.checked; counted(); });
          cb.checked = !!wiz.picked[x.table];
          list.appendChild(el('label', {}, [cb, el('span', {text: x.table}), el('span', {class: 'muted', text: '· ' + x.columns + ' columns'})]));
        });
        counted();
      }
      function counted() { var n = chosen().length; count.textContent = n + ' of ' + wiz.found.length + ' selected'; next.disabled = !n; }
      function read() {
        bulk.hidden = true; next.disabled = true; list.innerHTML = ''; list.appendChild(el('span', {class: 'run', text: '… reading the tables of ' + s.name}));
        api('POST', '/api/cdc/sources/tables', {id: s.id}).then(function (r) {
          watch(r.task, function (t) {
            if (t.status !== 'done') { list.innerHTML = ''; return list.appendChild(el('span', {class: 'bad', text: '✗ ' + (t.error || 'failed') + ' — check the source (Sources)'})); }
            wiz.disc = t.id; wiz.found = t.result.tables; wiz.picked = wiz.picked || {}; paint();
          });
        }).catch(function (e) { list.innerHTML = ''; list.appendChild(el('span', {class: 'bad', text: e.message})); });
      }
      next.disabled = true;
      if (wiz.found) paint(); else read();
      on(next, 'click', function () { wiz.step = 4; draw(); });
    }
    function stepReview(body, next, msg) {
      var s = byId(data.sources, wiz.source), d = byId(data.destinations, wiz.dest), tables = chosen(), taken = cdcJob(s.id);
      var canCdc = s.cdc && !taken;
      if (!canCdc) wiz.mode = 'full_refresh';
      wiz.mode = wiz.mode || (canCdc ? 'cdc' : 'full_refresh');
      wiz.sched = wiz.sched || '';
      var name = inp(wiz.name || (s.name + ' to ' + d.name).replace(/[^A-Za-z0-9 _.-]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 60));
      on(name, 'input', function () { wiz.name = name.value; });
      body.appendChild(el('h3', {text: '④ How often, and a last look'}));
      body.appendChild(el('div', {class: 'form'}, [el('label', {text: 'Job name'}), name,
        el('label', {text: 'Mode'}), el('div', {}, [seg(canCdc ? [['cdc', MODE.cdc], ['full_refresh', MODE.full_refresh]] : [['full_refresh', MODE.full_refresh]], wiz.mode, function (v) { wiz.mode = v; draw(); }),
          taken ? el('div', {class: 'sub', style: 'margin-top:4px'}, ['CDC on ' + s.name + ' is used by job ', link(taken.name, 'job/' + taken.id),
            ' (a source\'s change stream feeds one job) — add these tables to that job, or copy them here with full reloads.']) : null]),
        el('label', {text: 'Schedule'}), seg(Object.keys(SCHED).map(function (k) { return [k, SCHED[k]]; }), wiz.sched, function (v) { wiz.sched = v; })]));
      body.appendChild(el('dl', {class: 'facts'}, [
        el('dt', {text: 'From'}), el('dd', {text: s.name + ' — ' + data.kinds[s.kind].name + ', ' + s.host + ' / ' + s.database}),
        el('dt', {text: 'To'}), el('dd', {text: d.name + ' — ' + d.catalog + '.' + (d.namespace || '<database>_<schema>')}),
        el('dt', {text: 'Tables (' + tables.length + ')'}), el('dd', {text: tables.join(', ')})]));
      body.appendChild(el('div', {class: 'sub', text: wiz.mode === 'cdc' ? 'Full load + CDC: the first run copies everything, later runs only the inserts, updates and deletes since the run before (deleted rows stay as _op_type = \'d\'). The first run starts as soon as you create the job.'
                                                         : 'Full reload: every run copies the chosen tables again. The first run starts as soon as you create the job.'}));
      on(next, 'click', function () {
        next.disabled = true; msg.innerHTML = '';
        api('POST', '/api/cdc/jobs', {name: name.value, source: s.id, destination: d.id, discover: wiz.disc, tables: tables, mode: wiz.mode, schedule: wiz.sched})
          .then(function (r) { wiz = null; flash = {text: '✓ Job created — its first run is starting.'}; go('job/' + r.id); })
          .catch(function (e) { next.disabled = false; msg.appendChild(note(e.message, 'bad')); });
      });
    }

    // ---- a job's own page: what it copies, its settings, actions, runs ---------------------------
    function jobPage(id) {
      var j = byId(data.jobs, id);
      if (!j) return go('jobs');
      main.appendChild(crumbs([['Jobs', 'jobs'], [j.name]]));
      showFlash();
      var runNow = on(el('button', {class: 'primary', text: 'Run now'}), 'click', function () {
        runNow.disabled = true;
        api('POST', '/api/cdc/jobs/run', {id: j.id}).then(function () { setTimeout(show, 1200); }).catch(function (e) { alert_(e.message); runNow.disabled = false; });
      });
      runNow.disabled = !!j.busy;
      var pause = on(el('button', {text: j.enabled ? 'Pause schedule' : 'Resume schedule'}), 'click', function () {
        api('POST', '/api/cdc/jobs/set', {id: j.id, enabled: !j.enabled}).then(show).catch(function (e) { alert_(e.message); });
      });
      pause.hidden = !j.schedule;
      var del = on(el('button', {class: 'danger', text: 'Delete job'}), 'click', function () {
        ask(del, 'Delete the job? (its tables stay in your lakehouse)', 'Yes, delete', function () {
          api('POST', '/api/cdc/jobs/delete', {id: j.id}).then(function () { flash = {text: 'Job "' + j.name + '" deleted.'}; go('jobs'); })
            .catch(function (e) { alert_(e.message); });
        });
      });
      var d = byId(data.destinations, j.destination);
      main.appendChild(card([el('div', {class: 'bar'}, [el('h3', {style: 'margin:0', text: j.name}), el('span', {class: 'row'}, [runNow, pause, del])]),
        el('dl', {class: 'facts'}, [
          el('dt', {text: 'Last run'}), el('dd', {}, [last(j)]),
          el('dt', {text: 'From'}), el('dd', {}, [link(j.source_name, 'source/' + j.source)]),
          el('dt', {text: 'To'}), el('dd', {}, [link(j.dest_name, 'destination/' + j.destination),
            document.createTextNode(d ? ' — ' + d.catalog + '.' + (d.namespace || '<database>_<schema>') : '')]),
          el('dt', {text: 'Tables (' + j.tables.length + ')'}), el('dd', {text: j.tables.join(', ')}),
          el('dt', {text: 'Mode'}), el('dd', {text: MODE[j.mode]}),
          el('dt', {text: 'Schedule'}), el('dd', {}, [seg(Object.keys(SCHED).map(function (k) { return [k, SCHED[k]]; }), j.schedule, function (v) {
            api('POST', '/api/cdc/jobs/set', {id: j.id, schedule: v}).then(show).catch(function (e) { alert_(e.message); });
          }), j.schedule && !j.enabled ? el('span', {class: 'sub', text: '  paused'}) : null])])]));
      var runsBox = el('div');
      main.appendChild(card([el('h3', {text: 'Runs'}), runsBox]));
      showRuns(j, runsBox);
      if (j.busy) timer = setTimeout(show, 4000);
    }
    function showRuns(j, box) {
      box.appendChild(note('Loading…'));
      api('GET', '/api/cdc/runs?job=' + j.id).then(function (d) {
        box.innerHTML = '';
        if (!d.runs.length) return box.appendChild(note('No runs yet.'));
        var logBox = el('div');
        box.appendChild(el('div', {class: 'wrap'}, [el('table', {}, [el('thead', {}, [el('tr', {}, ['Started', 'Took', 'Result', 'Rows', 'Why', ''].map(function (h) { return el('th', {text: h}); }))]),
          el('tbody', {}, d.runs.map(function (r) {
            var took = r.finished_at ? Math.max(1, Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 1000)) + ' s' : '…';
            var lg = on(el('button', {class: 'small', text: 'Log'}), 'click', function () {
              api('GET', '/api/cdc/run?id=' + r.id).then(function (x) {
                logBox.innerHTML = ''; logBox.appendChild(el('pre', {class: 'log', text: (x.error ? 'Error: ' + x.error + '\n\n' : '') + (x.log || '(no log)')}));
              }).catch(function (e) { alert_(e.message); });
            });
            return el('tr', {}, [el('td', {class: 'muted', text: when(r.started_at)}), el('td', {class: 'muted', text: took}),
              el('td', {class: r.status === 'ok' ? 'ok' : r.status === 'running' ? 'run' : 'bad', title: r.error || '',
                        text: r.status === 'ok' ? '✓ ok' : r.status === 'running' ? '… running' : '✗ ' + (r.error || 'failed').slice(0, 100)}),
              el('td', {text: r.records === null ? '—' : String(r.records)}), el('td', {class: 'muted', text: r.trigger || ''}), el('td', {}, [lg])]);
          }))])]));
        box.appendChild(logBox);
      }).catch(function (e) { box.innerHTML = ''; box.appendChild(note(e.message, 'bad')); });
    }

    show();
  </script>
</body>
</html>
