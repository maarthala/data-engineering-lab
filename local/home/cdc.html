<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingestion — Epireum's Data Engineering Lab</title>
  <link rel="stylesheet" href="/admin.css?v=8">
  <style>
    main{max-width:none}
    /* tabs + the tab's "new" button on one line */
    .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; justify-content:space-between;
             border-bottom:1px solid var(--line); margin:0 0 14px}
    .toolbar .tabs{margin:0; border-bottom:0}
    .toolbar > button{margin-bottom:8px}
    .tabs a{cursor:pointer; display:inline-flex; align-items:center; gap:7px}
    .tabs a .n{font-size:.72rem; min-width:20px; padding:1px 7px; border-radius:999px; background:var(--panel2); color:var(--muted); text-align:center}
    .tabs a.on .n{background:var(--accent-bg); color:var(--accent)}
    /* lists */
    .lst td{vertical-align:middle}
    .lst td.acts{white-space:nowrap; text-align:right}
    .lst td.acts button + button{margin-left:4px}
    .lst tr.more > td{background:var(--panel2); padding:10px 14px 14px}
    .lst .sub{font-size:.8rem; margin-top:2px}
    a.name{font-weight:600; color:var(--ink); text-decoration:none; cursor:pointer} a.name:hover{color:var(--accent)}
    code.ns{font-size:.82rem; background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:1px 6px}
    .pill{display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:999px; font-size:.78rem; font-weight:500;
          white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; vertical-align:middle}
    .pill.ok{background:var(--ok-bg); color:var(--ok-ink)}
    .pill.bad{background:var(--bad-bg); color:var(--bad-ink)}
    .pill.run{background:var(--accent-bg); color:var(--accent)}
    .pill.idle{background:var(--panel2); color:var(--muted)}
    .pill.live::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; animation:pulse 1.6s infinite}
    @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.25}}
    @media (prefers-reduced-motion: reduce){ .pill.live::before{animation:none} }
    .ok{color:var(--ok-ink)} .bad{color:var(--bad-ink)} .run{color:var(--accent)}
    .notes{margin:6px 0 0; padding-left:18px; font-size:.82rem; color:var(--muted)}
    .empty{text-align:center; padding:34px 18px}
    .empty .big{font-size:1.6rem; margin-bottom:6px}
    .empty .sub{max-width:520px; margin:0 auto 14px}
    /* forms */
    .crumbs{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:.88rem; color:var(--muted); margin:0 0 12px}
    .crumbs a{color:var(--accent); text-decoration:none; cursor:pointer} .crumbs a:hover{text-decoration:underline}
    .crumbs b{color:var(--ink); font-weight:600}
    .form{display:grid; grid-template-columns:170px minmax(0, 560px); gap:12px 16px; align-items:start; margin:4px 0}
    .form > label{color:var(--ink); font-size:.86rem; font-weight:500; padding-top:7px}
    .form input[type=text], .form input[type=password], .form input[type=number], .form select{width:100%}
    .form .help{font-size:.8rem; color:var(--muted); margin-top:5px}
    .form .with{display:flex; gap:8px; align-items:center} .form .with select{flex:1}
    .sect{font-size:.74rem; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
          margin:20px 0 10px; padding-top:14px; border-top:1px solid var(--line)}
    .sect:first-of-type{border-top:0; padding-top:0; margin-top:4px}
    .seg{display:inline-flex; gap:4px; flex-wrap:wrap}
    button.on{border-color:var(--accent); color:var(--accent); background:var(--accent-bg)}
    .tables{display:flex; flex-direction:column; gap:2px; max-height:300px; overflow:auto; padding:6px;
            border:1px solid var(--line); border-radius:8px; background:var(--panel)}
    .tables label{display:flex; gap:8px; align-items:center; cursor:pointer; padding:4px 6px; border-radius:6px; font-size:.88rem}
    .tables label:hover{background:var(--panel2)}
    .tables .key{margin-left:auto; font-size:.75rem; color:var(--muted)}
    /* how a job runs: three choices */
    .choices{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px}
    .choice{border:1px solid var(--line2); border-radius:10px; padding:10px 12px; cursor:pointer; background:var(--panel); text-align:left;
            font:inherit; color:inherit; display:block; width:100%}
    .choice:hover{border-color:var(--accent)}
    .choice b{display:block; font-size:.9rem; margin-bottom:3px}
    .choice span{display:block; font-size:.78rem; color:var(--muted); line-height:1.35}
    .choice.on{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg)} .choice.on b{color:var(--accent)}
    .choice:disabled{opacity:.5; cursor:not-allowed; border-color:var(--line)}
    .cron{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:10px}
    .cron input, .form .cron input{width:180px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace}
    .card.narrow{max-width:820px}
    .cron select{width:auto}
    .facts{display:grid; grid-template-columns:150px 1fr; gap:8px 16px; font-size:.9rem; margin:4px 0 0}
    .facts dt{color:var(--muted)} .facts dd{margin:0}
    .facts a{color:var(--accent); cursor:pointer}
    .head{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:12px}
    .head h3{margin:0; font-size:1.05rem}
    .actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
    .navbtns{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-top:18px; padding-top:14px; border-top:1px solid var(--line)}
    .flash{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
    pre.log{max-height:420px; overflow:auto; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
            padding:8px 10px; font-size:.78rem; line-height:1.4; white-space:pre-wrap; word-break:break-all; margin:10px 0 0}
    .ask{display:inline-flex; flex-wrap:wrap; align-items:center; gap:8px; padding:5px 10px; border:1px solid var(--gold); border-radius:9px;
         background:var(--warn-bg); font-size:.85rem}
    @media (max-width:760px){ .form, .facts{grid-template-columns:1fr} .form > label{padding-top:0} .choices{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=16"></script>
  <div class="pagebar"><h1>📡 Ingestion <span class="dot">·</span> copy tables from your databases into your lakehouse</h1></div>
  <main id="main"><div class="placeholder">Loading…</div></main>
  <script>
    // 📡 Ingestion — three tabs:
    //   SOURCES       databases you can reach (PostgreSQL; with OLake also MySQL, SQL Server)
    //   DESTINATIONS  one of your lakehouse catalogs + a namespace
    //   JOBS          a source → a destination: the tables, the mode, and how it runs —
    //                 Manual (Run now), Cron (a cron expression, UTC) or Datastream (always on, Debezium)
    // The work runs in the lab as you (Debezium + Kafka, or OLake's engine). Every screen has its own
    // address (#sources, #jobs, #job/3, #new-job …), so the browser's Back button works.
    var main = document.getElementById('main');
    function el(tag, attrs, kids) {
      var e = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === 'text') e.textContent = attrs[k];
        else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }
    function on(e, ev, f) { e.addEventListener(ev, f); return e; }
    function api(method, path, body) {
      return fetch(path, {method: method, credentials: 'same-origin',
          headers: body ? {'Content-Type': 'application/json', 'X-Lab-Request': '1'} : {},
          body: body ? JSON.stringify(body) : undefined})
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
    }
    // inline "are you sure?" next to a button (no browser popups)
    function ask(btn, question, yesText, yes) {
      var y = el('button', {class: 'small danger', text: yesText}), n = el('button', {class: 'small', text: 'Cancel'});
      var box = el('span', {class: 'ask'}, [el('span', {text: question}), y, n]);
      btn.hidden = true; btn.parentNode.insertBefore(box, btn.nextSibling);
      on(n, 'click', function () { box.remove(); btn.hidden = false; });
      on(y, 'click', function () { box.remove(); btn.hidden = false; yes(btn); });
    }
    function when(iso) { return iso ? new Date(iso).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}) : '—'; }
    function seg(options, value, onPick) {             // segmented buttons
      var s = el('span', {class: 'seg'});
      options.forEach(function (o) {
        var b = on(el('button', {type: 'button', class: 'small' + (o[0] === value ? ' on' : ''), text: o[1]}), 'click', function () {
          [].forEach.call(s.children, function (x) { x.classList.toggle('on', x === b); }); onPick(o[0]);
        });
        s.appendChild(b);
      });
      return s;
    }
    function select(options, value) {                  // options: [[value, text]]
      var s = el('select', {}, options.map(function (o) { return el('option', {value: o[0], text: o[1]}); }));
      s.value = value === null || value === undefined ? '' : String(value);
      return s;
    }
    function note(text, cls) { return el('div', {class: 'sub ' + (cls || ''), style: 'margin-top:8px', text: text}); }
    function inp(v, type, ph) { var i = el('input', {type: type || 'text'}); if (v !== undefined && v !== null) i.value = v; if (ph) i.placeholder = ph;
      i.autocomplete = type === 'password' ? 'new-password' : 'off';   // no browser autofill of the portal login
      return i; }
    function card(kids, cls) { return el('div', {class: 'card' + (cls ? ' ' + cls : ''), style: 'margin-bottom:14px'}, kids); }
    function pill(cls, text, title) { return el('span', {class: 'pill ' + cls, title: title || text, text: text}); }
    function help(text) { return el('div', {class: 'help', text: text}); }
    // a task (check / list tables / run) is done by the lab in the background: ask until it ends
    function watch(id, done) {
      api('GET', '/api/cdc/task?id=' + id).then(function (t) {
        if (t.status === 'queued' || t.status === 'running') return setTimeout(function () { watch(id, done); }, 2000);
        done(t);
      }).catch(function (e) { done({status: 'failed', error: e.message}); });
    }

    var MODE = {cdc: 'Full load + CDC (merge by key)', append: 'Full load + every change (history)', full_refresh: 'Full reload every run'};
    var MODE_HELP = {
      cdc: 'First everything, then the inserts, updates and deletes — merged by the primary key: each table keeps one row per key, the latest.',
      append: 'First everything, then every insert, update and delete as a new row; nothing is overwritten — the raw material for history and SCD2.',
      full_refresh: 'Every run copies the chosen tables again.'};
    var CRONS = [['*/15 * * * *', 'Every 15 minutes'], ['0 * * * *', 'Every hour'], ['0 2 * * *', 'Every day at 02:00'],
                 ['0 6 * * 1-5', 'Weekdays at 06:00'], ['0 3 * * 0', 'Sundays at 03:00']];
    var data = null, timer = null, busy = {}, flash = null;
    var wiz = null;          // the New job form — kept while you add a source / destination on the way

    // ---- how a job runs: '' manual · a cron expression · 'stream' ---------------------------------
    function runType(schedule) { return !schedule ? 'manual' : schedule === 'stream' ? 'stream' : 'cron'; }
    function two(n) { return (n < 10 ? '0' : '') + n; }
    function cronText(c) {                              // the usual shapes in words, else the expression
      var p = (c || '').split(/\s+/), m, preset = CRONS.filter(function (x) { return x[0] === c; })[0];
      if (preset) return preset[1] + ' (UTC)';
      if (p.length !== 5) return c;
      if ((m = /^\*\/(\d+)$/.exec(p[0])) && p.slice(1).join(' ') === '* * * *') return 'Every ' + m[1] + ' minutes';
      if (/^\d+$/.test(p[0]) && p[1] === '*' && p.slice(2).join(' ') === '* * *') return 'Every hour at :' + two(+p[0]);
      if (/^\d+$/.test(p[0]) && /^\d+$/.test(p[1]) && p[2] === '*' && p[3] === '*') {
        var at = two(+p[1]) + ':' + two(+p[0]) + ' UTC';
        if (p[4] === '*') return 'Every day at ' + at;
        if (p[4] === '1-5') return 'Weekdays at ' + at;
      }
      return c + ' (UTC)';
    }
    function runLabel(j) {
      var t = runType(j.schedule);
      if (t === 'manual') return el('span', {}, [el('div', {text: 'Manual'})]);
      if (t === 'stream') return el('span', {}, [el('div', {text: 'Datastream'}), el('div', {class: 'sub muted', text: j.enabled ? 'always on' : 'stopped'})]);
      return el('span', {}, [el('div', {text: 'Cron'}), el('div', {class: 'sub muted', title: j.schedule,
        text: cronText(j.schedule) + (!j.enabled ? ' · paused' : j.next_run ? ' · next ' + when(j.next_run) : '')})]);
    }
    // three choices + (for Cron) a preset list and the expression → st.value() is the schedule to save
    function runPicker(st, engine, changed) {
      var box = el('div'), choices = el('div', {class: 'choices'}), extra = el('div');
      var opts = [['manual', 'Manual', 'Runs when you press Run now.'],
                  ['cron', 'Cron', 'Runs on a schedule — a cron expression, in UTC.'],
                  ['stream', 'Datastream', 'Always on: changes arrive in seconds (~10–30 s behind).']];
      opts.forEach(function (o) {
        var b = el('button', {type: 'button', class: 'choice' + (st.type === o[0] ? ' on' : ''), disabled: o[0] === 'stream' && engine !== 'debezium' ? '' : null},
          [el('b', {text: o[1]}), el('span', {text: o[0] === 'stream' && engine !== 'debezium' ? 'Needs the Debezium engine.' : o[2]})]);
        on(b, 'click', function () { st.type = o[0]; [].forEach.call(choices.children, function (x) { x.classList.toggle('on', x === b); }); paint(); changed(); });
        choices.appendChild(b);
      });
      function paint() {
        extra.innerHTML = '';
        if (st.type !== 'cron') return;
        var expr = inp(st.cron || '*/15 * * * *', 'text', 'min hour day month weekday'), words = el('span', {class: 'sub'});
        var presets = select([['', 'Presets…']].concat(CRONS), '');
        function said() { st.cron = expr.value.trim(); words.textContent = '→ ' + cronText(st.cron); changed(); }
        on(presets, 'change', function () { if (presets.value) { expr.value = presets.value; presets.value = ''; said(); } });
        on(expr, 'input', said);
        extra.appendChild(el('div', {class: 'cron'}, [presets, expr, words]));
        extra.appendChild(help('minute hour day-of-month month day-of-week — e.g. */15 * * * * (every 15 minutes), 30 6 * * 1-5 (weekdays 06:30). Times are UTC.'));
        st.cron = expr.value.trim(); words.textContent = '→ ' + cronText(st.cron);
      }
      st.value = function () { return st.type === 'manual' ? '' : st.type === 'stream' ? 'stream' : (st.cron || '').trim(); };
      paint();
      box.appendChild(choices); box.appendChild(extra);
      return box;
    }

    // ---- navigation ----------------------------------------------------------------------------
    function route() { var h = location.hash.slice(1) || 'jobs', i = h.indexOf('/'); return i < 0 ? [h, null] : [h.slice(0, i), h.slice(i + 1)]; }
    function go(hash) { if (location.hash.slice(1) !== hash) history.pushState(null, '', '#' + hash); show(); }
    window.addEventListener('popstate', show);
    function link(text, hash, cls) { return on(el('a', {text: text, class: cls || ''}), 'click', function () { go(hash); }); }
    function crumbs(parts) {                            // Ingestion › Jobs › New job
      var c = el('div', {class: 'crumbs'}, [link('Ingestion', 'jobs')]);
      parts.forEach(function (p, i) { c.appendChild(document.createTextNode('›')); c.appendChild(i === parts.length - 1 ? el('b', {text: p[0]}) : link(p[0], p[1])); });
      return c;
    }
    function load() {
      clearTimeout(timer);
      return api('GET', '/api/cdc').then(function (d) { data = d; }).catch(function (e) {
        main.innerHTML = ''; main.appendChild(el('div', {class: 'placeholder', text: 'Could not load: ' + e.message})); throw e;
      });
    }
    function show() { load().then(draw, function () {}); }
    function draw() {
      clearTimeout(timer);
      var r = route(), page = r[0], id = r[1];
      main.innerHTML = '';
      if (page === 'new-job') return newJob();
      if (page === 'job') return jobPage(+id);
      if (page === 'new-source') return sourcePage({kind: 'postgres', cdc: true});
      if (page === 'source') return sourcePage(byId(data.sources, +id));
      if (page === 'new-destination') return destPage({});
      if (page === 'destination') return destPage(byId(data.destinations, +id));
      listPage(['jobs', 'sources', 'destinations'].indexOf(page) >= 0 ? page : 'jobs');
    }
    function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0] || null; }
    function showFlash() {
      if (!flash) return;
      var f = flash; flash = null;
      main.appendChild(el('div', {class: 'card result', style: 'margin-bottom:14px'}, [el('div', {class: 'flash'}, [el('span', {text: f.text}),
        f.action ? on(el('button', {class: 'small primary', text: f.action[0]}), 'click', f.action[1]) : null])]));
    }
    function alert_(msg) { main.insertBefore(el('div', {class: 'card result err', style: 'margin-bottom:14px'}, [el('div', {text: msg})]), main.firstChild); }

    // ---- the three tabs: Sources · Destinations · Jobs --------------------------------------------
    function listPage(tab) {
      var tabs = el('nav', {class: 'tabs'}, [['sources', 'Sources', data.sources.length], ['destinations', 'Destinations', data.destinations.length],
                                             ['jobs', 'Jobs', data.jobs.length]].map(function (t) {
        return on(el('a', {class: t[0] === tab ? 'on' : ''}, [t[1], el('span', {class: 'n', text: String(t[2])})]), 'click', function () { go(t[0]); });
      }));
      var add = {jobs: ['+ New job', function () { wiz = null; go('new-job'); }], sources: ['+ New source', function () { wiz = null; go('new-source'); }],
                 destinations: ['+ New destination', function () { wiz = null; go('new-destination'); }]}[tab];
      main.appendChild(el('div', {class: 'toolbar'}, [tabs, on(el('button', {class: 'primary', text: add[0]}), 'click', add[1])]));
      showFlash();
      main.appendChild({jobs: jobList, sources: sourceList, destinations: destList}[tab]());
      if (data.jobs.some(function (j) { return j.busy || streaming(j); }) || Object.keys(busy).length) timer = setTimeout(show, 5000);
    }
    function table(heads, body) {
      return el('div', {class: 'wrap'}, [el('table', {class: 'lst'}, [el('thead', {}, [el('tr', {}, heads.map(function (h) {
        return el('th', {class: h === '' ? 'r' : null, text: h}); }))]), body])]);
    }
    function empty(icon, title, text, btn) {
      return card([el('div', {class: 'empty'}, [el('div', {class: 'big', text: icon}), el('h3', {text: title}), el('div', {class: 'sub', text: text}), btn])]);
    }
    function checked(c, isBusy) {
      if (isBusy) return pill('run', '… checking');
      if (!c) return pill('idle', 'not checked');
      return pill(c.ok ? 'ok' : 'bad', c.ok ? '✓ ready' : '✗ ' + (c.message || 'failed').slice(0, 60), c.message || '');
    }
    function streaming(j) { return j.schedule === 'stream' && j.enabled; }
    function last(j) {                                 // a job's state, as a pill (+ a line under it)
      var r = j.last;
      if (j.schedule === 'stream') {
        if (!j.enabled) return r && r.trigger === 'stream' && r.status === 'failed'
          ? el('span', {}, [pill('bad', '✗ stopped'), el('div', {class: 'sub bad', title: r.error || '', text: (r.error || '').slice(0, 200)})])
          : pill('idle', '■ stopped');
        if (!r || r.trigger !== 'stream' || r.status !== 'running') return pill('run', '… starting');
        var behind = (r.meta || {}).behind;
        return el('span', {}, [pill('ok live', 'streaming'),
          el('div', {class: 'sub muted', text: (r.records || 0) + ' changes since ' + when(r.started_at) + (behind ? ' · ' + behind + ' on the way' : '')}),
          r.error ? el('div', {class: 'sub bad', title: r.error, text: '✗ ' + r.error.slice(0, 120) + ' — restarting'}) : null]);
      }
      if (j.busy && !(r && r.status === 'running')) return pill('run', '… starting');
      if (!r) return pill('idle', 'not run yet');
      if (r.status === 'running') return el('span', {}, [pill('run live', 'running'), el('div', {class: 'sub muted', text: 'since ' + when(r.started_at)})]);
      return el('span', {}, [pill(r.status === 'ok' ? 'ok' : 'bad', r.status === 'ok' ? '✓ ok' : '✗ failed', r.error || ''),
        el('div', {class: 'sub muted', text: (r.status === 'ok' && r.records !== null ? r.records + ' rows · ' : '') + when(r.finished_at)})]);
    }

    function jobList() {
      if (!data.jobs.length) return empty('📡', 'No jobs yet', 'A job copies tables from a source into a destination — once, on a schedule, or as a live data stream.',
        on(el('button', {class: 'primary', text: '+ New job'}), 'click', function () { wiz = null; go('new-job'); }));
      var body = el('tbody');
      data.jobs.forEach(function (j) {
        var runNow = on(el('button', {class: 'small', text: '▶ Run'}), 'click', function () {
          runNow.disabled = true;
          api('POST', '/api/cdc/jobs/run', {id: j.id}).then(function () { setTimeout(show, 1200); }).catch(function (e) { alert_(e.message); runNow.disabled = false; });
        });
        runNow.disabled = !!j.busy;
        runNow.hidden = j.schedule === 'stream';
        body.appendChild(el('tr', {}, [
          el('td', {}, [link(j.name, 'job/' + j.id, 'name'), el('div', {class: 'sub muted', text: j.engine === 'debezium' ? 'Debezium' : 'OLake'})]),
          el('td', {}, [el('div', {text: j.source_name}), el('div', {class: 'sub muted', text: '→ ' + j.dest_name})]),
          el('td', {title: j.tables.join(', '), text: j.tables.length === 1 ? j.tables[0] : j.tables.length + ' tables'}),
          el('td', {text: MODE[j.mode]}), el('td', {}, [runLabel(j)]), el('td', {}, [last(j)]),
          el('td', {class: 'acts'}, [runNow, on(el('button', {class: 'small', text: 'Open'}), 'click', function () { go('job/' + j.id); })])]));
      });
      return card([table(['Job', 'Source → destination', 'Tables', 'Mode', 'Runs', 'Status', ''], body)]);
    }

    function sourceList() {

      main.appendChild(card([el('h3', {text: 'Runs'}), runsBox]));
      showRuns(j, runsBox);
      if (j.busy || streaming(j)) timer = setTimeout(show, j.busy ? 4000 : 8000);
    }
    function showRuns(j, box) {
      box.appendChild(note('Loading…'));
      api('GET', '/api/cdc/runs?job=' + j.id).then(function (d) {
        box.innerHTML = '';
        if (!d.runs.length) return box.appendChild(note('No runs yet.'));
        var logBox = el('div');
        box.appendChild(el('div', {class: 'wrap'}, [el('table', {class: 'lst'}, [el('thead', {}, [el('tr', {}, ['Started', 'Took', 'Result', 'Rows', 'Why', ''].map(function (h) { return el('th', {text: h}); }))]),
          el('tbody', {}, d.runs.map(function (r) {
            var took = r.finished_at ? Math.max(1, Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 1000)) + ' s' : '…';
            var lg = on(el('button', {class: 'small', text: 'Log'}), 'click', function () {
              api('GET', '/api/cdc/run?id=' + r.id).then(function (x) {
                logBox.innerHTML = ''; logBox.appendChild(el('pre', {class: 'log', text: (x.error ? 'Error: ' + x.error + '\n\n' : '') + (x.log || '(no log)')}));
              }).catch(function (e) { alert_(e.message); });
            });
            var res = r.status === 'ok' ? pill('ok', r.trigger === 'stream' ? '■ stopped' : '✓ ok')
              : r.status === 'running' ? pill('run live', r.trigger === 'stream' ? 'streaming' : 'running')
              : pill('bad', '✗ ' + (r.error || 'failed').slice(0, 80), r.error || '');
            return el('tr', {}, [el('td', {class: 'muted', text: when(r.started_at)}), el('td', {class: 'muted', text: took}), el('td', {}, [res]),
              el('td', {text: r.records === null ? '—' : String(r.records)}), el('td', {class: 'muted', text: r.trigger || ''}),
              el('td', {class: 'acts'}, [r.trigger === 'stream' ? null : lg])]);
          }))])]));
        box.appendChild(logBox);
      }).catch(function (e) { box.innerHTML = ''; box.appendChild(note(e.message, 'bad')); });
    }

    show();
  </script>
</body>
</html>
