<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data sync — Epireum's Data Engineering Lab</title>
  <link rel="stylesheet" href="/admin.css?v=8">
  <style>
    main{max-width:none}
    .seg{display:inline-flex; gap:4px; flex-wrap:wrap}
    button.on{border-color:var(--accent); color:var(--accent)}
    .ok{color:var(--accent2)} .bad{color:var(--bad-ink)} .run{color:var(--accent)}
    .lst td{vertical-align:middle} .lst .acts{white-space:nowrap; text-align:right}
    .lst tr.more > td{background:var(--panel2); padding:8px 14px 12px}
    .form{display:grid; grid-template-columns:160px minmax(0, 420px); gap:10px 14px; align-items:center; margin:6px 0 12px}
    .form label{color:var(--muted); font-size:.88rem}
    .form input[type=text], .form input[type=password], .form input[type=number], .form select{width:100%}
    .tables{display:flex; flex-direction:column; gap:4px; max-height:260px; overflow:auto; padding:6px 8px;
            border:1px solid var(--line); border-radius:8px; background:var(--panel2)}
    .tables label{display:flex; gap:8px; align-items:center; cursor:pointer}
    pre.log{max-height:420px; overflow:auto; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
            padding:8px 10px; font-size:.78rem; line-height:1.4; white-space:pre-wrap; word-break:break-all; margin:8px 0 0}
    .notes{margin:6px 0 0; padding-left:18px; font-size:.86rem}
    .ask{display:inline-flex; flex-wrap:wrap; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--gold); border-radius:9px; background:rgba(226,185,59,.08); font-size:.88rem}
    @media (max-width:640px){ .form{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=13"></script>
  <div class="pagebar"><h1>📡 Data sync <span class="dot">·</span> copy tables from your databases into your lakehouse</h1></div>
  <main id="main"><div class="placeholder">Loading…</div></main>
  <script>
    // 📡 Data sync (CDC) — a SOURCE is a database you can reach (PostgreSQL, MySQL, SQL Server); a DESTINATION is one of your
    // lakehouse catalogs (+ a namespace); a JOB copies chosen tables from a source to a destination:
    // a full load, then — with CDC — only the inserts, updates and deletes since the last run, on a
    // schedule or when you press Run now. The work runs in the lab (OLake's engine), as you.
    var main = document.getElementById('main');
    function el(tag, attrs, kids) {
      var e = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === 'text') e.textContent = attrs[k];
        else if (k === 'html') e.innerHTML = attrs[k];
        else e.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }
    function on(e, ev, f) { e.addEventListener(ev, f); return e; }
    function api(method, path, body) {
      return fetch(path, {method: method, credentials: 'same-origin',
          headers: body ? {'Content-Type': 'application/json', 'X-Lab-Request': '1'} : {},
          body: body ? JSON.stringify(body) : undefined})
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
    }
    // inline "are you sure?" next to a button (no browser popups)
    function ask(btn, question, yesText, yes) {
      var y = el('button', {class: 'small danger', text: yesText}), n = el('button', {class: 'small', text: 'Cancel'});
      var box = el('span', {class: 'ask'}, [el('span', {text: question}), y, n]);
      btn.hidden = true; btn.parentNode.insertBefore(box, btn.nextSibling);
      on(n, 'click', function () { box.remove(); btn.hidden = false; });
      on(y, 'click', function () { box.remove(); btn.hidden = false; yes(btn); });
    }
    function when(iso) { return iso ? new Date(iso).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}) : '—'; }
    function seg(options, value, onPick) {             // segmented buttons instead of a dropdown
      var s = el('span', {class: 'seg'});
      options.forEach(function (o) {
        var b = on(el('button', {type: 'button', class: 'small' + (o[0] === value ? ' on' : ''), text: o[1]}), 'click', function () {
          [].forEach.call(s.children, function (x) { x.classList.toggle('on', x === b); }); onPick(o[0]);
        });
        s.appendChild(b);
      });
      return s;
    }
    function note(text, cls) { return el('div', {class: 'sub ' + (cls || ''), style: 'margin-top:6px', text: text}); }
    // a task (check / list tables / run) is done by the lab in the background: ask until it ends
    function watch(id, done) {
      api('GET', '/api/cdc/task?id=' + id).then(function (t) {
        if (t.status === 'queued' || t.status === 'running') return setTimeout(function () { watch(id, done); }, 2000);
        done(t);
      }).catch(function (e) { done({status: 'failed', error: e.message}); });
    }

    var TABS = [['jobs', 'Jobs'], ['sources', 'Sources'], ['destinations', 'Destinations']];
    var SCHED = {'': 'Manual', '15m': 'Every 15 min', '1h': 'Hourly', '1d': 'Daily'};
    var MODE = {cdc: 'Full load + CDC', full_refresh: 'Full reload every run'};
    var tab = (location.hash.slice(1) || 'jobs'), data = null, timer = null, openRuns = {};

    function load() {
      clearTimeout(timer);
      return api('GET', '/api/cdc').then(function (d) { data = d; render(); }).catch(function (e) {
        main.innerHTML = ''; main.appendChild(el('div', {class: 'placeholder', text: 'Could not load: ' + e.message}));
      });
    }
    function render(form) {
      history.replaceState(null, '', '#' + tab);
      main.innerHTML = '';
      var tabs = seg(TABS.map(function (t) { return [t[0], t[1] + ' (' + data[t[0]].length + ')']; }), tab, function (k) { tab = k; render(); });
      var add = on(el('button', {class: 'primary', text: {jobs: '+ New job', sources: '+ New source', destinations: '+ New destination'}[tab]}),
                   'click', function () { render(tab); });
      main.appendChild(el('div', {class: 'bar'}, [tabs, add]));
      if (form === 'jobs') main.appendChild(jobForm());
      else if (form === 'sources') main.appendChild(sourceForm({kind: 'postgres', cdc: true}));
      else if (form === 'destinations') main.appendChild(destForm({}));
      else if (form) main.appendChild(form);
      main.appendChild({jobs: jobList, sources: sourceList, destinations: destList}[tab]());
      // a run in progress: look again in a few seconds
      if (data.jobs.some(function (j) { return j.busy; }) && !form)
        timer = setTimeout(load, 4000);
    }

    // ---- sources -------------------------------------------------------------------------------
    function checked(c, busy) {
      if (busy) return el('span', {class: 'run', text: '… checking'});
      if (!c) return el('span', {class: 'muted', text: 'not checked'});
      return el('span', {class: c.ok ? 'ok' : 'bad', title: c.message || '', text: c.ok ? '✓ connected' : '✗ ' + (c.message || 'failed').slice(0, 120)});
    }
    var busy = {};
    function sourceList() {
      if (!data.sources.length) return el('div', {class: 'card'}, [el('div', {class: 'sub',
        text: 'No sources yet. A source is a database you can reach — PostgreSQL, MySQL or SQL Server: its host, database and a login.'})]);
      var body = el('tbody');
      data.sources.forEach(function (s) {
        var chk = on(el('button', {class: 'small', text: 'Check'}), 'click', function () {
          busy['s' + s.id] = 1; render();
          api('POST', '/api/cdc/sources/check', {id: s.id}).then(function (r) { watch(r.task, function () { delete busy['s' + s.id]; load(); }); })
            .catch(function (e) { delete busy['s' + s.id]; alert_(e.message); });
        });
        var edit = on(el('button', {class: 'small', text: 'Edit'}), 'click', function () { render(sourceForm(s)); });
        var more = el('tr', {class: 'more', hidden: ''}, [el('td', {colspan: '6'})]);
        var tbl = on(el('button', {class: 'small', text: 'Tables'}), 'click', function () {
          more.hidden = !more.hidden; tbl.classList.toggle('on', !more.hidden);
          if (more.hidden) return;
          var td = more.firstChild; td.innerHTML = ''; td.appendChild(el('div', {class: 'sub run', text: '… reading the tables'}));
          api('POST', '/api/cdc/sources/tables', {id: s.id}).then(function (r) {
            watch(r.task, function (t) { td.innerHTML = ''; td.appendChild(tableList(t)); });
          }).catch(function (e) { td.innerHTML = ''; td.appendChild(note(e.message, 'bad')); });
        });
        var del = on(el('button', {class: 'small', text: 'Delete'}), 'click', function () {
          ask(del, s.cdc ? 'Delete it (its replication slot is dropped too)?' : 'Delete it?', 'Yes, delete', function () {
            api('POST', '/api/cdc/sources/delete', {id: s.id}).then(function (r) {
              if (r.task) watch(r.task, function (t) { if (t.result && t.result.note) alert_(t.result.note, true); load(); }); else load();
            }).catch(function (e) { alert_(e.message); });
          });
        });
        var c = s.checked, info = [];
        if (c && (c.notes || []).length) info = info.concat(c.notes);
        if (c) (c.prerequisites || []).filter(function (p) { return !p.passed; }).forEach(function (p) {
          info.push((p.required ? '✗ needed: ' : 'tip: ') + p.name + ' is ' + p.current + ' — ' + p.recommended);
        });
        body.appendChild(el('tr', {}, [el('td', {}, [el('b', {text: s.name})]),
          el('td', {}, [el('div', {text: s.host + ':' + s.port + ' / ' + s.database}), el('div', {class: 'sub', text: data.kinds[s.kind].name})]),
          el('td', {text: s.username}),
          el('td', {text: s.cdc ? 'on' : 'off', title: s.cdc && s.slot ? 'publication ' + s.publication + ' · slot ' + s.slot : ''}),
          el('td', {}, [checked(c, busy['s' + s.id]), info.length ? el('ul', {class: 'notes'}, info.map(function (x) { return el('li', {text: x}); })) : null]),
          el('td', {class: 'acts'}, [chk, ' ', tbl, ' ', edit, ' ', del])]));
        body.appendChild(more);
      });
      return el('div', {class: 'card'}, [el('div', {class: 'wrap'}, [el('table', {class: 'lst'}, [el('thead', {}, [el('tr', {},
        ['Source', 'Database', 'User', 'CDC', 'Status', ''].map(function (h) { return el('th', {text: h}); }))]), body])])]);
    }
    function sourceForm(s) {
      var kind = s.kind || 'postgres';
      var f = {name: inp(s.name), host: inp(s.host), port: inp(s.port || data.kinds[kind].port, 'number'), database: inp(s.database), username: inp(s.username),
               password: inp('', 'password', s.id ? 'unchanged' : ''), schemas: inp((s.schemas || []).join(', '), 'text', 'all — or e.g. public, sales')};
      var cdc = !!s.cdc, schemaLabel = el('label', {text: 'Schemas'}), hint = el('div', {class: 'sub'});
      function kindChanged() {                          // the type's port, schemas (Postgres only), what CDC needs
        var k = data.kinds[kind], ports = Object.keys(data.kinds).map(function (x) { return String(data.kinds[x].port); });
        if (!f.port.value || ports.indexOf(f.port.value) >= 0) f.port.value = k.port;
        schemaLabel.hidden = f.schemas.hidden = kind !== 'postgres';
        hint.textContent = 'CDC reads the database\'s change log. ' + k.name + ' needs: ' + k.cdc + '.';
      }
      var kinds = el('select', {}, Object.keys(data.kinds).map(function (k) { return el('option', {value: k, text: data.kinds[k].name}); }));
      kinds.value = kind; kinds.disabled = !!s.id;      // a saved source keeps its type
      on(kinds, 'change', function () { kind = kinds.value; kindChanged(); });
      function form() {
        return {id: s.id, kind: kind, name: f.name.value, host: f.host.value, port: f.port.value, database: f.database.value,
                username: f.username.value, password: f.password.value, cdc: cdc,
                schemas: f.schemas.value.split(',').map(function (x) { return x.trim(); }).filter(Boolean)};
      }
      var save = el('button', {class: 'primary', text: s.id ? 'Save & check' : 'Add & check'}), msg = el('div');
      // Test connection / Browse tables: the form as it is, before saving it
      var test = on(el('button', {type: 'button', text: 'Test connection'}), 'click', function () {
        test.disabled = true; msg.innerHTML = ''; msg.appendChild(el('div', {class: 'sub run', text: '… connecting'}));
        api('POST', '/api/cdc/sources/test', form()).then(function (r) {
          watch(r.task, function (t) {
            test.disabled = false; msg.innerHTML = '';
            var ok = t.status === 'done' && t.result && t.result.ok;
            msg.appendChild(note(ok ? '✓ Connected' : '✗ ' + ((t.result && t.result.message) || t.error || 'failed'), ok ? 'ok' : 'bad'));
          });
        }).catch(function (e) { test.disabled = false; msg.innerHTML = ''; msg.appendChild(note(e.message, 'bad')); });
      });
      var browse = on(el('button', {type: 'button', text: 'Browse tables'}), 'click', function () {
        browse.disabled = true; msg.innerHTML = ''; msg.appendChild(el('div', {class: 'sub run', text: '… reading the tables'}));
        api('POST', '/api/cdc/sources/browse', form()).then(function (r) {
          watch(r.task, function (t) { browse.disabled = false; msg.innerHTML = ''; msg.appendChild(tableList(t)); });
        }).catch(function (e) { browse.disabled = false; msg.innerHTML = ''; msg.appendChild(note(e.message, 'bad')); });
      });
      on(save, 'click', function () {
        save.disabled = true; msg.innerHTML = ''; msg.appendChild(note('Saving…'));
        api('POST', '/api/cdc/sources', form())
          .then(function (r) { tab = 'sources'; busy['s' + r.id] = 1; load(); watch(r.task, function () { delete busy['s' + r.id]; load(); }); })
          .catch(function (e) { save.disabled = false; msg.innerHTML = ''; msg.appendChild(note(e.message, 'bad')); });
      });
      kindChanged();
      return el('div', {class: 'card'}, [el('h3', {text: s.id ? 'Edit source ' + s.name : 'New source — a database you can reach'}),
        el('div', {class: 'form'}, [
          el('label', {text: 'Database type'}), kinds, el('label', {text: 'Name'}), f.name, el('label', {text: 'Host'}), f.host, el('label', {text: 'Port'}), f.port,
          el('label', {text: 'Database'}), f.database, el('label', {text: 'User'}), f.username, el('label', {text: 'Password'}), f.password,
          schemaLabel, f.schemas,
          el('label', {text: 'Change data capture'}), seg([[true, 'On — copy inserts, updates, deletes'], [false, 'Off — full reloads only']], cdc, function (v) { cdc = v; })]),
        hint,
        el('div', {class: 'row', style: 'margin-top:10px'}, [test, browse, save, on(el('button', {text: 'Cancel'}), 'click', function () { render(); })]), msg]);
    }
    // a finished table-list task → the tables (read only), or why it failed
    function tableList(t) {
      if (t.status !== 'done') return note('✗ ' + (t.error || 'failed'), 'bad');
      var tb = t.result.tables;
      if (!tb.length) return note('No tables found.');
      return el('div', {style: 'margin-top:8px'}, [el('div', {class: 'sub', text: tb.length + (tb.length === 1 ? ' table' : ' tables')}),
        el('div', {class: 'tables'}, tb.map(function (x) {
          return el('div', {}, [el('span', {text: x.table}), el('span', {class: 'muted', text: ' · ' + x.columns + ' columns'})]);
        }))]);
    }
    function inp(v, type, ph) { var i = el('input', {type: type || 'text'}); if (v !== undefined && v !== null) i.value = v; if (ph) i.placeholder = ph; return i; }

    // ---- destinations --------------------------------------------------------------------------
    function destList() {
      var body = el('tbody');
      data.destinations.forEach(function (d) {
        var chk = on(el('button', {class: 'small', text: 'Check'}), 'click', function () {
          busy['d' + d.id] = 1; render();
          api('POST', '/api/cdc/destinations/check', {id: d.id}).then(function (r) { watch(r.task, function () { delete busy['d' + d.id]; load(); }); })
            .catch(function (e) { delete busy['d' + d.id]; alert_(e.message); });
        });
        var edit = on(el('button', {class: 'small', text: 'Edit'}), 'click', function () { render(destForm(d)); });
        var del = on(el('button', {class: 'small', text: 'Delete'}), 'click', function () {
          ask(del, 'Delete it? (the tables stay in your lakehouse)', 'Yes, delete', function () {
            api('POST', '/api/cdc/destinations/delete', {id: d.id}).then(load).catch(function (e) { alert_(e.message); });
          });
        });
        body.appendChild(el('tr', {}, [el('td', {}, [el('b', {text: d.name})]), el('td', {text: d.catalog}),
          el('td', {text: d.namespace || '(the source\'s database_schema)'}), el('td', {}, [checked(d.checked, busy['d' + d.id])]),
          el('td', {class: 'acts'}, [chk, ' ', edit, ' ', del])]));
      });
      return el('div', {class: 'card'}, [el('div', {class: 'wrap'}, [el('table', {class: 'lst'}, [el('thead', {}, [el('tr', {},
        ['Destination', 'Lakehouse', 'Namespace', 'Status', ''].map(function (h) { return el('th', {text: h}); }))]), body])]),
        el('div', {class: 'sub', style: 'margin-top:8px', text: 'Tables land as Iceberg tables in that lakehouse and namespace — query them in SQL, notebooks or Superset. The lab writes them as you: no keys to type.'})]);
    }
    function destForm(d) {
      var name = inp(d.name), ns = inp(d.namespace, 'text', 'e.g. bronze_cdc — empty: <database>_<schema>'), cat = d.catalog || data.catalogs[0];
      var save = el('button', {class: 'primary', text: d.id ? 'Save & check' : 'Add & check'}), msg = el('div');
      on(save, 'click', function () {
        save.disabled = true;
        api('POST', '/api/cdc/destinations', {id: d.id, name: name.value, catalog: cat, namespace: ns.value})
          .then(function (r) { tab = 'destinations'; busy['d' + r.id] = 1; load(); watch(r.task, function () { delete busy['d' + r.id]; load(); }); })
          .catch(function (e) { save.disabled = false; msg.innerHTML = ''; msg.appendChild(note(e.message, 'bad')); });
      });
      return el('div', {class: 'card'}, [el('h3', {text: d.id ? 'Edit destination ' + d.name : 'New destination — one of your lakehouses'}),
        el('div', {class: 'form'}, [el('label', {text: 'Name'}), name,
          el('label', {text: 'Lakehouse'}), seg(data.catalogs.map(function (c) { return [c, c]; }), cat, function (v) { cat = v; }),
          el('label', {text: 'Namespace'}), ns]),
        el('div', {class: 'row'}, [save, on(el('button', {text: 'Cancel'}), 'click', function () { render(); })]), msg]);
    }

    // ---- jobs ----------------------------------------------------------------------------------
    function last(j) {
      var r = j.last;
      if (j.busy && !(r && r.status === 'running')) return el('span', {class: 'run', text: '… starting'});
      if (!r) return el('span', {class: 'muted', text: 'not run yet'});
      if (r.status === 'running') return el('span', {class: 'run', text: '… running since ' + when(r.started_at)});
      return el('span', {class: r.status === 'ok' ? 'ok' : 'bad', title: r.error || '',
        text: (r.status === 'ok' ? '✓ ' + (r.records === null ? '' : r.records + ' rows · ') : '✗ failed · ') + when(r.finished_at)});
    }
    function jobList() {
      if (!data.jobs.length) return el('div', {class: 'card'}, [el('div', {class: 'sub',
        text: data.sources.length ? 'No jobs yet — + New job copies tables from a source to a destination.' : 'Add a source first (Sources), then a job.'})]);
      var body = el('tbody');
      data.jobs.forEach(function (j) {
        var runNow = on(el('button', {class: 'small primary', text: 'Run now'}), 'click', function () {
          runNow.disabled = true;
          api('POST', '/api/cdc/jobs/run', {id: j.id}).then(function () { setTimeout(load, 1500); }).catch(function (e) { alert_(e.message); runNow.disabled = false; });
        });
        runNow.disabled = !!j.busy;
        var pause = on(el('button', {class: 'small', text: j.enabled ? 'Pause' : 'Resume'}), 'click', function () {
          api('POST', '/api/cdc/jobs/set', {id: j.id, enabled: !j.enabled}).then(load).catch(function (e) { alert_(e.message); });
        });
        pause.hidden = !j.schedule;
        var runsB = el('button', {class: 'small' + (openRuns[j.id] ? ' on' : ''), text: 'Runs'});
        var del = on(el('button', {class: 'small', text: 'Delete'}), 'click', function () {
          ask(del, 'Delete the job? (its tables stay in your lakehouse)', 'Yes, delete', function () {
            api('POST', '/api/cdc/jobs/delete', {id: j.id}).then(load).catch(function (e) { alert_(e.message); });
          });
        });
        var more = el('tr', {class: 'more'}, [el('td', {colspan: '7'})]);
        more.hidden = !openRuns[j.id];
        on(runsB, 'click', function () { openRuns[j.id] = !openRuns[j.id]; more.hidden = !openRuns[j.id]; runsB.classList.toggle('on'); if (openRuns[j.id]) showRuns(j, more.firstChild); });
        if (openRuns[j.id]) showRuns(j, more.firstChild);
        body.appendChild(el('tr', {}, [el('td', {}, [el('b', {text: j.name})]),
          el('td', {text: j.source_name + ' → ' + j.dest_name}), el('td', {title: j.tables.join(', '), text: j.tables.length === 1 ? j.tables[0] : j.tables.length + ' tables'}),
          el('td', {text: MODE[j.mode]}), el('td', {text: (SCHED[j.schedule] || j.schedule) + (j.schedule && !j.enabled ? ' (paused)' : '')}),
          el('td', {}, [last(j)]), el('td', {class: 'acts'}, [runNow, ' ', pause, ' ', runsB, ' ', del])]));
        body.appendChild(more);
      });
      return el('div', {class: 'card'}, [el('div', {class: 'wrap'}, [el('table', {class: 'lst'}, [el('thead', {}, [el('tr', {},
        ['Job', 'Source → destination', 'Tables', 'Mode', 'Schedule', 'Last run', ''].map(function (h) { return el('th', {text: h}); }))]), body])])]);
    }
    function showRuns(j, td) {
      td.innerHTML = ''; td.appendChild(note('Loading…'));
      api('GET', '/api/cdc/runs?job=' + j.id).then(function (d) {
        td.innerHTML = '';
        if (!d.runs.length) return td.appendChild(note('No runs yet.'));
        var logBox = el('div');
        td.appendChild(el('table', {}, [el('thead', {}, [el('tr', {}, ['Started', 'Took', 'Result', 'Rows', 'Why', ''].map(function (h) { return el('th', {text: h}); }))]),
          el('tbody', {}, d.runs.map(function (r) {
            var took = r.finished_at ? Math.max(1, Math.round((new Date(r.finished_at) - new Date(r.started_at)) / 1000)) + ' s' : '…';
            var lg = on(el('button', {class: 'small', text: 'Log'}), 'click', function () {
              api('GET', '/api/cdc/run?id=' + r.id).then(function (x) {
                logBox.innerHTML = ''; logBox.appendChild(el('pre', {class: 'log', text: (x.error ? 'Error: ' + x.error + '\n\n' : '') + (x.log || '(no log)')}));
              }).catch(function (e) { alert_(e.message); });
            });
            return el('tr', {}, [el('td', {class: 'muted', text: when(r.started_at)}), el('td', {class: 'muted', text: took}),
              el('td', {class: r.status === 'ok' ? 'ok' : r.status === 'running' ? 'run' : 'bad', title: r.error || '',
                        text: r.status === 'ok' ? '✓ ok' : r.status === 'running' ? '… running' : '✗ ' + (r.error || 'failed').slice(0, 100)}),
              el('td', {text: r.records === null ? '—' : String(r.records)}), el('td', {class: 'muted', text: r.trigger || ''}), el('td', {}, [lg])]);
          }))]));
        td.appendChild(logBox);
      }).catch(function (e) { td.innerHTML = ''; td.appendChild(note(e.message, 'bad')); });
    }
    function jobForm() {
      if (!data.sources.length) return el('div', {class: 'card'}, [note('Add a source first — Sources → + New source.')]);
      var name = inp(''), src = data.sources[0].id, dst = (data.destinations[0] || {}).id, mode = data.sources[0].cdc ? 'cdc' : 'full_refresh', sched = '';
      var pick = el('select', {}, data.sources.map(function (s) { var o = el('option', {value: s.id, text: s.name + (s.cdc ? ' (CDC)' : '')}); return o; }));
      var dpick = el('select', {}, data.destinations.map(function (d) { return el('option', {value: d.id, text: d.name + ' — ' + d.catalog + (d.namespace ? '.' + d.namespace : '')}); }));
      var list = el('div', {class: 'tables'}, [el('span', {class: 'muted', text: 'Press "List tables".'})]), disc = null, picked = {}, found = [], all = true;
      var which = seg([[true, 'All tables'], [false, 'Choose tables']], all, function (v) { all = v; showTables(); });
      var bulk = el('span', {class: 'row'}, [
        on(el('button', {type: 'button', class: 'small', text: 'Select all'}), 'click', function () { found.forEach(function (x) { picked[x.table] = true; }); showTables(); }),
        on(el('button', {type: 'button', class: 'small', text: 'None'}), 'click', function () { picked = {}; showTables(); })]);
      bulk.hidden = true;
      function showTables() {                           // All: every table listed · Choose: tick them
        bulk.hidden = all || !found.length;
        if (!found.length) return;
        list.innerHTML = '';
        found.forEach(function (x) {
          var cb = on(el('input', {type: 'checkbox'}), 'change', function () { picked[x.table] = cb.checked; });
          cb.checked = all || !!picked[x.table]; cb.disabled = all;
          list.appendChild(el('label', {}, [cb, el('span', {text: x.table}), el('span', {class: 'muted', text: '· ' + x.columns + ' columns'})]));
        });
      }
      var lt = el('button', {type: 'button', class: 'small', text: 'List tables'}), modeBox = el('span'), msg = el('div');
      function modes() {
        var s = data.sources.filter(function (x) { return x.id == src; })[0];
        if (!s.cdc) mode = 'full_refresh';
        modeBox.innerHTML = '';
        modeBox.appendChild(seg(s.cdc ? [['cdc', MODE.cdc], ['full_refresh', MODE.full_refresh]] : [['full_refresh', MODE.full_refresh]], mode, function (v) { mode = v; }));
      }
      on(pick, 'change', function () { src = pick.value; disc = null; picked = {}; found = []; bulk.hidden = true; list.innerHTML = ''; list.appendChild(el('span', {class: 'muted', text: 'Press "List tables".'})); modes(); });
      on(dpick, 'change', function () { dst = dpick.value; });
      on(lt, 'click', function () {
        lt.disabled = true; list.innerHTML = ''; list.appendChild(el('span', {class: 'run', text: '… reading the source\'s tables'}));
        api('POST', '/api/cdc/sources/tables', {id: src}).then(function (r) {
          watch(r.task, function (t) {
            lt.disabled = false; list.innerHTML = '';
            if (t.status !== 'done') return list.appendChild(el('span', {class: 'bad', text: '✗ ' + (t.error || 'failed')}));
            disc = t.id; found = t.result.tables;
            if (!found.length) return list.appendChild(el('span', {class: 'muted', text: 'No tables found.'}));
            showTables();
          });
        }).catch(function (e) { lt.disabled = false; list.innerHTML = ''; list.appendChild(el('span', {class: 'bad', text: e.message})); });
      });
      modes();
      var create = on(el('button', {class: 'primary', text: 'Create & run'}), 'click', function () {
        var tables = all ? found.map(function (x) { return x.table; }) : Object.keys(picked).filter(function (k) { return picked[k]; });
        create.disabled = true; msg.innerHTML = '';
        api('POST', '/api/cdc/jobs', {name: name.value, source: +src, destination: +dst, discover: disc, tables: tables, mode: mode, schedule: sched})
          .then(function () { tab = 'jobs'; load(); })
          .catch(function (e) { create.disabled = false; msg.appendChild(note(e.message, 'bad')); });
      });
      return el('div', {class: 'card'}, [el('h3', {text: 'New job — copy tables from a source to a destination'}),
        el('div', {class: 'form'}, [el('label', {text: 'Name'}), name, el('label', {text: 'Source'}), pick, el('label', {text: 'Destination'}), dpick,
          el('label', {text: 'Tables'}), el('div', {}, [which, el('div', {style: 'margin-top:6px'}, [list]), el('div', {class: 'row', style: 'margin-top:6px'}, [lt, bulk])]),
          el('label', {text: 'Mode'}), modeBox,
          el('label', {text: 'Schedule'}), seg(Object.keys(SCHED).map(function (k) { return [k, SCHED[k]]; }), sched, function (v) { sched = v; })]),
        el('div', {class: 'sub', text: 'Full load + CDC: the first run copies everything, later runs only the inserts, updates and deletes since the run before (deleted rows stay as _op_type = \'d\'). The first run starts as soon as you create the job.'}),
        el('div', {class: 'row', style: 'margin-top:10px'}, [create, on(el('button', {text: 'Cancel'}), 'click', function () { render(); })]), msg]);
    }
    function alert_(msg, ok) { main.insertBefore(el('div', {class: 'card result' + (ok ? '' : ' err')}, [el('div', {text: msg})]), main.children[1] || null); }

    load();
  </script>
