<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — Epireum's Data Engineering Lab</title>
  <link rel="stylesheet" href="/admin.css?v=9">
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=21"></script>
  <main id="main">
    <div class="placeholder">Loading…</div>
  </main>
  <script src="/admin.js?v=5"></script>
  <script>
    // ⚙️ Settings — lab-wide switches: self-registration on the sign-in page, and members' limits
    // (Jupyter idle time / memory / CPU, bucket sizes) — no restart: each applies as its note says —
    // and Services: which tools run (k8s: switch a unit off to free the server; local: make status) —
    // and Lab version: the release this lab runs, and whether a newer one is on GitHub.
    var el = admin.el;
    admin.page('Settings', 'Lab-wide switches — no restart needed.');
    var cfg = null;
    var tab = admin.tabs([['general', 'General'], ['services', 'Services'], ['version', 'Lab version']], function (t) { tab = t; render(); });
    function render() {
      if (!cfg) return;
      admin.fill(tab === 'services' ? [servicesCard(), flinkCard()] : tab === 'version' ? [versionCard()]
                 : [registrationCard(cfg.registration), limitsCard(cfg)]);
    }

    function registrationCard(on) {
      var sw = el('span', {class: 'switch', role: 'switch', tabindex: '0'},
                  [el('span', {class: 'track'}, [el('span', {class: 'knob'})]), el('b', {text: '…'})]);
      var label = sw.lastChild;
      function paint(on) {
        sw.className = 'switch' + (on ? ' on' : ''); sw.setAttribute('aria-checked', on ? 'true' : 'false');
        label.textContent = on ? 'On — the sign-in page shows Register' : 'Off — only managers create accounts';
      }
      function toggle() {
        if (sw.classList.contains('busy')) return;
        var want = !sw.classList.contains('on');
        sw.classList.add('busy');
        admin.api('POST', '/api/admin/settings', {registration: want})
          .then(function (r) { cfg = r; paint(r.registration); })
          .catch(function (e) { admin.show('Could not change self-registration', [e.message], null, true); })
          .then(function () { sw.classList.remove('busy'); });
      }
      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
      paint(on);
      return el('div', {class: 'card'}, [
        el('h3', {text: 'Self-registration'}),
        el('div', {class: 'row'}, [sw]),
        el('div', {class: 'sub', style: 'margin-top:8px',
          text: 'Turn it on while a new batch signs up, then off again. While it\'s on, anyone who can reach the sign-in page can create an account. New members start in no team (only their own lakehouse) — add them to one on 🧩 Teams.'})]);
    }

    var LIMITS = [
      ['idle_minutes', 'Jupyter stops when idle after', 'minutes', 1,
       'A member\'s Jupyter server stops after this long without activity (their files stay). Applies within a minute.'],
      ['jupyter_mem_gb', 'Jupyter memory', 'GB', 0.5, 'Per member. Applies when their server next starts.'],
      ['jupyter_cpu', 'Jupyter CPU', 'cores', 0.25, 'Per member. Applies when their server next starts.'],
      ['quota_mb', 'Member bucket size', 'MB', 10,
       'Each member\'s files and tables (<user>-lake). Applies to every member at once; a member already above it can only delete until they are under.'],
      ['team_quota_mb', 'Team bucket size', 'MB', 50, 'Each team\'s bucket (team-<team>-lake). Applies to every team at once.'],
      ['pubsub_streams', '📨 Pub/Sub streams', 'per member', 1, 'How many event streams a member may have. 0 = none.'],
      ['pubsub_rate', '📨 Pub/Sub rate', 'events / s', 1, 'The most events a second one stream may send. Streams already above it keep their rate.']];

    function limitsCard(r) {
      var inputs = {}, save = el('button', {class: 'primary', text: 'Save'});
      var rows = [];
      LIMITS.forEach(function (l) {
        var lim = r.limits[l[0]];
        var inp = el('input', {type: 'number', min: lim[0], max: lim[1], step: l[3], value: r[l[0]],
                               'aria-label': l[1]});
        inputs[l[0]] = inp;
        rows.push(el('label', {text: l[1], for: 'lim-' + l[0]}));
        inp.id = 'lim-' + l[0];
        rows.push(el('div', {class: 'row', style: 'flex-wrap:nowrap'}, [inp, el('span', {class: 'sub', text: l[2]})]));
        rows.push(el('div', {class: 'sub', text: l[4] + ' (' + lim[0] + '–' + lim[1] + ')'}));
      });
      save.addEventListener('click', function () {
        var body = {}, bad = [];
        LIMITS.forEach(function (l) {
          var v = Number(inputs[l[0]].value), lim = r.limits[l[0]];
          if (inputs[l[0]].value === '' || isNaN(v) || v < lim[0] || v > lim[1]) bad.push(l[1] + ': ' + lim[0] + '–' + lim[1]);
          else if (v !== r[l[0]]) body[l[0]] = v;
        });
        if (bad.length) return admin.show('Not saved — out of range', bad, null, true);
        if (!Object.keys(body).length) return admin.show('Nothing changed', ['Every value is already saved.']);
        save.disabled = true;
        admin.api('POST', '/api/admin/settings', body)
          .then(function (n) {
            Object.keys(body).forEach(function (k) { r[k] = n[k]; inputs[k].value = n[k]; });
            admin.show('Saved', Object.keys(body).map(function (k) {
              var l = LIMITS.filter(function (x) { return x[0] === k; })[0];
              return l[1] + ': ' + n[k] + ' ' + l[2];
            }));
          })
          .catch(function (e) { admin.show('Could not save the limits', [e.message], null, true); })
          .then(function () { save.disabled = false; });
      });
      return el('div', {class: 'card', style: 'margin-top:14px'}, [
        el('h3', {text: 'Members\' limits'}),
        el('div', {class: 'limits'}, rows),
        el('div', {class: 'row', style: 'margin-top:12px'}, [save])]);
    }

    var WORD = {on: '● on', off: '○ off', starting: '◐ starting…', stopping: '◐ stopping…', partly: '◐ partly on'};
    // ---- the Flink unit's size: TaskManagers × slots each = how many parallel copies a Beam job can run
    function flinkCard() {
      var card = el('div', {class: 'card', style: 'margin-top:14px'}, [el('h3', {text: 'Flink cluster'}), el('div', {class: 'sub', text: 'Loading…'})]);
      function opts(lo, hi, v) {
        var s = el('select', {});
        for (var i = lo; i <= hi; i++) s.appendChild(el('option', {value: i, text: String(i)}));
        s.value = String(v); return s;
      }
      function gb(mb) { return (Math.round(mb / 102.4) / 10) + ' GB'; }
      function draw(f) {
        var tms = opts(f.limits.flink_taskmanagers[0], f.limits.flink_taskmanagers[1], f.taskmanagers),
            slots = opts(f.limits.flink_slots[0], f.limits.flink_slots[1], f.slots),
            sum = el('div', {class: 'sub', style: 'margin-top:8px'}), save = el('button', {class: 'primary', text: 'Save'});
        function paint() {
          var t = +tms.value, sl = +slots.value, mb = 1280 + 256 * sl;
          sum.textContent = '= ' + t * sl + ' slots: a Beam job runs up to ' + t * sl + ' parallel copies of each step · ' +
            gb(mb) + ' per TaskManager, ' + gb(mb * t) + ' for all of them (+ about 1.5 GB for the JobManager and Beam\'s job server)';
          save.disabled = t === f.taskmanagers && sl === f.slots;
        }
        tms.addEventListener('change', paint); slots.addEventListener('change', paint); paint();
        save.addEventListener('click', function () {
          save.disabled = true;
          admin.api('POST', '/api/admin/flink', {taskmanagers: +tms.value, slots: +slots.value}).then(function (r) {
            admin.show('Saved: ' + r.taskmanagers + ' TaskManagers × ' + r.slots + ' slots', [r.control === 'local'
              ? 'Apply it in the terminal: make status → select Flink → s (when Flink is on: its TaskManagers restart with the new size, running jobs with them).'
              : r.applied ? 'Applied: the TaskManagers restart with the new size (running jobs with them).' : 'It applies the next time the Flink unit starts.']);
            draw(r);
          }).catch(function (e) { save.disabled = false; admin.show('Not saved', [e.message], null, true); });
        });
        var l = f.live;
        var now = l ? 'Now: ' + l.taskmanagers + ' TaskManager' + (l.taskmanagers === 1 ? '' : 's') + ' · ' + l['slots-total'] + ' slots (' +
                      l['slots-available'] + ' free) · ' + l['jobs-running'] + ' job' + (l['jobs-running'] === 1 ? '' : 's') + ' running'
                    : 'The Flink unit is off (Services, above) — the size applies when it starts.';
        var differs = l && (l.taskmanagers !== f.taskmanagers || l['slots-total'] !== f.total);
        card.replaceChildren(el('h3', {text: 'Flink cluster'}),
          el('div', {class: 'sub', text: 'Apache Beam jobs on the Flink unit (lab_beam("flink", parallelism=…)) run in its slots: each TaskManager is one container with its slots, ' +
            'each slot one parallel copy of a job\'s steps. More slots: more parallel work, and more memory.'}),
          el('div', {class: 'row', style: 'margin-top:12px; gap:10px; align-items:center'}, [
            el('label', {text: 'TaskManagers'}), tms, el('span', {text: '×'}), el('label', {text: 'slots each'}), slots, save]),
          sum,
          el('div', {class: 'sub', style: 'margin-top:8px' + (differs ? '; color:var(--bad-ink)' : ''),
            text: now + (differs ? ' — not the saved size yet' + (f.control === 'local' ? ': make status → Flink → s applies it' : '') : '')}));
      }
      admin.api('GET', '/api/admin/flink').then(draw).catch(function (e) {
        card.replaceChildren(el('h3', {text: 'Flink cluster'}), el('div', {class: 'sub', text: e.message}));
      });
      return card;
    }

    function servicesCard() {
      var card = el('div', {class: 'card', style: 'margin-top:14px'}, [el('h3', {text: 'Services'}),
                                                                      el('div', {class: 'sub', text: 'Loading…'})]);
      var timer = null;
      function load() {
        admin.api('GET', '/api/admin/services').then(paint)
          .catch(function (e) { card.lastChild.textContent = 'Could not load the services: ' + e.message; });
      }
      function change(u, on, sw) {
        sw.classList.add('busy');
        admin.api('POST', '/api/admin/services', {unit: u.unit, on: on})
          .then(function (r) {
            admin.show(r.changed.join(' + ') + (on ? ' turned on' : ' turned off'),
                       [on ? 'Starting takes a minute or two; the tiles on the home page light up by themselves.'
                           : 'Data is kept. Members see the tiles greyed: “Not running. Contact admin.”']);
            paint(r);
          })
          .catch(function (e) { admin.show('Could not change ' + u.unit, [e.message], null, true); sw.classList.remove('busy'); });
      }
      function paint(r) {
        var k8s = r.control === 'k8s', rows = [];
        rows.push(el('div', {class: 'svc'}, [el('b', {text: 'Core'}),
          el('span', {class: 'sub', text: 'sign-in, files, catalog, storage'}), el('span', {class: 'state on', text: '● always on'})]));
        r.units.forEach(function (u) {
          var on = u.state === 'on' || u.state === 'starting' || u.state === 'partly';
          var kids = [el('b', {text: u.unit}), el('span', {class: 'sub', text: u.workloads.join(' · ') +
                       (u.needs.length ? ' — needs ' + u.needs.join(', ') : '')}),
                      el('span', {class: 'state ' + u.state, text: WORD[u.state] || u.state})];
          if (k8s) {
            var sw = el('span', {class: 'switch' + (on ? ' on' : '') + (/ing$/.test(u.state) ? ' busy' : ''), role: 'switch',
                                 tabindex: '0', 'aria-checked': on ? 'true' : 'false', 'aria-label': u.unit},
                        [el('span', {class: 'track'}, [el('span', {class: 'knob'})])]);
            var flip = function () {
              if (sw.classList.contains('busy')) return;
              if (!on) return change(u, true, sw);
              var who = u.unit === 'Notebooks' && r.jupyter_servers.length
                ? ' ' + r.jupyter_servers.length + ' member(s) have Jupyter open (' + r.jupyter_servers.join(', ') + ') — it stops; their files stay.' : '';
              var dep = r.units.filter(function (x) { return x.needs.indexOf(u.unit) >= 0 && x.state !== 'off'; })
                               .map(function (x) { return x.unit; });
              var ask = el('div', {class: 'row confirm', style: 'margin:6px 0 4px'}, [
                el('span', {class: 'sub', text: 'Turn off ' + [u.unit].concat(dep).join(' + ') + '?' + who}),
                el('button', {class: 'small danger', text: 'Turn off', on: {click: function () { ask.remove(); change(u, false, sw); }}}),
                el('button', {class: 'small', text: 'Cancel', on: {click: function () { ask.remove(); }}})]);
              row.after(ask);
            };
            sw.addEventListener('click', flip);
            sw.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); } });
            kids.push(sw);
          }
          var row = el('div', {class: 'svc'}, kids);
          rows.push(row);
        });
        card.innerHTML = '';
        card.appendChild(el('h3', {text: 'Services'}));
        card.appendChild(el('div', {class: 'sub', style: 'margin-bottom:10px', text: k8s
          ? 'Turn off what the class isn\'t using yet, to free the server\'s memory and CPU. Turning a unit off keeps all data; members see its tiles greyed (“Not running. Contact admin.”). A lab update turns every unit back on.'
          : 'This lab runs on your machine: turn units on and off in the terminal — make status, then ↑ ↓ to a unit, s on, x off. This list shows what runs now.'}));
        rows.forEach(function (x) { card.appendChild(x); });
        clearTimeout(timer);
        if (r.units.some(function (u) { return /ing$/.test(u.state); })) timer = setTimeout(load, 4000);
      }
      load();
      return card;
    }
    function versionCard() {
      var card = el('div', {class: 'card', style: 'margin-top:14px'}, [el('h3', {text: 'Lab version'}),
                                                                      el('div', {class: 'sub', text: 'Loading…'})]);
      admin.api('GET', '/api/version').then(function (v) {
        var k8s = /(^|\.)de\.lan$/.test(location.hostname), state, note;
        if (!v.check) { state = el('span', {class: 'state off', text: 'not checked'});
          note = 'Checking GitHub for newer releases is off (LAB_UPDATE_CHECK=0).'; }
        else if (v.update) { state = el('span', {class: 'state partly', text: v.latest + ' available'});
          note = k8s ? 'Update the cluster: git pull, then deploy again.' : 'Update: git pull in the repo, then make up in local/.'; }
        else if (v.latest) { state = el('span', {class: 'state on', text: '✓ up to date'});
          note = 'Checked against GitHub at most once an hour.'; }
        else { state = el('span', {class: 'state off', text: 'couldn\'t check'});
          note = 'GitHub couldn\'t be reached; it\'s tried again within the hour.'; }
        var kids = [el('b', {text: v.current || 'unknown'}), el('span', {class: 'sub', text: note}), state];
        if (v.url) kids.push(el('a', {href: v.url, target: '_blank', rel: 'noopener', text: 'What\'s new'}));
        card.innerHTML = '';
        card.appendChild(el('h3', {text: 'Lab version'}));
        card.appendChild(el('div', {class: 'svc'}, kids));
      }).catch(function (e) { card.lastChild.textContent = 'Could not check the version: ' + e.message; });
      return card;
    }
    admin.api('GET', '/api/admin/settings')
      .then(function (r) { cfg = r; render(); })
      .catch(admin.failed);
  </script>
</body>
</html>
