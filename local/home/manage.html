<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage members — Epireum's Data Engineering Lab</title>
  <link rel="stylesheet" href="/admin.css?v=7">
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=11"></script>
  <main id="main">
    <div class="placeholder">Loading…</div>
  </main>
  <script src="/admin.js?v=4"></script>
  <script>
    // Members — tab Members: every lab account (search; Actions: new password, reset lakehouse,
    // wipe, delete). Tab Add a member: create an account. Teams are on Teams, self-registration on
    // Settings.
    var el = admin.el, me = null, data = null, filter = '';
    admin.page('Members', 'Lab accounts, their lakehouse and storage.');
    var tab = admin.tabs([['members', 'Members'], ['add', 'Add a member']], function (t) { tab = t; render(); });

    function addCard(teams) {
      var u = el('input', {type: 'text', placeholder: 'username (a-z, 0-9, -)', autocomplete: 'off'});
      var p = el('input', {type: 'password', placeholder: 'password (optional — random)', autocomplete: 'new-password'});
      var tm = el('select');
      tm.appendChild(el('option', {value: '', text: 'no team'}));
      teams.forEach(function (t) { tm.appendChild(el('option', {value: t.team, text: t.team})); });
      var b = el('button', {class: 'primary', text: 'Create member'});
      b.addEventListener('click', function () {
        var user = u.value.trim().toLowerCase();
        if (!user) return u.focus();
        admin.act(b, 'create', {user: user, password: p.value || undefined, team: tm.value || undefined}, 'Created ' + user, function (r) {
          return [['Lakehouse ' + r.lakehouse + ', bucket ' + r.bucket + ', SQLPad user' + (r.team ? ', team ' + r.team : '') + ' — ready to sign in.'], r.password];
        }, load);
      });
      function field(label, input) { return el('label', {style: 'display:flex; flex-direction:column; gap:5px; font-size:.84rem; color:var(--muted)'}, [label, input]); }
      u.style.width = p.style.width = '100%';
      return el('div', {class: 'card', style: 'max-width:640px'}, [
        el('h3', {text: 'New lab account'}),
        el('div', {style: 'display:grid; grid-template-columns:1fr 1fr; gap:12px'}, [field('Username', u), field('Password', p), field('Team', tm)]),
        el('div', {class: 'row', style: 'margin-top:14px'}, [b]),
        el('div', {class: 'sub', style: 'margin-top:10px',
          text: 'Creates the account with its own lakehouse, bucket and SQLPad user, in the team you pick (or none). Without a password a random one is shown once. Members can also register themselves on the sign-in page (Settings).'})]);
    }

    // ---- the members table --------------------------------------------------------------
    var ACTIONS = {
      password: {label: 'New password', title: 'New password for ', danger: false,
        describe: function (r) { return [['Signs in with this once, then picks their own.'], r.password]; }},
      reset: {label: 'Reset lakehouse', title: 'Lakehouse reset for ', danger: true,
        warn: 'Drops every table and view in their catalogs. Files, catalogs and shares stay.',
        describe: function (r) { return [[r.dropped + ' table(s)/view(s) dropped in ' + r.catalogs.join(', ') +
          '. bronze / silver / gold and the sample table are back.']]; }},
      wipe: {label: 'Wipe', title: 'Wiped ', danger: true,
        warn: 'Back to a new member\'s setup: every table dropped, extra catalogs deleted, the shares they gave revoked, bucket emptied, Jupyter reset. Their lakehouse, starter files and sample table come back; the account stays.',
        describe: function (r) { return [[r.dropped + ' table(s)/view(s) dropped, ' +
          r.catalogs_removed.length + ' extra catalog(s) deleted, ' + r.shares_revoked + ' share(s) revoked, ' +
          r.files_removed + ' file(s) removed' + (r.jupyter_reset ? ', Jupyter reset' : ' (Jupyter could not be reset)') +
          '. Back to the default setup.']]; }},
      'delete': {label: 'Delete', title: 'Deleted ', danger: true,
        warn: 'Removes the account, its catalogs, tables, bucket and Jupyter files. This cannot be undone.',
        describe: function (r) { return [['Account, ' + r.catalogs.length + ' catalog(s) and bucket ' + r.bucket + ' removed.']]; }}
    };

    function confirmRow(tr, l, key) {
      var a = ACTIONS[key];
      var old = tr.nextSibling && tr.nextSibling.classList && tr.nextSibling.classList.contains('confirm') ? tr.nextSibling : null;
      if (old) old.remove();
      var input = el('input', {type: 'text', placeholder: 'type ' + l.user + ' to confirm', autocomplete: 'off'});
      var go = el('button', {class: 'danger', text: a.label});
      var row = el('tr', {class: 'confirm'}, [el('td', {colspan: '7'}, [
        el('div', {class: 'sub', style: 'margin-bottom:8px', text: a.label + ' ' + l.user + ': ' + a.warn}),
        el('div', {class: 'row'}, [input, go, el('button', {class: 'small', text: 'Cancel', on: {click: function () { row.remove(); }}})])])]);
      go.addEventListener('click', function () {
        if (input.value.trim() !== l.user) return input.focus();
        admin.act(go, key, {user: l.user}, a.title + l.user, a.describe, load);
      });
      tr.parentNode.insertBefore(row, tr.nextSibling);
      input.focus();
    }

    function table(list) {
      var body = el('tbody');
      list.forEach(function (l) {
        var self = l.user === me;
        var items = Object.keys(ACTIONS).filter(function (key) {
          if (self && key !== 'password') return false;                      // not on your own account
          if (l.manager && (key === 'wipe' || key === 'delete')) return false; // managers: via Keycloak
          return !(!l.lakehouse && (key === 'reset' || key === 'wipe'));
        }).map(function (key) {
          var a = ACTIONS[key];
          return {label: a.label, danger: a.danger, click: function (b) {
            if (a.danger) return confirmRow(tr, l, key);
            admin.act(b, key, {user: l.user}, a.title + l.user, a.describe, load);
          }};
        });
        var acts = el('td', {class: 'acts'}, [admin.menu('Actions', items)]);
        var who = el('td', {}, [el('b', {text: l.user}),
          l.manager ? el('span', {class: 'tag mgr', text: 'manager'}) : null,
          self ? el('span', {class: 'tag', text: 'you'}) : null,
          l.enabled ? null : el('span', {class: 'tag', text: 'disabled'})]);
        var tr = el('tr', {}, [who,
          el('td', {}, [l.team ? el('a', {href: '/teams.html', text: l.team, style: 'color:var(--accent2)'}) : el('span', {class: 'muted', text: '—'})]),
          el('td', {}, [l.lakehouse ? el('code', {text: l.lakehouse}) : el('span', {class: 'muted', text: 'not signed in yet'})]),
          el('td', {class: 'r', text: String(l.catalogs.length)}),
          el('td', {class: 'r', text: l.bucket_mb == null ? '—' : l.bucket_mb + ' MB'}),
          el('td', {class: 'r muted', text: l.created ? new Date(l.created).toLocaleDateString() : ''}),
          acts]);
        tr.dataset.user = l.user + ' ' + (l.team || '');
        body.appendChild(tr);
      });
      var q = el('input', {type: 'search', placeholder: 'Search members…', style: 'width:240px'});
      q.value = filter;
      q.addEventListener('input', function () {
        filter = q.value.trim().toLowerCase();
        body.querySelectorAll('tr').forEach(function (tr) {
          tr.hidden = !!filter && (tr.dataset.user || '').indexOf(filter) < 0;
        });
      });
      body.querySelectorAll('tr').forEach(function (tr) { tr.hidden = !!filter && (tr.dataset.user || '').indexOf(filter) < 0; });
      return el('div', {class: 'card'}, [
        el('div', {class: 'bar'}, [el('h3', {style: 'margin:0', text: list.length + ' lab accounts'}), q]),
        el('div', {class: 'wrap'}, [el('table', {}, [el('thead', {}, [el('tr', {}, [
          el('th', {text: 'Account'}), el('th', {text: 'Team'}), el('th', {text: 'Lakehouse'}), el('th', {class: 'r', text: 'Catalogs'}),
          el('th', {class: 'r', text: 'Bucket'}), el('th', {class: 'r', text: 'Since'}), el('th', {text: ''})])]), body])]),
        el('div', {class: 'sub', style: 'margin-top:8px', text: 'Add members to a team, move or remove them on Teams.'})]);
    }

    function load() {
      return Promise.all([admin.api('GET', '/api/admin/members'), admin.api('GET', '/api/admin/teams')]).then(function (r) {
        me = r[0].me;
        data = r;
        render();
      }).catch(admin.failed);
    }
    function render() {
      if (data) admin.fill([tab === 'add' ? addCard(data[1].teams) : table(data[0].members)]);
    }
    load();
  </script>
</body>
</html>
