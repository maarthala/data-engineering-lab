<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage members — Epireum's Data Engineering Lab</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#141b2e; --panel2:#1b2438; --line:#2a3550;
      --ink:#e8edf7; --muted:#9aa8c7; --accent:#6d8bff; --accent2:#39d0c4; --danger:#ff6b6b; --gold:#e2b93b;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{margin:0; color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:radial-gradient(1200px 600px at 80% -10%, rgba(109,139,255,.18), transparent 60%),
                 radial-gradient(900px 500px at -10% 10%, rgba(57,208,196,.12), transparent 55%), var(--bg)}
    button{font:inherit; cursor:pointer; border-radius:9px; padding:6px 12px; border:1px solid var(--line); background:var(--panel2); color:var(--ink)}
    button:hover{border-color:var(--accent)}
    button:disabled{opacity:.5; cursor:wait}
    button.primary{border:0; font-weight:700; color:#0b1020; background:linear-gradient(135deg,var(--accent),var(--accent2))}
    button.small{padding:3px 9px; font-size:.82rem}
    button.danger{border-color:rgba(255,107,107,.55); color:#ffb3b0}
    input[type=text], input[type=password]{font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 9px; outline:none}
    input:focus{border-color:var(--accent)}
    code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--accent2)}
    .pagebar{padding:10px 28px; border-bottom:1px solid var(--line); background:rgba(20,27,46,.45)}
    .pagebar h1{margin:0; font-size:1.1rem; font-weight:800} .pagebar h1 .dot{color:var(--accent)}
    main{padding:18px 28px; display:flex; flex-direction:column; gap:14px}
    .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px}
    .card h3{margin:0 0 10px; font-size:.95rem; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em}
    .sub{color:var(--muted); font-size:.88rem}
    .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
    .wrap{overflow-x:auto}
    table{width:100%; border-collapse:collapse}
    td,th{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; font-size:.92rem; vertical-align:middle}
    th{color:var(--muted); font-size:.75rem; text-transform:uppercase; letter-spacing:.05em}
    tr:last-child td{border-bottom:0}
    td.r{text-align:right; white-space:nowrap}
    td.acts{white-space:nowrap}
    .tag{font-size:.7rem; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); margin-left:6px}
    .tag.mgr{border-color:rgba(226,185,59,.55); color:#f3d98b}
    .muted{color:var(--muted)}
    .confirm td{background:rgba(255,107,107,.07)}
    .result{border-color:rgba(57,208,196,.5)}
    .result.err{border-color:var(--danger)}
    .secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:1.05rem; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 10px}
    .placeholder{color:var(--muted); padding:40px; text-align:center}
    .switch{display:inline-flex; align-items:center; gap:10px; cursor:pointer; user-select:none}
    .switch .track{width:44px; height:24px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); position:relative; transition:.15s}
    .switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--muted); transition:.15s}
    .switch.on .track{background:rgba(57,208,196,.35); border-color:var(--accent2)}
    .switch.on .knob{left:22px; background:var(--accent2)}
    .switch.busy{opacity:.5; cursor:wait}
  </style>
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=5"></script>
  <div class="pagebar"><h1>👥 Manage members <span class="dot">·</span> managers only</h1></div>
  <main id="main">
    <div class="placeholder" id="loading">Loading…</div>
  </main>

  <script>
    // Everything goes through /api/admin (home-api, behind the Keycloak login; managers only).
    // Actions run in the background — the page polls until they finish.
    var main = document.getElementById('main');
    var me = null, busy = false;

    function el(tag, attrs, kids) {
      var e = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === 'text') e.textContent = attrs[k];
        else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); });
        else e.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }

    function api(method, path, body) {
      return fetch(path, {method: method, credentials: 'same-origin',
          headers: body ? {'Content-Type': 'application/json', 'X-Lab-Admin': '1'} : {},
          body: body ? JSON.stringify(body) : undefined})
        .then(function (r) { return r.json().then(function (j) {
          if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
    }

    // start an action, then poll its job until done
    function run(action, body) {
      return api('POST', '/api/admin/' + action, body).then(function (j) {
        return new Promise(function (resolve, reject) {
          (function poll() {
            api('GET', '/api/admin/jobs?id=' + j.job).then(function (s) {
              if (s.state === 'running') return setTimeout(poll, 1500);
              if (s.state === 'done') resolve(s.result); else reject(new Error(s.error));
            }).catch(reject);
          })();
        });
      });
    }

    // ---- the result card (top of the page) ----------------------------------------------
    var result = el('div', {class: 'card result', hidden: ''});
    function show(title, lines, password, err) {
      result.className = 'card result' + (err ? ' err' : '');
      result.innerHTML = '';
      result.appendChild(el('h3', {text: title}));
      lines.forEach(function (l) { result.appendChild(el('div', {class: 'sub', text: l})); });
      if (password) {
        var box = el('span', {class: 'secret', text: password});
        var copy = el('button', {class: 'small', text: 'Copy', on: {click: function () {
          navigator.clipboard.writeText(password).then(function () { copy.textContent = 'Copied ✓'; });
        }}});
        result.appendChild(el('div', {class: 'row', style: 'margin-top:10px'}, [box, copy]));
        result.appendChild(el('div', {class: 'sub', style: 'margin-top:8px',
          text: 'Shown once — pass it on to the member. They choose their own password at the next sign-in.'}));
      }
      result.hidden = false;
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // ---- settings: self-registration ----------------------------------------------------
    function settingsCard() {
      var sw = el('span', {class: 'switch', role: 'switch', tabindex: '0'},
                  [el('span', {class: 'track'}, [el('span', {class: 'knob'})]), el('b', {text: '…'})]);
      var label = sw.lastChild;
      function paint(on) {
        sw.className = 'switch' + (on ? ' on' : ''); sw.setAttribute('aria-checked', on ? 'true' : 'false');
        label.textContent = on ? 'On — the sign-in page shows Register' : 'Off — only managers create accounts';
      }
      function toggle() {
        if (sw.classList.contains('busy')) return;
        var want = !sw.classList.contains('on');
        sw.classList.add('busy');
        api('POST', '/api/admin/settings', {registration: want})
          .then(function (r) { paint(r.registration); })
          .catch(function (e) { show('Could not change self-registration', [e.message], null, true); })
          .then(function () { sw.classList.remove('busy'); });
      }
      sw.addEventListener('click', toggle);
      sw.addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggle(); } });
      api('GET', '/api/admin/settings').then(function (r) { paint(r.registration); })
        .catch(function () { label.textContent = 'could not read the setting'; });
      return el('div', {class: 'card'}, [
        el('h3', {text: 'Self-registration'}),
        el('div', {class: 'row'}, [sw]),
        el('div', {class: 'sub', style: 'margin-top:8px',
          text: 'Turn it on while a new batch signs up, then off again. While it\'s on, anyone who can reach the sign-in page can create an account.'})]);
    }

    // ---- add a member -------------------------------------------------------------------
    function addCard() {
      var u = el('input', {type: 'text', placeholder: 'username (a-z, 0-9, -)', autocomplete: 'off'});
      var p = el('input', {type: 'password', placeholder: 'password (optional — random)', autocomplete: 'new-password'});
      var b = el('button', {class: 'primary', text: 'Create member'});
      b.addEventListener('click', function () {
        var user = u.value.trim().toLowerCase();
        if (!user) return u.focus();
        act(b, 'create', {user: user, password: p.value || undefined}, 'Created ' + user, function (r) {
          u.value = ''; p.value = '';
          return [['Lakehouse ' + r.lakehouse + ', bucket ' + r.bucket + ', SQLPad user — ready to sign in.'], r.password];
        });
      });
      return el('div', {class: 'card'}, [
        el('h3', {text: 'Add a member'}),
        el('div', {class: 'row'}, [u, p, b]),
        el('div', {class: 'sub', style: 'margin-top:8px',
          text: 'Creates the lab account with its own lakehouse, bucket and SQLPad user. Members can also register themselves on the sign-in page.'})]);
    }

    // run an action from a button; `describe(result)` → [lines, password]
    function act(btn, action, body, title, describe) {
      if (busy) return;
      busy = true;
      var label = btn.textContent;
      document.querySelectorAll('main button').forEach(function (x) { x.disabled = true; });
      btn.textContent = 'Working…';
      run(action, body).then(function (r) {
        var d = describe(r); show(title, d[0], d[1]);
      }).catch(function (e) {
        show('Could not ' + action + ' ' + (body.user || ''), [e.message], null, true);
      }).then(function () {
        busy = false; btn.textContent = label; load();
      });
    }

    // ---- the members table --------------------------------------------------------------
    var ACTIONS = {
      password: {label: 'New password', title: 'New password for ', danger: false,
        describe: function (r) { return [['Signs in with this once, then picks their own.'], r.password]; }},
      reset: {label: 'Reset lakehouse', title: 'Lakehouse reset for ', danger: true,
        warn: 'Drops every table and view in their catalogs. Files, catalogs and shares stay.',
        describe: function (r) { return [[r.dropped + ' table(s)/view(s) dropped in ' + r.catalogs.join(', ') +
          '. bronze / silver / gold and the sample table are back.']]; }},
      wipe: {label: 'Wipe', title: 'Wiped ', danger: true,
        warn: 'Back to a new member\'s setup: every table dropped, extra catalogs deleted, the shares they gave revoked, bucket emptied, Jupyter reset. Their lakehouse, starter files and sample table come back; the account stays.',
        describe: function (r) { return [[r.dropped + ' table(s)/view(s) dropped, ' +
          r.catalogs_removed.length + ' extra catalog(s) deleted, ' + r.shares_revoked + ' share(s) revoked, ' +
          r.files_removed + ' file(s) removed' + (r.jupyter_reset ? ', Jupyter reset' : ' (Jupyter could not be reset)') +
          '. Back to the default setup.']]; }},
      'delete': {label: 'Delete', title: 'Deleted ', danger: true,
        warn: 'Removes the account, its catalogs, tables, bucket and Jupyter files. This cannot be undone.',
        describe: function (r) { return [['Account, ' + r.catalogs.length + ' catalog(s) and bucket ' + r.bucket + ' removed.']]; }}
    };

    function confirmRow(tr, l, key) {
      var a = ACTIONS[key];
      var old = tr.nextSibling && tr.nextSibling.classList && tr.nextSibling.classList.contains('confirm') ? tr.nextSibling : null;
      if (old) old.remove();
      var input = el('input', {type: 'text', placeholder: 'type ' + l.user + ' to confirm', autocomplete: 'off'});
      var go = el('button', {class: 'danger', text: a.label});
      var row = el('tr', {class: 'confirm'}, [el('td', {colspan: '6'}, [
        el('div', {class: 'sub', style: 'margin-bottom:8px', text: a.label + ' ' + l.user + ': ' + a.warn}),
        el('div', {class: 'row'}, [input, go, el('button', {class: 'small', text: 'Cancel', on: {click: function () { row.remove(); }}})])])]);
      go.addEventListener('click', function () {
        if (input.value.trim() !== l.user) return input.focus();
        act(go, key, {user: l.user}, a.title + l.user, a.describe);
      });
      tr.parentNode.insertBefore(row, tr.nextSibling);
      input.focus();
    }

    function table(list) {
      var body = el('tbody');
      list.forEach(function (l) {
        var self = l.user === me;
        var acts = el('td', {class: 'acts'});
        Object.keys(ACTIONS).forEach(function (key) {
          var a = ACTIONS[key];
          if (self && key !== 'password') return;                      // not on your own account
          if (l.manager && (key === 'wipe' || key === 'delete')) return; // managers: via Keycloak
          if (!l.lakehouse && (key === 'reset' || key === 'wipe')) return;
          var b = el('button', {class: 'small' + (a.danger ? ' danger' : ''), text: a.label, style: 'margin-right:6px'});
          b.addEventListener('click', function () {
            if (a.danger) return confirmRow(tr, l, key);
            act(b, key, {user: l.user}, a.title + l.user, a.describe);
          });
          acts.appendChild(b);
        });
        var who = el('td', {}, [el('b', {text: l.user}),
          l.manager ? el('span', {class: 'tag mgr', text: 'manager'}) : null,
          self ? el('span', {class: 'tag', text: 'you'}) : null,
          l.enabled ? null : el('span', {class: 'tag', text: 'disabled'})]);
        var tr = el('tr', {}, [who,
          el('td', {}, [l.lakehouse ? el('code', {text: l.lakehouse}) : el('span', {class: 'muted', text: 'not signed in yet'})]),
          el('td', {class: 'r', text: String(l.catalogs.length)}),
          el('td', {class: 'r', text: l.bucket_mb == null ? '—' : l.bucket_mb + ' MB'}),
          el('td', {class: 'r muted', text: l.created ? new Date(l.created).toLocaleDateString() : ''}),
          acts]);
        body.appendChild(tr);
      });
      return el('div', {class: 'card'}, [
        el('h3', {text: 'Lab accounts (' + list.length + ')'}),
        el('div', {class: 'wrap'}, [el('table', {}, [el('thead', {}, [el('tr', {}, [
          el('th', {text: 'Account'}), el('th', {text: 'Lakehouse'}), el('th', {class: 'r', text: 'Catalogs'}),
          el('th', {class: 'r', text: 'Bucket'}), el('th', {class: 'r', text: 'Since'}), el('th', {text: ''})])]), body])])]);
    }

    var listCard = null;
    function load() {
      return api('GET', '/api/admin/members').then(function (j) {
        me = j.me;
        if (!listCard) {
          main.innerHTML = '';
          main.appendChild(result);
          main.appendChild(settingsCard());
          main.appendChild(addCard());
        }
        var fresh = table(j.members);
        if (listCard) main.replaceChild(fresh, listCard); else main.appendChild(fresh);
        listCard = fresh;
      }).catch(function (e) {
        if (listCard) return show('Could not refresh the list', [e.message], null, true);
        main.innerHTML = '';
        main.appendChild(el('div', {class: 'placeholder', text: e.message === 'managers only'
          ? 'This page is for lab managers (Keycloak group “managers”).' : 'Could not load: ' + e.message}));
      });
    }
    load();
  </script>
</body>
</html>
