
services:
  # Object storage — S3-compatible, reached by every client as http://storage:9000 with the
  # root keys admin / admin123. The implementation is RustFS (Apache-2.0); the generic service
  # name means it can be swapped for another S3 store (or AWS S3) without touching clients.
  # Console: http://storage.lab.localhost:8000/rustfs/console/ — "Login with Epireum lab account"
  # (Keycloak, client `storage`; the username is the `policy` claim → each learner's own
  # policy = only <username>-lake, created by home-api/JupyterHub with a hard quota).
  storage:
    container_name: storage
    image: rustfs/rustfs:1.0.0
    restart: always
    depends_on:              # loads the console sign-in from Keycloak once, at start-up
      keycloak:
        condition: service_healthy
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: admin123
      # SSO for the console. RustFS refuses outbound calls to private hosts unless allowed;
      # discovery goes to the internal Keycloak, tokens carry the PUBLIC issuer.
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: http://keycloak:8080
      RUSTFS_IDENTITY_OPENID_ENABLE: "on"
      RUSTFS_IDENTITY_OPENID_CONFIG_URL: http://keycloak:8080/realms/de-lab/.well-known/openid-configuration
      RUSTFS_IDENTITY_OPENID_ISSUER: http://auth.lab.localhost:8000/realms/de-lab
      RUSTFS_IDENTITY_OPENID_CLIENT_ID: storage
      RUSTFS_IDENTITY_OPENID_CLIENT_SECRET: storage-secret
      RUSTFS_IDENTITY_OPENID_CLAIM_NAME: policy
      RUSTFS_IDENTITY_OPENID_SCOPES: openid,profile
      RUSTFS_IDENTITY_OPENID_DISPLAY_NAME: Epireum lab account
      RUSTFS_BROWSER_REDIRECT_URL: http://storage.lab.localhost:8000
      # Quotas fail closed until the usage scanner has counted a bucket, so a brand-new
      # learner bucket refuses uploads until the first scan. Lab data is tiny: scan every 10s.
      RUSTFS_SCANNER_CYCLE: "10"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      sparknet:
        aliases: [storage]

  # One-shot: waits for the object store, then creates the shared demo bucket.
  storage-init:
    container_name: storage-init
    image: ghcr.io/maarthala/de-stack/mc:RELEASE.2025-08-13T08-35-41Z   # S3 admin client (mc)
    depends_on:
      - storage
    entrypoint: ["/bin/sh", "/init_scripts/setup.sh"]
    volumes:
      - ./code:/code
      - ./init_scripts/storage:/init_scripts
    restart: "no"
    networks:
      - sparknet

volumes:
  storage-data:
