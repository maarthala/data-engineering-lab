services:
  # 📡 Data sync (CDC) — members copy tables from their own database into their lakehouse (full load,
  # then inserts / updates / deletes). The portal page (cdc.html) and home-api keep the sources,
  # destinations and jobs; this runner does the work: each check, table list and sync is one OLake
  # engine container (olakego/source-postgres, -mysql, -mssql) on the stack's network, started through the Docker
  # socket — a single-machine test stack, like Airflow running member tasks here.
  cdc-runner:
    build:
      context: ../common/dockerfiles
      dockerfile: Dockerfile.cdc-runner
    container_name: cdc-runner
    user: root                                   # the Docker socket
    environment:
      PORTAL_DB_URL: postgresql://portal:portal@postgres:5432/portal
      POLARIS_URL: http://polaris:8181
      LAKE_S3_ENDPOINT: http://storage:9000
      AWS_ACCESS_KEY_ID: admin                   # mints a member's own storage key (lab_jobs)
      AWS_SECRET_ACCESS_KEY: admin123
      VAULT_ADDR: http://vault:8200
      VAULT_ADMIN_TOKEN: ${VAULT_ADMIN_TOKEN:-lab-vault-admin-local-token}
      CDC_VERSION: v1.1.1                        # OLake engine images olakego/source-<kind>
      CDC_NETWORK: ${COMPOSE_PROJECT_NAME:-local}_sparknet
      CDC_MEM_GB: "1.5"
      CDC_WORKERS: "2"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # lab code mounted over the image's copies — edits need only a restart
      - ../common/dockerfiles/add/lakehouse.py:/app/lakehouse.py:ro
      - ../common/dockerfiles/add/labvault.py:/app/labvault.py:ro
      - ../common/dockerfiles/add/lab_jobs.py:/app/lab_jobs.py:ro
      - ../common/dockerfiles/add/labcdc.py:/app/labcdc.py:ro
      - ../common/dockerfiles/add/cdc_runner.py:/app/cdc_runner.py:ro
    depends_on:
      portal-db:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - sparknet

  # lab-db — the members' PostgreSQL server, apart from the platform's own (postgres: Keycloak,
  # Polaris, the portal…), so members' load, logins and replication slots never touch it:
  #  · one company's three live systems for practising CDC — shop (web shop), store (tills), loyalty
  #    (loyalty card); login reader / reader (SELECT + REPLICATION, never writes); kept changing by cdc-sim
  #  · the course's sample databases ShopFlow and AdventureWorks (login learner / learner, read only)
  #  · members' own databases from 🐘 My databases (<member>_<name>, owned by a login per member)
  # wal_level = logical for CDC; a forgotten slot holds at most max_slot_wal_keep_size of change log.
  lab-db:
    image: postgres:18
    container_name: lab-db
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=100", "-c", "max_wal_senders=100",
              "-c", "max_slot_wal_keep_size=1GB", "-c", "wal_sender_timeout=0"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lab-db-local-owner          # the owner: cdc-sim, simulate_day, My databases — members never
      POSTGRES_DB: shop
    volumes:
      - lab-db-data:/var/lib/postgresql
      # first start only: ShopFlow + AdventureWorks (read only for members, login learner)
      - ./init_scripts/lab-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d shop"]   # TCP: not ready while init scripts run
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - sparknet

  # Keeps shop, store and loyalty changing at random intervals: orders, sales, returns, points, prices…
  cdc-sim:
    build:
      context: ../common/dockerfiles
      dockerfile: Dockerfile.cdc-runner
    container_name: cdc-sim
    command: ["python", "/app/cdc_simulator.py"]
    environment:
      CDC_DB_URL: postgresql://postgres:lab-db-local-owner@lab-db:5432/shop
      CDC_READER: reader:reader
      CDC_SIM_MIN_S: "2"
      CDC_SIM_MAX_S: "10"
    volumes:
      - ../common/dockerfiles/add/cdc_simulator.py:/app/cdc_simulator.py:ro
    depends_on:
      lab-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sparknet

volumes:
  lab-db-data:
