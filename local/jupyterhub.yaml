# JupyterHub — every learner signs in with Keycloak and gets their OWN Jupyter container
# (image built by jupyter.yaml) whose `iceberg` catalog is their own Polaris lakehouse.
# The Hub starts learner containers through the Docker socket on the sparknet network.
services:
  jupyterhub:
    build:
      context: ../common/dockerfiles
      dockerfile: Dockerfile.jupyterhub
    container_name: jupyterhub
    ports:
      - "8008:8000"          # same URL learners used before: http://localhost:8008
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jupyterhub-data:/srv/jupyterhub/data
      # lab code mounted over the image's copies (as on Kubernetes) — edits need only a restart
      - ../common/dockerfiles/add/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro
      - ../common/dockerfiles/add/lakehouse.py:/srv/jupyterhub/lakehouse.py:ro
      - ../common/dockerfiles/add/labvault.py:/srv/jupyterhub/labvault.py:ro
      - ../common/dockerfiles/add/lab_culler.py:/srv/jupyterhub/lab_culler.py:ro
    environment:
      HUB_PUBLIC_URL: http://localhost:8008
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      OAUTH_CLIENT_SECRET: jupyterhub-secret
      # encrypts the stored Keycloak tokens (auth_state) — lets the Hub re-check the login
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY:-6874424c5eb55dec01d4ee3e6089a7b287602717fc11c0dfaa2524b2d7d88877}
      POLARIS_URL: http://polaris:8181
      HUB_ADMIN_TOKEN: lab-admin-local-hub-token   # home-api's "Manage members" (lab only; k8s: private secret)
      # each member's server gets its own vault token (key_vault) — minted with this one
      VAULT_ADDR: http://vault:8200
      VAULT_ADMIN_TOKEN: ${VAULT_ADMIN_TOKEN:-lab-vault-admin-local-token}
      LEARNER_QUOTA_MB: "100"      # each learner's bucket <user>-lake (hard limit)
      SINGLEUSER_IMAGE: local-jupyter:latest
      DOCKER_NETWORK: local_sparknet
      SPARK_REMOTE: sc://spark-connect:15002
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin123
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://storage:9000
      GIT_AUTOPUSH: ${GIT_AUTOPUSH:-1}
      GIT_REPO_URL: ${GIT_REPO_URL:-https://github.com/dev-epireum-com/de-lab.git}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      GIT_USERNAME: ${GIT_USERNAME:-x-access-token}
      GIT_TOKEN: ${GIT_TOKEN:-}
    depends_on:
      keycloak:
        condition: service_healthy
      polaris:
        condition: service_started
      jupyter:
        condition: service_started   # builds the learner image (local-jupyter)
    restart: unless-stopped
    networks:
      - sparknet

volumes:
  jupyterhub-data:
