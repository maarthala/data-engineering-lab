# The local stack's only open port (8000): every web app by its name, like the k8s ingress does
# with *.de.lan — http://lab.localhost:8000 is the portal, http://<app>.lab.localhost:8000 the apps.
# Browsers resolve *.localhost to this machine; inside the Docker network these names are aliases of
# this container (keycloak.yaml), so the apps reach each other — and Keycloak — at the same URLs.
# Upstreams are looked up per request, so a stopped unit doesn't keep the gateway from starting.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# host → upstream (container:port)
map $host $app {
    lab.localhost                  oauth2-proxy:4180;
    auth.lab.localhost             keycloak:8080;
    jupyter.lab.localhost          jupyterhub:8000;
    airflow.lab.localhost          airflow-apiserver:8080;
    superset.lab.localhost         superset:8088;
    sqlpad.lab.localhost           sqlpad:3000;
    spark.lab.localhost            spark-master:8080;
    storage.lab.localhost          storage:9001;
    polaris-console.lab.localhost  polaris-proxy:8189;
    polaris.lab.localhost          polaris:8181;
    vault.lab.localhost            vault:8200;
    trino.lab.localhost            trino:8080;
    default                        "";
}

server {
    listen 8000 default_server;
    server_name _;
    client_max_body_size 1g;                       # My files uploads, notebooks …
    large_client_header_buffers 8 32k;             # sign-in cookies
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;

    # the old address (and anything unknown) → the portal
    if ($app = "") { return 301 http://lab.localhost:8000$request_uri; }

    location / {
        proxy_pass http://$app;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8000;
        proxy_set_header Upgrade $http_upgrade;     # Jupyter kernels, Superset, Airflow live views
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}
