# AdventureWorks (OLTP) sample DB in the local Postgres — query it from Trino/Superset.
# Loaded on first `make up` from data staged by `make init` (community Postgres port).
connector.name=postgresql
connection-url=jdbc:postgresql://lab-db:5432/adventureworks
connection-user=learner
connection-password=learner
# AdventureWorks uses Postgres DOMAIN types (Name, NameStyle) + xml columns, which
# Trino's postgres connector can't map natively — without this it silently DROPS
# those columns (firstname/lastname/etc.). Map them to varchar so all columns show.
unsupported-type-handling=CONVERT_TO_VARCHAR
