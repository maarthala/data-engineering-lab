# Same-origin front for the Polaris Console: serves the UI at / and proxies the
# Polaris API at /api/ — so the browser makes only same-origin calls (no CORS).
#
# Upstreams are addressed via VARIABLES + Docker's embedded DNS resolver so nginx
# re-resolves them at request time. Without this, nginx resolves the hostnames ONCE
# at startup and caches the IP — so recreating polaris / polaris-console (new IP)
# would 502 until the proxy is restarted.
# localhost cookies from the other lab pages are sent here too — allow more than 8 KB of headers
large_client_header_buffers 8 32k;

server {
    listen 8189;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker embedded DNS

    location /api/ {
        set $polaris_upstream polaris;
        proxy_pass http://$polaris_upstream:8181$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed bundles never change → cache them; everything else (index.html, config.js,
    # lab-sso.js) must be re-checked, or browsers keep an old page after a console update.
    location /assets/ {
        set $console_upstream polaris-console;
        proxy_pass http://$console_upstream:8080$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        set $console_upstream polaris-console;
        proxy_pass http://$console_upstream:8080$request_uri;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        # the portal shows the console inside its page (Tools → Governance)
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:8000" always;
    }
}
