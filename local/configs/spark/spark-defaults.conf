spark.ui.reverseProxy true
spark.ui.reverseProxyUrl http://127.0.0.1:8002
spark.ui.showConsoleProgress true
# the portal shows the Spark UI inside its page (Tools → Spark UI)
spark.ui.allowFramingFrom http://localhost:8000
spark.master spark://spark-master:7077
fs.s3a.threads.keepalivetime 60000
fs.s3a.multipart.purge.age 24
# in-memory: this stack has no Hive Metastore (Polaris is the catalog). With `hive`,
# anything touching spark_catalog (e.g. Delta path tables) fails to connect.
spark.sql.catalogImplementation in-memory
# Spark's own (spark_catalog) warehouse stays on the server's local disk: course tables live in
# Iceberg catalogs or at explicit s3a:// paths, and the cluster has no storage keys to make
# a shared folder (a learner's session couldn't create it in demo-bucket).
spark.sql.warehouse.dir file:///tmp/spark-warehouse
# Shared by every learner: fair sharing between concurrent jobs, and no single query may pull
# more than 512 MB back to the shared driver (an oversized collect() would crash it for all).
spark.scheduler.mode FAIR
spark.scheduler.allocation.file /opt/spark/conf/fairscheduler.xml
spark.driver.maxResultSize 512m
spark.hadoop.fs.s3a.connection.timeout  60000
spark.hadoop.fs.s3a.connection.establish.timeout 60000
spark.hadoop.fs.s3a.connection.request.timeout 60000
spark.hadoop.fs.s3a.connection.maximum 60
spark.hadoop.fs.s3a.connection.timeout 60000
spark.hadoop.fs.s3a.endpoint http://storage:9000
# No storage keys here: every session brings its OWN (a learner's notebook / DAG sets
# fs.s3a.access.key + secret.key for the session; Iceberg tables get short-lived keys
# vended by Polaris). No cache, so one session's key is never reused by another.
spark.hadoop.fs.s3a.impl.disable.cache true
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
spark.hadoop.fs.s3a.impl org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# --- Apache Iceberg (catalog name: "iceberg", backed by the Iceberg REST catalog, stored in object storage) ---
# Usage: spark.sql("CREATE TABLE iceberg.db.tbl (...) USING iceberg")
spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,io.delta.sql.DeltaSparkSessionExtension
# Backed by Apache Polaris (governed Iceberg REST). The catalog name stays `iceberg`
# so all course code (iceberg.bronze.*, iceberg.gold.*, …) is unchanged. Polaris vends
# short-lived storage credentials scoped to each table (no static keys here).
spark.sql.catalog.iceberg org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type rest
spark.sql.catalog.iceberg.uri http://polaris:8181/api/catalog
spark.sql.catalog.iceberg.warehouse polaris_lake
# No login here: every session signs in itself (a learner's notebook / DAG as that
# learner, platform jobs with POLARIS_CREDENTIAL) — a default would be shared by all.
spark.sql.catalog.iceberg.scope PRINCIPAL_ROLE:ALL
spark.sql.catalog.iceberg.header.X-Iceberg-Access-Delegation vended-credentials
spark.sql.catalog.iceberg.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint http://storage:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.client.region us-east-1

# --- Delta Lake (jars baked into the Spark image) ---
# Extension = Delta SQL (VACUUM, OPTIMIZE [ZORDER BY], DESCRIBE HISTORY, RESTORE);
# DeltaCatalog = path tables via delta.`s3a://...`. Iceberg stays the governed catalog.
spark.sql.catalog.spark_catalog org.apache.spark.sql.delta.catalog.DeltaCatalog
