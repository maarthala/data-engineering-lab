site_name: Epireum's Data Engineering Lab
site_description: Learn Data Engineering by building a real Bronze→Silver→Gold pipeline for the ShopFlow e-commerce company, then map every skill to Databricks, Snowflake, Fabric, and Azure.
site_url: https://maarthala.github.io/data-engineering-lab/
repo_url: https://github.com/maarthala/data-engineering-lab
repo_name: maarthala/data-engineering-lab
copyright: >
  <a href="https://github.com/maarthala/data-engineering-lab" target="_blank" rel="noopener">⭐ View this project on GitHub</a>
  &nbsp;·&nbsp; reach <a href="mailto:contact@epireum.com">contact@epireum.com</a> for more information
docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  logo: assets/epireum-logo.png
  favicon: assets/epireum-logo.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }

# Unit + lesson numbers come from the nav order (hooks/numbering.py) — never type them.
hooks:
  - hooks/numbering.py

plugins:
  - search
  - redirects:
      redirect_maps:
        # 3.9.1 moved to 4.2.1 — keep the shared link working
        unit3/data-cleaning.md: unit4/data-cleaning.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/discord.js

extra:
  generator: false          # remove the "Made with Material for MkDocs" footer notice
  analytics:                # Google Analytics 4 — Material injects gtag.js and tracks page views + site search
    provider: google
    property: G-YJG2RDY33C
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maarthala/data-engineering-lab
      name: Project on GitHub

