      - "Bring up the stack": setup/deploy.md
      - "Your lab account & workspace": setup/workspace.md
      - "+ Personas & roles (governance demos)": setup/personas.md
      - "The ShopFlow scenario": scenario.md
      - "Technical architecture": unit0/architecture.md
      - "Database schema": unit0/schema.md
      - "Stack architecture": unit0/stack.md
