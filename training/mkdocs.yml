  - "Foundations":
      - "What is Data Engineering": unit1/what-is-de.md
      - "Lake vs Warehouse vs Lakehouse": unit1/lakehouse.md
      - "File & table formats": unit1/formats.md
      - "Medallion architecture": unit1/medallion.md
      - "Dimensional modeling (facts & dimensions)": unit1/dimensional-modeling.md
  - "SQL on big data":
