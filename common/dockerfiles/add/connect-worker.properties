# The lab's Kafka Connect worker (Dockerfile.kafka-connect): one worker, its own state in Kafka.
bootstrap.servers=kafka:9092
group.id=lab-connect
config.storage.topic=_connect-configs
offset.storage.topic=_connect-offsets
status.storage.topic=_connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.flush.interval.ms=5000
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter.schemas.enable=true
listeners=http://0.0.0.0:8083
rest.advertised.host.name=kafka-connect
plugin.path=/opt/connect-plugins
plugin.discovery=hybrid_warn
# ${dir:/run/lab-secrets/<connector>:<name>} — a secret's file, written by cdc-runner
config.providers=dir
config.providers.dir.class=org.apache.kafka.common.config.provider.DirectoryConfigProvider
config.providers.dir.param.allowed.paths=/run/lab-secrets
