<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock exams — Epireum's Data Engineering Lab</title>
  <link rel="stylesheet" href="/admin.css?v=8">
  <style>
    .qtags{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px} .qtag{font-size:.74rem; padding:1px 7px; border:1px solid var(--line2); border-radius:999px; color:var(--muted); background:var(--panel2)}
    button.qtag{cursor:pointer} button.qtag:hover{border-color:var(--accent); color:var(--accent)}
    main{max-width:none}
    .elist td{vertical-align:middle} .hist > td{background:var(--panel2); padding:6px 14px 12px}
    .hist table th{background:transparent}
    button.on{border-color:var(--accent); color:var(--accent)}
    .exam h2{margin:0 0 4px; font-size:1.05rem}
    .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0}
    .stats div{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px; text-align:center}
    .stats b{display:block; font-size:1.15rem} .stats span{font-size:.75rem; color:var(--muted)}
    .pass{color:var(--accent2)} .fail{color:var(--bad-ink)}
    .q{font-size:1.02rem; line-height:1.55; margin:6px 0 14px}
    .palette button.part{background:var(--warn-bg); border-color:#f0d9a8}
    .opt{display:flex; gap:10px; align-items:flex-start; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
         margin-bottom:8px; cursor:pointer; line-height:1.45}
    .opt:hover{border-color:var(--accent)} .opt.sel{border-color:var(--accent); background:rgba(109,139,255,.12)}
    .opt input{margin-top:3px} .opt .k{font-weight:700; color:var(--muted); min-width:18px}
    .opt.ok{border-color:var(--accent2); background:rgba(57,208,196,.1)} .opt.bad{border-color:var(--danger); background:rgba(255,107,107,.08)}
    .palette{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
    .palette button{width:34px; padding:4px 0; font-size:.8rem}
    .palette button.done{background:rgba(57,208,196,.22); border-color:rgba(57,208,196,.5)}
    .closed.dl{background:var(--accent-bg); color:var(--accent); border-color:transparent}
    .seg{display:inline-flex; gap:4px; flex-wrap:wrap}
    .closed{margin-left:8px; font-size:.72rem; padding:1px 7px; border-radius:999px; background:var(--panel2); color:var(--muted); border:1px solid var(--line2)}
    .palette button.flag{position:relative} .palette button.flag::after{content:'⚑'; position:absolute; top:-7px; right:-4px; font-size:.7rem; color:var(--danger)}
    .palette button.cur{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
    .palette button.ok{background:var(--ok-bg); border-color:#b7e1c4; color:var(--ok-ink)} .palette button.bad{background:var(--bad-bg); border-color:#f1b5b0; color:var(--bad-ink)}
    .palette button.none{background:var(--panel2); color:var(--muted)}
    .big{font-size:2.2rem; font-weight:800}
    .dom{display:grid; grid-template-columns:minmax(0,1fr) 160px 70px; gap:10px; align-items:center; padding:6px 0; border-top:1px solid var(--line); font-size:.9rem}
    .meter{height:8px; background:var(--panel2); border-radius:999px; overflow:hidden} .meter i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2))}
    .expl{margin-top:10px; padding:10px 12px; border-left:3px solid var(--accent); background:var(--panel2); border-radius:6px; font-size:.92rem; line-height:1.55}
    .expl ul{margin:6px 0; padding-left:20px} .expl p{margin:6px 0} .expl a{color:var(--accent)}
    .ask{display:inline-flex; flex-wrap:wrap; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--gold); border-radius:9px; background:rgba(226,185,59,.08); font-size:.88rem}
    .miss{width:100%; border-collapse:collapse; font-size:.9rem} .miss td{padding:7px 8px; border-top:1px solid var(--line); vertical-align:top}
    .miss tr.go{cursor:pointer} .miss tr.go:hover td{background:var(--panel2)} .miss .qt{max-width:640px} .miss .r{text-align:right; white-space:nowrap}
    .flagnote{font-size:.8rem; color:var(--danger); margin-left:8px; font-weight:600}
    .nav{display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-top:12px}
    @media (max-width:640px){ .stats{grid-template-columns:repeat(2,1fr)} .dom{grid-template-columns:1fr 70px} .dom .meter{display:none} }
  </style>
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=16"></script>
  <script src="/exam-render.js?v=5"></script>
  <div class="pagebar"><h1>📝 Mock exams <span class="dot">·</span> practise for a certification</h1></div>
  <main id="main"><div class="placeholder">Loading…</div></main>
  <script>
    // 📝 Mock exams — the exams open to you (everyone, or your team). Take one as often as you like:
    // each attempt draws a new set of questions; answers are saved as you go, so leave any time and
    // resume later (no time limit). After you submit: your score, per domain, and every question
    // with the right answer and the explanation. #attempt=<id> in the address = that attempt.
    var main = document.getElementById('main');
    function el(tag, attrs, kids) {
      var e = document.createElement(tag);
      Object.keys(attrs || {}).forEach(function (k) {
        if (k === 'text') e.textContent = attrs[k];
        else if (k === 'html') e.innerHTML = attrs[k];
        else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { e.addEventListener(ev, attrs.on[ev]); });
        else e.setAttribute(k, attrs[k]);
      });
      (kids || []).forEach(function (c) { if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
      return e;
    }
    function api(method, path, body) {
      return fetch(path, {method: method, credentials: 'same-origin',
          headers: body ? {'Content-Type': 'application/json', 'X-Lab-Request': '1'} : {},
          body: body ? JSON.stringify(body) : undefined})
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j; }); });
    }
    // inline "are you sure?" next to a button (no browser popups): hides the button and shows the
    // question with Yes / Cancel; Yes runs `yes(button)`
    function ask(btn, question, yesText, yes, danger) {
      var y = el('button', {class: 'small ' + (danger ? 'danger' : 'primary'), text: yesText});
      var n = el('button', {class: 'small', text: 'Cancel'});
      var box = el('span', {class: 'ask'}, [el('span', {text: question}), y, n]);
      btn.hidden = true; btn.parentNode.insertBefore(box, btn.nextSibling);
      n.addEventListener('click', function () { box.remove(); btn.hidden = false; });
      y.addEventListener('click', function () { box.remove(); btn.hidden = false; yes(btn); });
    }
    function fail(e) { main.innerHTML = ''; main.appendChild(el('div', {class: 'placeholder', text: 'Could not load: ' + e.message})); }
    function refs(q) { return (q.refs || []).filter(function (x) { return /^https?:\/\//.test(x.url || ''); }); }
    function when(iso) { return new Date(iso).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'}); }

    // ---- the list: exams open to me + my stats — search, a quick filter, and 20 at a time: more load
    // as you scroll to the end (lazy)
    var KINDS = [['', 'All'], ['delab', 'DE lab'], ['cert', 'Certifications'], ['open', 'In progress']], filt = {q: '', kind: ''};
    function list(note) {
      if (location.hash) history.replaceState(null, '', location.pathname);
      main.innerHTML = '';
      var search = el('input', {type: 'search', placeholder: 'Search exams…', value: filt.q, style: 'max-width:260px'});
      var seg = el('span', {class: 'seg'}, KINDS.map(function (k) {
        var b = el('button', {class: 'small' + (filt.kind === k[0] ? ' on' : ''), text: k[1]});
        b.addEventListener('click', function () { filt.kind = k[0]; [].forEach.call(seg.children, function (x) { x.classList.toggle('on', x === b); }); reload(); });
        return b;
      }));
      var title = el('h3', {style: 'margin:0', text: 'Exams open to you'});
      var body = el('tbody'), more = el('div', {class: 'sub', style: 'text-align:center; padding:10px'});
      var table = el('table', {class: 'elist'}, [el('thead', {}, [el('tr', {},
        ['Exam', 'Questions', 'Pass mark', 'Attempts', 'Passed', 'Best', 'Average', 'Last', '', ''].map(function (h, i) {
          return el('th', {class: i >= 1 && i <= 7 ? 'r' : '', text: h}); }))]), body]);
      main.appendChild(el('div', {class: 'card'}, [el('div', {class: 'bar'}, [title, el('span', {class: 'row', style: 'gap:10px'}, [search, seg])]),
        el('div', {class: 'wrap'}, [table]), more]));
      if (note) alertCard(note);
      var next = 0, busy = false, done = false, ask_ = 0, timer;
      function page() {
        if (busy || done) return;
        busy = true; more.textContent = 'Loading…';
        var mine = ++ask_;
        api('GET', '/api/exams?q=' + encodeURIComponent(filt.q) + '&kind=' + filt.kind + '&offset=' + next + '&limit=20').then(function (d) {
          if (mine !== ask_) return;                       // a newer search went out meanwhile
          busy = false; next += d.exams.length; done = !d.more;
          d.exams.forEach(function (e) { examRows(e).forEach(function (r) { body.appendChild(r); }); });
          title.textContent = (filt.q || filt.kind ? d.total + ' of your exams match' : d.total + (d.total === 1 ? ' exam' : ' exams') + ' open to you');
          table.hidden = !d.total;
          more.textContent = !d.total ? (filt.q || filt.kind ? 'No exam matches.' : 'No mock exams are open to you yet — your lab managers add them.')
                           : done ? '' : 'Scroll for more…';
          if (!done) setTimeout(check, 0);                 // the page may not fill the screen yet
        }).catch(function (e) { busy = false; if (mine === ask_) more.textContent = 'Could not load: ' + e.message; });
      }
      function reload() { body.innerHTML = ''; next = 0; done = false; busy = false; page(); }
      function check() { if (!done && more.isConnected && more.getBoundingClientRect().top < window.innerHeight + 200) page(); }
      search.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { filt.q = search.value.trim(); reload(); }, 250); });
      if (window.IntersectionObserver) new IntersectionObserver(function (es) { if (es[0].isIntersecting) page(); }, {rootMargin: '200px'}).observe(more);
      else window.addEventListener('scroll', check);
      page();
    }
    function pct(v) { return v === null || v === undefined ? '—' : v + ' %'; }
    // one exam = one row (+ its attempts in a row below, opened with History)
    function examRows(e) {
      var s = e.stats;
      // closed by the managers: no new attempt; one in progress opens read-only, to submit
      var go = el('button', {class: 'small primary', text: e.open ? (e.closed ? 'Submit ' : 'Resume ') + e.open.answered + '/' + e.open.total : (s.attempts ? 'New attempt' : 'Start')});
      go.hidden = e.closed && !e.open;
      go.addEventListener('click', function () {
        go.disabled = true;
        api('POST', '/api/exams/start', {exam: e.id}).then(take).catch(function (x) { alertCard(x.message); go.disabled = false; });
      });
      var more = el('button', {class: 'small', text: 'History (' + e.history.length + ')'});
      more.disabled = !e.history.length;
      var last = e.history[0];
      var row = el('tr', {}, [
        el('td', {}, [el('b', {text: e.name}), e.delab ? el('span', {class: 'closed dl', text: 'DE lab'}) : null, e.closed ? el('span', {class: 'closed', text: 'closed'}) : null,
          el('div', {class: 'sub', text: e.closed ? 'Closed by your lab managers' + (e.open ? ' — submit your attempt as it is' : '') : (e.provider ? e.provider + ' · ' : '') + 'no time limit'})]),
        el('td', {class: 'r', text: String(e.questions)}), el('td', {class: 'r', text: e.pass_percent + ' %'}),
        el('td', {class: 'r', text: String(s.attempts)}), el('td', {class: 'r' + (s.passed ? ' pass' : ''), text: String(s.passed)}),
        el('td', {class: 'r', text: pct(s.best)}), el('td', {class: 'r', text: pct(s.average)}),
        el('td', {class: 'r'}, last ? [el('span', {class: last.passed ? 'pass' : 'fail', text: last.score + ' %'})] : ['—']),
        el('td', {class: 'acts'}, [go]), el('td', {class: 'acts'}, [more])]);
      var hist = el('tr', {class: 'hist', hidden: ''}, [el('td', {colspan: '10'}, [el('table', {}, [el('thead', {}, [el('tr', {},
        ['When', 'Score', 'Result', 'Time', ''].map(function (h) { return el('th', {text: h}); }))]), el('tbody', {}, e.history.map(function (a) {
          var r = el('button', {class: 'small', text: 'Review'});
          r.addEventListener('click', function () { openAttempt(a.id); });
          return el('tr', {}, [el('td', {class: 'muted', text: when(a.finished_at)}), el('td', {text: a.score + ' % (' + a.correct + '/' + a.total + ')'}),
            el('td', {class: a.passed ? 'pass' : 'fail', text: a.passed ? 'passed' : 'not yet'}), el('td', {class: 'muted', text: a.minutes + ' min'}),
            el('td', {class: 'acts'}, [r])]);
        }))])])]);
      more.addEventListener('click', function () {
        hist.hidden = !hist.hidden; more.classList.toggle('on', !hist.hidden);
        if (!hist.hidden && !hist.missed) hist.firstChild.appendChild(hist.missed = missedCard(e.id));
      });
      return [row, hist];
    }
    function alertCard(msg) { main.insertBefore(el('div', {class: 'card result err'}, [el('div', {text: msg})]), main.firstChild); }

    function openAttempt(id, qid) {
      api('GET', '/api/exams/attempt?id=' + id).then(function (a) { a.done ? showReview(a, qid) : take(a); }).catch(fail);
    }
    // ---- the questions you keep getting wrong in an exam (2+ times over your attempts), most first;
    // click one → its review in the latest attempt you missed it in (here: jump to it)
    function missedCard(examId, jump) {
      var card = el('div', {class: 'card'}, [el('div', {class: 'sub', text: 'Loading the questions you keep missing…'})]);
      api('GET', '/api/exams/missed?exam=' + encodeURIComponent(examId)).then(function (d) {
        card.innerHTML = '';
        card.appendChild(el('h3', {style: 'margin:0 0 4px', text: '🔁 Questions you keep getting wrong' + (d.questions.length ? ' — top ' + d.questions.length : '')}));
        card.appendChild(el('div', {class: 'sub', text: d.questions.length ? 'Missed 2 or more times over your ' + d.attempts + ' attempts (wrong, partly right or not answered) — click one to review it.'
                                                        : 'None yet — no question was missed twice over your ' + d.attempts + (d.attempts === 1 ? ' attempt.' : ' attempts.')}));
        if (!d.questions.length) return;
        card.appendChild(el('div', {class: 'wrap'}, [el('table', {class: 'miss'}, [el('tbody', {}, d.questions.map(function (q, n) {
          var text = String(q.question || '').replace(/[#*_`|>]+|-{3,}/g, ' ').replace(/\s+/g, ' ').trim();
          var r = el('tr', {class: 'go', title: 'Review it'}, [el('td', {class: 'muted', text: String(n + 1)}),
            el('td', {class: 'qt'}, [el('div', {text: text.length > 180 ? text.slice(0, 180) + '…' : text}),
              domainOf(d, q) ? el('div', {class: 'sub', style: 'color:var(--accent)', text: domainOf(d, q)}) : null]),
            el('td', {class: 'r fail', text: q.missed + ' of ' + q.seen + ' missed'}),
            el('td', {class: 'r ' + (q.last_right ? 'pass' : 'muted'), text: q.last_right ? 'right last time' : 'missed last time'}),
            el('td', {class: 'r', style: 'color:var(--danger)', text: q.marked ? '⚑ ' + q.marked + '×' : ''})]);
          r.addEventListener('click', function () { if (!jump || !jump(q.attempt, q.qid)) openAttempt(q.attempt, q.qid); });
          return r;
        }))])]));
      }).catch(function (e) { card.innerHTML = ''; card.appendChild(el('div', {class: 'sub', text: 'Could not load: ' + e.message})); });
      return card;
    }

    // ---- taking an attempt: one question at a time, saved on every change ----------------------
    function take(a) {
      if (a.done) return showReview(a);
      history.replaceState(null, '', '#attempt=' + a.id);
      var i = Math.min(a.position || 0, a.questions.length - 1), answers = a.answers || {}, saving = Promise.resolve();
      var marked = a.marked || [];                         // marked for review — a reminder for you, not marked as wrong
      function save(q) {
        if (a.closed) return;                              // closed: nothing changes any more
        var v = answers[q.qid], body = {attempt: a.id, qid: q.qid, position: i};
        if (q.slots) body.slots = v || {}; else body.keys = v || [];
        saving = saving.then(function () { return api('POST', '/api/exams/answer', body); })
          .catch(function (e) {
            if (e.message === 'no such attempt') return list('Your lab managers reset this attempt — start the exam again for a new set of questions.');
            if (/closed this exam/.test(e.message)) return openAttempt(a.id);   // closed meanwhile: read-only, submit
            alertCard('Could not save your answer: ' + e.message);
          });
      }
      function render() {
        var q = a.questions[i], picked = answers[q.qid] || [], multi = q.choose > 1;
        main.innerHTML = '';
        var answered = Object.keys(answers).length;
        var opts = q.slots ? [slotArea(q)] : q.options.map(function (o) {
          var on = picked.indexOf(o.key) >= 0;
          var box = el('input', {type: multi ? 'checkbox' : 'radio', name: 'opt'}); box.checked = on;
          var row = el('label', {class: 'opt' + (on ? ' sel' : '')}, [box, el('span', {class: 'k', text: o.key}), el('span', {class: 'md', html: mdLine(o.text)})]);
          box.addEventListener('change', function () {
            var cur = answers[q.qid] || [];
            if (!multi) cur = [o.key];
            else if (box.checked) { if (cur.length >= q.choose) { box.checked = false; return; } cur = cur.concat([o.key]); }
            else cur = cur.filter(function (k) { return k !== o.key; });
            if (cur.length) answers[q.qid] = cur.sort(); else delete answers[q.qid];
            save(q); render();
          });
          return row;
        });
        // hotspot / drag-drop: a dropdown per box, target or step; yes-no: Yes / No per statement
        function slotArea(q) {
          var mine = answers[q.qid] || {};
          function set(id, v) {
            var cur = Object.assign({}, answers[q.qid] || {});
            if (v) cur[id] = v; else delete cur[id];
            if (Object.keys(cur).length) answers[q.qid] = cur; else delete answers[q.qid];
            save(q); render();
          }
          return el('table', {class: 'slots'}, [el('tbody', {}, q.slots.map(function (s) {
            var pick;
            if (q.type === 'yes-no') pick = el('span', {}, s.choices.map(function (c) {
              var r = el('input', {type: 'radio', name: 'slot-' + s.id}); r.checked = mine[s.id] === c;
              r.addEventListener('change', function () { set(s.id, c); });
              return el('label', {}, [r, ' ' + c]);
            }));
            else {
              pick = el('select', {}, [el('option', {value: '', text: '— choose —'})].concat(s.choices.map(function (c) { return el('option', {value: c, text: c}); })));
              pick.value = mine[s.id] || '';
              pick.addEventListener('change', function () { set(s.id, pick.value); });
            }
            return el('tr', {}, [el('td', {class: 'md', html: mdLine(s.label || s.id)}), el('td', {}, [pick])]);
          }))]);
        }
        var prev = el('button', {text: '← Previous'}); prev.disabled = i === 0;
        prev.addEventListener('click', function () { i--; render(); });
        var next = el('button', {class: 'primary', text: 'Next →'}); next.hidden = i === a.questions.length - 1;
        next.addEventListener('click', function () { i++; save(q); render(); });
        var flagged = marked.indexOf(q.qid) >= 0;
        var flag = el('button', {class: 'small' + (flagged ? ' on' : ''), text: flagged ? '⚑ Marked for review' : '⚐ Mark for review',
                                 title: 'A reminder to come back to this question before you submit'});
        flag.addEventListener('click', function () {
          marked = flagged ? marked.filter(function (m) { return m !== q.qid; }) : marked.concat([q.qid]);
          saving = saving.then(function () { return api('POST', '/api/exams/answer', {attempt: a.id, qid: q.qid, mark: !flagged}); })
            .catch(function (e) { alertCard('Could not save the mark: ' + e.message); });
          render();
        });
        var pause = el('button', {text: '⏸ Pause'});
        pause.addEventListener('click', function () { save(q); saving.then(function () { list(); }); });
        var submit = el('button', {class: i === a.questions.length - 1 || a.closed ? 'primary' : '', text: 'Submit exam'});
        submit.addEventListener('click', function () {
          var left = a.questions.length - Object.keys(answers).length, flags = marked.length;
          var why = [left ? left + ' not answered — they count as wrong' : '', flags ? flags + ' marked for review' : ''].filter(Boolean).join(' · ');
          ask(submit, why ? why + '. Submit anyway?' : 'Submit your answers?', 'Yes, submit', function () {
            submit.disabled = true;
            saving.then(function () { return api('POST', '/api/exams/submit', {attempt: a.id}); }).then(showReview)
              .catch(function (e) { alertCard(e.message); submit.disabled = false; });
          });
        });
        var pal = el('div', {class: 'palette'}, a.questions.map(function (x, n) {
          var b = el('button', {class: (answers[x.qid] ? 'done' : '') + (marked.indexOf(x.qid) >= 0 ? ' flag' : '') + (n === i ? ' cur' : ''), text: String(n + 1),
                                title: marked.indexOf(x.qid) >= 0 ? 'marked for review' : ''});
          b.addEventListener('click', function () { i = n; render(); });
          return b;
        }));
        main.appendChild(el('div', {class: 'card'}, [
          el('div', {class: 'bar'}, [el('b', {text: a.exam.name}), el('span', {class: 'sub', text: answered + ' / ' + a.questions.length + ' answered · ' + (a.closed ? 'closed — read-only' : 'saved as you go')})]),
          el('div', {class: 'bar'}, [el('div', {}, [el('div', {class: 'sub', text: 'Question ' + (i + 1) + ' of ' + a.questions.length + (q.slots ? ' · ' + SLOT_HINT[q.type] : multi ? ' · choose ' + q.choose : '')}),
            domainOf(a, q) ? el('div', {class: 'sub', style: 'color:var(--accent)', text: domainOf(a, q)}) : null, tagList(q)]), flag]),
          caseBox(a, q), el('div', {class: 'q md', html: md(q.question)}), el('div', {}, opts),
          el('div', {class: 'nav'}, [el('div', {class: 'row'}, [prev, next]), el('div', {class: 'row'}, [pause, submit])])]));
        main.appendChild(el('div', {class: 'card'}, [el('h3', {text: 'Questions' + (marked.length ? ' · ⚑ ' + marked.length + ' marked for review' : '')}), pal]));
        if (a.closed) {                                    // read-only: look through, then submit
          main.querySelectorAll('.opt input, table.slots input, table.slots select').forEach(function (x) { x.disabled = true; });
          flag.hidden = true;
          main.insertBefore(el('div', {class: 'card result err'}, [el('b', {text: 'Your lab managers closed this exam. '}),
            el('span', {text: 'You can\'t change your answers any more — submit them as they are to see your result (unanswered questions count as wrong).'})]), main.firstChild);
        }
      }
      render();
    }

    // ---- the review of a submitted attempt -----------------------------------------------------
    function showReview(r, qid) {
      history.replaceState(null, '', '#attempt=' + r.id);
      main.innerHTML = '';
      var box = el('div'), pal = el('div', {class: 'palette'});
      var parts = r.questions.filter(function (q) { return q.points > 0 && !q.right; }).length;
      var cur = r.questions.findIndex(function (q) { return qid ? q.qid === qid : !q.right; });   // that question, else the first wrong one
      if (cur < 0) cur = 0;
      var flags = r.questions.filter(function (q) { return q.marked; }), flagsWrong = flags.filter(function (q) { return !q.right; }).length;
      var back = el('button', {text: '← All exams'}); back.addEventListener('click', function () { list(); });
      var again = el('button', {class: 'primary', text: 'New attempt'});
      again.addEventListener('click', function () { api('POST', '/api/exams/start', {exam: r.exam.id}).then(take).catch(function (e) { alertCard(e.message); }); });
      main.appendChild(el('div', {class: 'card'}, [
        el('div', {class: 'bar'}, [el('div', {}, [el('b', {text: r.exam.name}), el('div', {class: 'sub', text: when(r.finished_at) + ' · ' + r.minutes + ' min'})]),
          el('div', {class: 'row'}, [back, again])]),
        el('div', {class: 'row', style: 'gap:18px; margin:6px 0 12px'}, [
          el('span', {class: 'big ' + (r.passed ? 'pass' : 'fail'), text: r.score + ' %'}),
          el('span', {}, [el('b', {class: r.passed ? 'pass' : 'fail', text: r.passed ? 'Passed' : 'Not passed yet'}),
            el('div', {class: 'sub', text: r.correct + ' of ' + r.total + ' right' + (parts ? ' · ' + parts + ' partly right' : '') + ' · pass mark ' + r.exam.pass_percent + ' %'})])]),
        el('div', {}, r.by_domain.map(function (d) {
          var p = Math.round(100 * d.correct / (d.total || 1));
          return el('div', {class: 'dom'}, [el('span', {text: (d.domain !== '-' ? d.domain + ' · ' : '') + d.name}),
            el('div', {class: 'meter'}, [el('i', {style: 'width:' + p + '%'})]), el('span', {class: 'muted', text: fmt(d.correct) + '/' + d.total})]);
        }))]));
      var wrong = r.questions.filter(function (q) { return !q.right; }).length;
      var revealAll = el('button', {class: 'small', text: 'Reveal all answers'});
      main.appendChild(el('div', {class: 'card'}, [el('div', {class: 'bar'}, [el('h3', {style: 'margin:0', text: 'Questions — click one to see it'}),
        el('span', {class: 'row', style: 'gap:10px'}, [el('span', {class: 'sub', text: (r.questions.length - wrong) + ' right · ' + wrong + ' wrong or not answered' +
          (flags.length ? ' · ⚑ ' + flags.length + ' marked for review, ' + flagsWrong + ' of them wrong' : '')}), revealAll])]), pal]));
      main.appendChild(box);
      main.appendChild(missedCard(r.exam.id, function (id, q) {   // in this attempt: just go to it
        var n = id === r.id ? r.questions.findIndex(function (x) { return x.qid === q; }) : -1;
        if (n < 0) return false;
        cur = n; paint(); window.scrollTo({top: box.offsetTop - 80}); return true;
      }));
      // a question you got wrong hides its answer at first: try again (Check — not marked, your score
      // stays) or Reveal answer; right ones are shown open. Reveal all opens every one.
      var shown = {}, again = {};
      r.questions.forEach(function (q) { if (q.right) shown[q.qid] = true; });
      revealAll.addEventListener('click', function () { r.questions.forEach(function (q) { shown[q.qid] = true; }); paint(); });
      function paint() {
        pal.innerHTML = '';
        r.questions.forEach(function (q, n) {
          var b = el('button', {class: (q.right ? 'ok' : q.points > 0 ? 'part' : q.answered ? 'bad' : 'none') + (q.marked ? ' flag' : '') + (n === cur ? ' cur' : ''), text: String(n + 1),
                                title: (q.right ? 'right' : q.points > 0 ? 'partly right' : q.answered ? 'wrong' : 'not answered') + (q.marked ? ' · you marked it for review' : '')});
          b.addEventListener('click', function () { cur = n; paint(); });
          pal.appendChild(b);
        });
        revealAll.hidden = r.questions.every(function (q) { return shown[q.qid]; });
        var q = r.questions[cur], open = !!shown[q.qid];
        var prev = el('button', {text: '← Previous'}); prev.disabled = cur === 0;
        prev.addEventListener('click', function () { cur--; paint(); });
        var next = el('button', {text: 'Next →'}); next.disabled = cur === r.questions.length - 1;
        next.addEventListener('click', function () { cur++; paint(); });
        box.innerHTML = '';
        box.appendChild(el('div', {class: 'card'}, [
            el('div', {class: 'bar'}, [el('div', {}, [el('b', {text: 'Question ' + (cur + 1) + ' of ' + r.questions.length}), q.marked ? el('span', {class: 'flagnote', text: '⚑ you marked it for review'}) : null,
              domainOf(r, q) ? el('div', {class: 'sub', style: 'color:var(--accent)', text: domainOf(r, q)}) : null, tagList(q)]), el('span', {class: q.right ? 'pass' : 'fail',
              text: q.right ? '✓ right' : q.points > 0 ? '◐ ' + q.slots.filter(function (s) { return s.right; }).length + ' of ' + q.slots.length + ' right' : (q.answered ? '✗ wrong' + (!q.slots && q.picked.length < q.answer.length ? ' — you picked ' + q.picked.length + ' of ' + q.answer.length : '') : '✗ not answered')})]),
            caseBox(r, q), el('div', {class: 'q md', html: md(q.question)}),
            open ? revealed(q) : retry(q),
            open && (q.explanation || refs(q).length) ? el('div', {class: 'expl md', html: md(q.explanation) + (refs(q).length ? '<p>' +
              refs(q).map(function (x) { return '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.title || x.url) + '</a>'; }).join(' · ') + '</p>' : '')}) : null,
            el('div', {class: 'nav'}, [prev, next])]));
      }
      // the answer and how you did
      function revealed(q) {
        if (q.slots) return el('table', {class: 'slots'}, [el('tbody', {}, [el('tr', {}, ['', 'Your answer', 'Correct'].map(function (h) { return el('td', {class: 'muted', text: h}); }))]
          .concat(q.slots.map(function (s) {
            return el('tr', {}, [el('td', {class: 'md', html: mdLine(s.label || s.id)}),
              el('td', {class: s.right ? 'ok' : 'bad', text: (s.right ? '✓ ' : '✗ ') + (s.picked || 'not answered')}), el('td', {text: s.answer.join(' / ')})]);
          })))]);
        return el('div', {}, q.options.map(function (o) {
          var good = q.answer.indexOf(o.key) >= 0, mine = q.picked.indexOf(o.key) >= 0;
          return el('div', {class: 'opt' + (good ? ' ok' : mine ? ' bad' : '')}, [el('span', {class: 'k', text: o.key}), el('span', {class: 'md', html: mdLine(o.text)}),
            el('span', {class: 'muted', style: 'margin-left:auto; white-space:nowrap', text: (mine ? 'your answer' : '') + (good ? (mine ? ' · ' : '') + 'correct' : '')})]);
        }));
      }
      // your first answer marked, the right one hidden: pick again → Check, or Reveal answer
      function retry(q) {
        // your right first picks start ticked — add the one(s) you missed
        var t = again[q.qid] = again[q.qid] || {pick: q.slots ? {} : q.picked.filter(function (k) { return q.answer.indexOf(k) >= 0; }), said: null};
        var verdict = el('span', {class: t.said === true ? 'pass' : 'fail', text: t.said === true ? '✓ Right — Reveal answer for the explanation.'
                                   : t.said === false ? '✗ Not yet — try again, or reveal the answer.' : ''});
        var check = el('button', {class: 'primary', text: 'Check'});
        var reveal = el('button', {text: 'Reveal answer'});
        reveal.addEventListener('click', function () { shown[q.qid] = true; paint(); });
        var area;
        if (q.slots) {
          area = el('table', {class: 'slots'}, [el('tbody', {}, [el('tr', {}, ['', 'Your answer', 'Try again'].map(function (h) { return el('td', {class: 'muted', text: h}); }))]
            .concat(q.slots.map(function (s) {
              var mark = t.said === null || !t.pick[s.id] ? '' : t.pick[s.id] && s.answer.indexOf(t.pick[s.id]) >= 0 ? ' ✓' : ' ✗';
              var pick = el('select', {}, [el('option', {value: '', text: '— choose —'})].concat(s.choices.map(function (c) { return el('option', {value: c, text: c}); })));
              pick.value = t.pick[s.id] || '';
              pick.addEventListener('change', function () { t.pick[s.id] = pick.value; t.said = null; paint(); });
              return el('tr', {}, [el('td', {class: 'md', html: mdLine(s.label || s.id)}),
                el('td', {class: s.right ? 'ok' : 'bad', text: (s.right ? '✓ ' : '✗ ') + (s.picked || 'not answered')}),
                el('td', {}, [pick, el('span', {class: mark === ' ✓' ? 'ok' : 'bad', text: mark})])]);
            })))]);
          check.disabled = q.slots.some(function (s) { return !t.pick[s.id]; });
          check.addEventListener('click', function () {
            t.said = q.slots.every(function (s) { return s.answer.indexOf(t.pick[s.id]) >= 0; }); paint();
          });
        } else {
          var multi = q.answer.length > 1;
          area = el('div', {}, q.options.map(function (o) {
            var on = t.pick.indexOf(o.key) >= 0, mine = q.picked.indexOf(o.key) >= 0;
            var hit = mine && q.answer.indexOf(o.key) >= 0;  // your first picks: right green, wrong red — the ones you missed stay hidden
            var box = el('input', {type: multi ? 'checkbox' : 'radio', name: 'again'}); box.checked = on;
            box.addEventListener('change', function () {
              if (!multi) t.pick = [o.key];
              else if (box.checked) t.pick = t.pick.concat([o.key]).slice(-q.answer.length);   // full: the oldest pick makes room
              else t.pick = t.pick.filter(function (k) { return k !== o.key; });
              t.said = null; paint();
            });
            return el('label', {class: 'opt' + (mine ? (hit ? ' ok' : ' bad') : '') + (on ? ' sel' : '')}, [box, el('span', {class: 'k', text: o.key}), el('span', {class: 'md', html: mdLine(o.text)}),
              el('span', {class: hit ? 'pass' : 'fail', style: 'margin-left:auto; white-space:nowrap', text: mine ? (hit ? '✓ your answer' : '✗ your answer') : ''})]);
          }));
          check.disabled = t.pick.length !== q.answer.length;
          check.addEventListener('click', function () {
            t.said = t.pick.slice().sort().join() === q.answer.slice().sort().join(); paint();
          });
        }
        return el('div', {}, [el('div', {class: 'sub', style: 'margin-bottom:8px', text: (q.slots ? 'Pick again' : q.answer.length > 1 ? 'Pick ' + q.answer.length + ' again' : 'Pick again') +
          ' — this try isn\'t marked; your score stays.'}), area,
          el('div', {class: 'row', style: 'margin-top:10px; gap:10px'}, [check, reveal, verdict])]);
      }
      paint();
      window.scrollTo({top: qid ? box.offsetTop - 80 : 0});
    }

    var m = /attempt=(\d+)/.exec(location.hash);
    if (m) openAttempt(m[1]); else list();
  </script>
</body>
