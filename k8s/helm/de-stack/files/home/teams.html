<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams — Epireum's Data Engineering Lab</title>
  <link rel="stylesheet" href="/admin.css?v=8">
</head>
<body>
  <header id="lab-top"></header>
  <script src="/lab-header.js?v=12"></script>
  <main id="main">
    <div class="placeholder">Loading…</div>
  </main>
  <script src="/admin.js?v=5"></script>
  <script>
    // Teams — tab All teams: every team (search; click one → its page). Tab Create a team. A team's
    // page (#teams/<team>/<section>): Members (filter, select, remove) · Add members (search, pick
    // several, add — someone in another team moves) · Delete team (only when it has no members).
    // A member is in no team or exactly one, and reads and writes its lakehouse team_<team>.
    var el = admin.el;
    var teams = [], people = [];
    admin.page('Teams', 'A team shares a lakehouse, files, secrets and Airflow DAGs.');
    var tab = admin.tabs([['teams', 'All teams'], ['create', 'Create a team']], function (t) { tab = t; route(); });
    function go(hash) { history.replaceState(null, '', '#' + hash); route(); }
    function stat(v, label) { return el('div', {class: 'stat'}, [el('b', {text: String(v)}), el('span', {text: label})]); }

    // ---- All teams -------------------------------------------------------------------------
    var filter = '';
    function listCard() {
      if (!teams.length) return el('div', {class: 'card'}, [el('div', {class: 'sub', text: 'No teams yet — create one on Create a team.'})]);
      var q = el('input', {type: 'search', placeholder: 'Search teams…', style: 'width:240px'});
      q.value = filter;
      var body = el('tbody');
      function paint() {
        body.innerHTML = '';
        var shown = teams.filter(function (t) { return t.team.indexOf(filter) >= 0 || t.members.some(function (m) { return m.indexOf(filter) >= 0; }); });
        if (!shown.length) body.appendChild(el('tr', {}, [el('td', {class: 'sub', colspan: '4', text: 'No team matches.'})]));
        shown.forEach(function (t) {
          var tr = el('tr', {class: 'link', style: 'cursor:pointer'}, [el('td', {}, [el('b', {text: t.team})]),
            el('td', {class: 'r', text: String(t.members.length)}), el('td', {}, [el('code', {text: t.catalog})]),
            el('td', {class: 'r', text: t.bucket_mb == null ? '—' : t.bucket_mb + ' MB'})]);
          tr.addEventListener('click', function () { go('teams/' + t.team + '/members'); });
          body.appendChild(tr);
        });
      }
      q.addEventListener('input', function () { filter = q.value.trim().toLowerCase(); paint(); });
      paint();
      return el('div', {class: 'card'}, [el('div', {class: 'bar'}, [el('h3', {style: 'margin:0', text: teams.length + (teams.length === 1 ? ' team' : ' teams') + ' — click one to manage it'}), q]),
        el('div', {class: 'wrap'}, [el('table', {}, [el('thead', {}, [el('tr', {}, [el('th', {text: 'Team'}), el('th', {class: 'r', text: 'Members'}),
          el('th', {text: 'Lakehouse'}), el('th', {class: 'r', text: 'Bucket'})])]), body])])]);
    }

    // ---- Create a team ---------------------------------------------------------------------
    function createCard() {
      var name = el('input', {type: 'text', placeholder: 'e.g. sales', autocomplete: 'off', style: 'width:100%'});
      var b = el('button', {class: 'primary', text: 'Create team'});
      function create() {
        var team = name.value.trim().toLowerCase();
        if (!team) return name.focus();
        admin.act(b, 'team-create', {team: team}, 'Created team ' + team, function (r) {
          return [['Lakehouse ' + r.catalog + ' (bronze / silver / gold) and bucket ' + r.bucket + '. Now add its members.']];
        }, function () { history.replaceState(null, '', '#teams/' + team + '/add'); tab = 'teams'; load(); });
      }
      b.addEventListener('click', create);
      name.addEventListener('keydown', function (e) { if (e.key === 'Enter') create(); });
      return el('div', {class: 'card', style: 'max-width:520px'}, [el('h3', {text: 'New team'}),
        el('label', {style: 'display:flex; flex-direction:column; gap:5px; font-size:.84rem; color:var(--muted)'}, ['Team name (a-z, 0-9)', name]),
        el('div', {class: 'sub', style: 'margin-top:10px', text: 'Creates the team\'s lakehouse team_<name> (bronze / silver / gold) and its bucket. Add members next.'}),
        el('div', {class: 'row', style: 'margin-top:14px'}, [b])]);
    }

    // ---- one team --------------------------------------------------------------------------
    function teamView(t, section) {
      var inTeam = {}; t.members.forEach(function (u) { inTeam[u] = true; });
      var back = el('a', {href: '#teams', style: 'font-size:.88rem; color:var(--muted)', text: '← All teams'});
      back.addEventListener('click', function (x) { x.preventDefault(); go('teams'); });
      var subs = [['members', 'Members (' + t.members.length + ')'], ['add', 'Add members'], ['delete', 'Delete team']];
      var nav = el('div', {class: 'tabs', style: 'margin-top:4px'}, subs.map(function (x) {
        var a = el('a', {class: x[0] === section ? 'on' : '', text: x[1], style: 'cursor:pointer'});
        a.addEventListener('click', function () { go('teams/' + t.team + '/' + x[0]); });
        return a;
      }));
      var body = section === 'add' ? addBox(t, inTeam) : section === 'delete' ? deleteCard(t) : membersBox(t);
      return [el('div', {}, [back]),
        el('div', {style: 'display:flex; align-items:baseline; gap:12px; flex-wrap:wrap'}, [el('h2', {style: 'margin:0; font-size:1.2rem', text: t.team}),
          el('span', {class: 'sub'}, ['lakehouse ', el('code', {text: t.catalog}), ' · bucket ', el('code', {text: t.bucket})])]),
        el('div', {class: 'stat-row'}, [stat(t.members.length, 'members'), stat(t.bucket_mb == null ? '—' : t.bucket_mb + ' MB', 'team bucket')]),
        nav, body];
    }

    function deleteCard(t) {
      if (t.members.length) return el('div', {class: 'card'}, [el('h3', {text: 'Delete team'}),
        el('div', {class: 'sub', text: t.team + ' still has ' + t.members.length + ' member(s) — remove them (Members) or move them to another team first.'})]);
      var del = el('button', {class: 'danger', text: 'Delete ' + t.team});
      del.addEventListener('click', function () {
        if (!del.dataset.armed) { del.dataset.armed = '1'; del.textContent = 'Yes — delete its tables and files too'; return; }
        admin.act(del, 'team-delete', {team: t.team}, 'Deleted team ' + t.team, function (r) {
          return [['Its lakehouse team_' + r.team + ' (' + r.dropped + ' table(s)/view(s)) and bucket ' + r.bucket + ' are gone.']];
        }, function () { history.replaceState(null, '', '#teams'); load(); });
      });
      return el('div', {class: 'card', style: 'border-color:#f1b5b0'}, [el('h3', {text: 'Delete team'}),
        el('div', {class: 'sub', style: 'margin-bottom:12px', text: 'Removes the team\'s lakehouse (every table in it) and its bucket. This cannot be undone.'}),
        el('div', {class: 'row'}, [del])]);
    }

    // Add members: type to search, click (or ↑ ↓ Enter) to pick, then add them all at once
    function addBox(t, inTeam) {
      var picked = [];
      var q = el('input', {type: 'text', class: 'wide', placeholder: 'search members to add…', autocomplete: 'off'});
      var drop = el('div', {class: 'drop', hidden: ''});
      var chips = el('div', {style: 'margin-top:8px'});
      var go = el('button', {class: 'primary', text: 'Add'});
      var hits = [], at = 0;
      function teamOf(u) { for (var i = 0; i < people.length; i++) if (people[i].user === u) return people[i].team; }
      function search() {
        var s = q.value.trim().toLowerCase();
        hits = !s ? [] : people.filter(function (p) {
          return !inTeam[p.user] && picked.indexOf(p.user) < 0 && p.user.indexOf(s) >= 0;
        }).slice(0, 30);
        at = 0; paintDrop(s);
      }
      function paintDrop(s) {
        drop.innerHTML = '';
        if (!s) { drop.hidden = true; return; }
        if (!hits.length) drop.appendChild(el('div', {class: 'from', text: 'No member matches “' + s + '” (or they are already in ' + t.team + ').'}));
        hits.forEach(function (p, i) {
          var d = el('div', {class: i === at ? 'on' : ''}, [el('span', {text: p.user}),
            el('span', {class: 'from', text: p.team ? 'in ' + p.team : 'no team yet'})]);
          d.addEventListener('mousedown', function (e) { e.preventDefault(); pick(p.user); });
          drop.appendChild(d);
        });
        drop.hidden = false;
      }
      function pick(u) { picked.push(u); q.value = ''; search(); paintChips(); q.focus(); }
      function paintChips() {
        chips.innerHTML = '';
        picked.forEach(function (u) {
          var x = el('button', {class: 'small', text: '✕', title: 'Not this one'});
          x.addEventListener('click', function () { picked.splice(picked.indexOf(u), 1); paintChips(); });
          chips.appendChild(el('span', {class: 'chip'}, [u + (teamOf(u) ? ' (from ' + teamOf(u) + ')' : ''), x]));
        });
        go.textContent = picked.length ? 'Add ' + picked.length + (picked.length === 1 ? ' member' : ' members') : 'Add';
        go.disabled = !picked.length;
      }
      q.addEventListener('input', search);
      q.addEventListener('blur', function () { drop.hidden = true; });
      q.addEventListener('focus', search);
      q.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault(); if (!hits.length) return;
          at = (at + (e.key === 'ArrowDown' ? 1 : hits.length - 1)) % hits.length; paintDrop(q.value.trim().toLowerCase());
        } else if (e.key === 'Enter') {
          if (hits[at]) pick(hits[at].user); else if (picked.length && !q.value.trim()) go.click();
        } else if (e.key === 'Escape') { drop.hidden = true; }
      });
      go.addEventListener('click', function () {
        if (!picked.length) return;
        admin.act(go, 'team-add', {team: t.team, users: picked.slice()}, 'Added to ' + t.team, function (r) {
          var lines = [r.moved.length + ' member(s) now read and write team_' + r.team + ': ' +
            r.moved.map(function (m) { return m.user + (m.from.length ? ' (from ' + m.from.join(', ') + ')' : ''); }).join(', ') +
            '. In Jupyter from their next server start.'];
          r.failed.forEach(function (f) { lines.push('Not moved: ' + f.user + ' — ' + f.error); });
          return [lines];
        }, load);
      });
      paintChips();
      return el('div', {class: 'card'}, [el('h3', {text: 'Add members to ' + t.team}),
        el('div', {class: 'sub', style: 'margin-bottom:10px', text: 'Search, pick one or more, then add them. Someone in another team moves here.'}),
        el('div', {class: 'row', style: 'flex-wrap:nowrap; align-items:flex-start'}, [el('div', {class: 'picker'}, [q, drop]), go]),
        chips]);
    }

    // Members: filter, tick, remove the ticked ones (out of the team: only their own lakehouse)
    function membersBox(t) {
      var canRemove = true;
      var ticked = {};
      var f = el('input', {type: 'text', placeholder: 'filter members…', autocomplete: 'off'});
      var count = el('span', {class: 'sub'});
      var rm = el('button', {class: 'small danger', text: 'Remove selected', hidden: ''});
      var all = el('input', {type: 'checkbox', title: 'Select all shown'});
      var body = el('tbody');
      var shown = [];
      function paint() {
        var s = f.value.trim().toLowerCase();
        shown = t.members.filter(function (u) { return u.indexOf(s) >= 0; });
        body.innerHTML = '';
        if (!shown.length) body.appendChild(el('tr', {}, [el('td', {class: 'sub', colspan: '3',
          text: t.members.length ? 'No member matches.' : 'No members yet — add them on Add members.'})]));
        shown.forEach(function (u) {
          var cb = el('input', {type: 'checkbox'}); cb.checked = !!ticked[u];
          cb.addEventListener('change', function () { if (cb.checked) ticked[u] = true; else delete ticked[u]; tally(); });
          var x = canRemove ? el('button', {class: 'small', text: 'Remove', title: 'Out of ' + t.team + ' (keeps their own lakehouse)'}) : null;
          if (x) x.addEventListener('click', function () { remove([u], x); });
          body.appendChild(el('tr', {}, [canRemove ? el('td', {style: 'width:28px'}, [cb]) : null,
            el('td', {}, [el('b', {text: u})]), el('td', {class: 'r'}, [x])]));
        });
        count.textContent = (s ? shown.length + ' of ' : '') + t.members.length + (t.members.length === 1 ? ' member' : ' members');
        tally();
      }
      function tally() {
        var n = Object.keys(ticked).length;
        rm.hidden = !n; rm.textContent = 'Remove selected (' + n + ')';
        all.checked = shown.length > 0 && shown.every(function (u) { return ticked[u]; });
      }
      function remove(users, btn) {
        admin.act(btn, 'team-remove', {users: users}, 'Removed from ' + t.team, function (r) {
          var lines = [r.moved.length + ' member(s) out of ' + t.team + ': ' + r.moved.map(function (m) { return m.user; }).join(', ') +
            '. They keep their own lakehouse; their tables in team_' + t.team + ' stay there.'];
          r.failed.forEach(function (x) { lines.push('Not moved: ' + x.user + ' — ' + x.error); });
          return [lines];
        }, load);
      }
      all.addEventListener('change', function () {
        shown.forEach(function (u) { if (all.checked) ticked[u] = true; else delete ticked[u]; }); paint();
      });
      rm.addEventListener('click', function () { remove(Object.keys(ticked), rm); });
      f.addEventListener('input', paint);
      var thead = el('thead', {}, [el('tr', {}, [canRemove ? el('th', {style: 'width:28px'}, [all]) : null, el('th', {text: 'Member'}), el('th', {})])]);
      paint();
      return el('div', {class: 'card'}, [el('h3', {text: 'Members'}),
        el('div', {class: 'bar'}, [el('div', {class: 'row'}, [f, count]), rm]),
        el('div', {class: 'scroll'}, [el('table', {}, [thead, body])])]);
    }

    // ---- page -----------------------------------------------------------------------------
    function route() {
      if (tab === 'create') return admin.fill([createCard()]);
      var m = /^teams\/([a-z0-9-]+)(?:\/(\w+))?/.exec(location.hash.slice(1));
      var t = m && teams.filter(function (x) { return x.team === m[1]; })[0];
      admin.fill(t ? teamView(t, m[2] || 'members') : [listCard()]);
    }
    function load() {
      return Promise.all([admin.api('GET', '/api/admin/teams'), admin.api('GET', '/api/admin/people')]).then(function (r) {
        teams = r[0].teams; people = r[1].people;
        var nav = document.querySelectorAll('.pagebar .tabs a');              // a create lands on the team: All teams tab
        nav.forEach(function (a) { a.className = a.getAttribute('href') === '#' + tab ? 'on' : ''; });
        route();
      }).catch(admin.failed);
    }
    load();
  </script>
</body>
</html>
