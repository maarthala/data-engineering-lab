# =============================================================================
# de-stack — values
# Service names intentionally match the compose service names so the embedded
# config files resolve (storage, hive-metastore, trino, iceberg-rest, ...).
# =============================================================================
# Admin / service passwords are NOT in this file: they live in the Secret below, created once
# with random values by k8s/create-secrets.sh (the deploy playbook runs it). The platform
# manager reads one with:
#   kubectl -n de-stack get secret de-stack-secrets -o jsonpath='{.data.<key>}' | base64 -d
secrets:
  name: de-stack-secrets

global:
  # Registry holding our custom images (push with helm/de-stack/push-images.sh).
  imageRegistry: ghcr.io/maarthala/de-stack
  storageClass: microk8s-hostpath
  imagePullPolicy: IfNotPresent

# Git integration — read-only git-sync of ONE shared repo into Airflow (DAGs + src)
# and Jupyter (workspace). Devs clone/edit/push locally with their own creds; the
# cluster only READS via HTTPS + a read-only token (deploy keys are disabled by the
# org policy, so we use a fine-grained PAT / GitHub App token instead).
# Create the token Secret with:
#   kubectl -n de-stack create secret generic de-stack-git-token --from-literal=token=<PAT>
git:
  enabled: true              # requires the tokenSecret to exist (see below)
  repoUrl: "https://github.com/dev-epireum-com/de-lab.git"  # HTTPS
  branch: main
  dagsPath: dags             # subdir in the repo holding Airflow DAGs
  srcPath: src               # subdir added to PYTHONPATH (shared library code)
  syncPeriodSeconds: 30
  username: x-access-token   # GitHub PAT: any non-empty value; App token: x-access-token
  tokenSecret: de-stack-git-token  # Secret with the token under key "token"
  image: registry.k8s.io/git-sync/git-sync:v4.4.0
  # Jupyter auto-push on save: instead of the read-only git-sync mount, Jupyter
  # clones the repo into a WRITABLE dir and pushes every save. Requires the
  # tokenSecret PAT to have WRITE (contents:write) scope. Airflow keeps using
  # the read-only git-sync sidecar for DAGs regardless of this flag.
  autopush: true

ingress:
  enabled: true
  className: public          # MicroK8s nginx ingress addon IngressClass
  # UIs are exposed as <service>.<baseHost>. A Pi-hole wildcard
  # (address=/de.lan/<node-ip>) resolves them all with no per-service records.
  baseHost: de.lan

# ------------------------------------------------------------------ commodity
postgres:
  enabled: true
  # Point the "postgres" Service at an external DB (IP) instead of running one
  # in-cluster. Empty string = run the in-cluster Deployment (default: self-contained).
  # Set to an IP (e.g. "192.168.1.3") to use an external Postgres instead.
  external: ""
  # Postgres 18: a fresh PVC is required — PG can't open a data dir from an older
  # major (15). PGDATA is set explicitly in the template, so the PG18 image's new
  # default layout (/var/lib/postgresql/18/docker) doesn't apply.
  image: postgres:18
  storage: 5Gi
  user: postgres            # password: secret key postgres-password

redis:
  enabled: true
  image: redis:8.10.1

storage:
  enabled: true
  # Object storage — service `storage` (http://storage:9000), implementation RustFS
  # (S3-compatible, Apache-2.0). Console (Keycloak SSO, each learner sees only their own
  # bucket) at storage.<baseHost>.
  image: rustfs/rustfs:1.0.0
  mcImage: ghcr.io/maarthala/de-stack/mc:RELEASE.2025-08-13T08-35-41Z   # admin client (works with RustFS)
  storage: 20Gi
  rootUser: admin            # password: secret key storage-root-password
  learnerQuotaMB: 100        # each learner's bucket <user>-lake (hard limit)

# ------------------------------------------------------------------ lakehouse
# Apache Polaris — Iceberg-native governed catalog (the live governance solution).
# Persistence in Postgres (db polarisdb), object storage with static creds. Console
# UI is a local build. Images are imported to the node (kubelet pulls corrupt
# containerd snapshots on this LXC):
#   docker save apache/polaris:latest | ssh sysadmin@<node> microk8s images import /dev/stdin
vault:
  enabled: true
  # The lab's key vault (OpenBao, stock image): "My secrets" + lab_secret(). Data in Postgres
  # (database vault); keys pg-vault-password, vault-unseal-key, vault-admin-token in the Secret.
  image: openbao/openbao:2.6.4
polaris:
  enabled: true
  image: apache/polaris:1.8.0
  adminImage: apache/polaris-admin-tool:1.8.0
  consoleImage: ghcr.io/maarthala/de-stack/polaris-console:20261001-2   # upstream + lab SSO (Dockerfile.polaris-console)

trino:
  enabled: true
  image: trinodb/trino:483

# AdventureWorks OLTP sample DB — loaded into the in-cluster Postgres by a one-shot
# Job (downloads the MS CSVs + the community Postgres port, ruby-fixes, loads), and
# exposed as a Trino catalog. Query it from Trino/SQLPad/Superset.
adventureworks:
  enabled: true
  loaderImage: ruby:3.3-slim   # has ruby; the Job apt-installs curl/unzip/postgresql-client

# ------------------------------------------------------------------ compute
spark:
  enabled: true
  repo: spark
  tag: latest
  workers: 1
  # Pin spark-master/worker to specific node(s). Empty = schedule anywhere.
  # e.g. { de-stack/spark: "true" } after labelling a dedicated node.
  nodeSelector: {}

# Spark Connect server (reuses the spark image) — the gRPC engine that the thin
# Jupyter client drives at sc://spark-connect:15002.
sparkConnect:
  enabled: true

# ------------------------------------------------------------------ orchestration / apps
airflow:
  enabled: true
  # Slim image (no baked-in Spark); Spark jobs run in separate pods via
  # KubernetesPodOperator. Much smaller/faster to schedule than the fat image.
  repo: airflow-slim
  tag: "20261013-1"        # dated: re-importing :latest can leave the old image
  adminUser: airflow         # password: secret key airflow-admin-password
jupyter:
  enabled: true
  # JupyterHub: Keycloak login, one Jupyter pod per learner (KubeSpawner) with their own
  # lakehouse + a work volume; notebooks/, dags/ and dbt/ mirror to their bucket.
  repo: jupyter              # the single-user image (one pod per learner)
  # A dated tag, not :latest — re-importing :latest on the node left the OLD image behind the
  # tag (learner pods started without jupyter-entrypoint.sh). Bump it with every new build.
  tag: "20261013-1"
  hubImage: ghcr.io/maarthala/de-stack/jupyterhub:20261002-7
  userStorage: 1Gi           # per-learner work volume (PVC claim-<user>)
  userMemory: 1G
  userCpu: 1                 # CPU cap per learner pod
  hubStorage: 1Gi

# ------------------------------------------------------------------ UIs
superset:
  enabled: true
  repo: superset
  tag: "20261002-4"          # dated: re-importing :latest can leave the old image
  adminUser: admin           # password: secret key superset-admin-password
sqlpad:
  enabled: true
  image: sqlpad/sqlpad:7.5.7   # web SQL workbench (read+write) for Postgres (OLTP) + Trino (OLAP)
  adminEmail: admin@de.local # password: secret key sqlpad-admin-password
  storage: 1Gi
hue:
  enabled: false             # dropped — Superset's SQL Lab covers ad-hoc SQL
  repo: hue
  tag: latest
# ------------------------------------------------------------------ front door
# Keycloak (logins + self-registration, realm de-lab) guards the landing page through
# oauth2-proxy; home-api provisions each learner's own lakehouse on first login.
# Postgres needs a `keycloak` database (01_postgres-init.sql creates it on a fresh PVC).
keycloak:
  enabled: true
  image: quay.io/keycloak/keycloak:26.8.0
  adminUser: admin            # Keycloak admin console: http://auth.<baseHost>/admin
                              # password: secret key keycloak-admin-password
oauth2Proxy:
  image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
homeApi:
  image: ghcr.io/maarthala/de-stack/home-api:20261002-7   # dated tags: re-importing :latest can leave the old image
home:
  enabled: true
  # Plain nginx; the home-html ConfigMap supplies index.html (rewritten to the ingress
  # hosts). The course is NOT baked in — it's on GitHub Pages, linked from the landing page.
  image: ghcr.io/maarthala/de-stack/home:latest
