{{- if .Values.home.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: home-html
  labels: {{- include "de-stack.labels" . | nindent 4 }}
data:
  # Rewrite the compose localhost:<port> links to the *.{baseHost} ingress hosts.
  index.html: |
{{ .Files.Get "files/home/index.html"
   | replace "http://localhost:8001" (printf "http://airflow.%s" .Values.ingress.baseHost)
   | replace "http://localhost:8002" (printf "http://spark.%s" .Values.ingress.baseHost)
   | replace "http://localhost:8004" (printf "http://superset.%s" .Values.ingress.baseHost)
   | replace "http://localhost:8003" (printf "http://sqlpad.%s" .Values.ingress.baseHost)
   | replace "http://localhost:8007" (printf "http://trino.%s" .Values.ingress.baseHost)
   | replace "http://localhost:8008" (printf "http://jupyter.%s" .Values.ingress.baseHost)
   | replace "http://localhost:8189" (printf "http://polaris-console.%s" .Values.ingress.baseHost)
   | replace "http://localhost:9001" (printf "http://storage.%s" .Values.ingress.baseHost)
   | replace "start it in make status (s)" "turn it on in Manage → ⚙️ Settings → Services"
   | indent 4 }}
  files.html: |
{{ .Files.Get "files/home/files.html" | indent 4 }}
  catalogs.html: |
{{ .Files.Get "files/home/catalogs.html" | indent 4 }}
  manage.html: |
{{ .Files.Get "files/home/manage.html" | indent 4 }}
  teams.html: |
{{ .Files.Get "files/home/teams.html" | indent 4 }}
  activity.html: |
{{ .Files.Get "files/home/activity.html" | indent 4 }}
  settings.html: |
{{ .Files.Get "files/home/settings.html" | indent 4 }}
  admin.js: |
{{ .Files.Get "files/home/admin.js" | indent 4 }}
  admin.css: |
{{ .Files.Get "files/home/admin.css" | indent 4 }}
  secrets.html: |
{{ .Files.Get "files/home/secrets.html" | indent 4 }}
  variables.html: |
{{ .Files.Get "files/home/variables.html" | indent 4 }}
  exams.html: |
{{ .Files.Get "files/home/exams.html" | indent 4 }}
  exams-admin.html: |
{{ .Files.Get "files/home/exams-admin.html" | indent 4 }}
  tool.html: |
{{ .Files.Get "files/home/tool.html" | indent 4 }}
  lab-header.js: |
{{ .Files.Get "files/home/lab-header.js" | indent 4 }}
  default.conf: |
{{ .Files.Get "files/home/default.conf" | indent 4 }}
binaryData:
  epireum-logo.png: {{ .Files.Get "files/home/img/epireum-logo.png" | b64enc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "home") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "home") | nindent 8 }}
    spec:
      containers:
        - name: nginx
          image: {{ .Values.home.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 80 }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
            - { name: html, mountPath: /usr/share/nginx/html/files.html, subPath: files.html }
            - { name: html, mountPath: /usr/share/nginx/html/catalogs.html, subPath: catalogs.html }
            - { name: html, mountPath: /usr/share/nginx/html/manage.html, subPath: manage.html }
            - { name: html, mountPath: /usr/share/nginx/html/teams.html, subPath: teams.html }
            - { name: html, mountPath: /usr/share/nginx/html/activity.html, subPath: activity.html }
            - { name: html, mountPath: /usr/share/nginx/html/settings.html, subPath: settings.html }
            - { name: html, mountPath: /usr/share/nginx/html/admin.js, subPath: admin.js }
            - { name: html, mountPath: /usr/share/nginx/html/admin.css, subPath: admin.css }
            - { name: html, mountPath: /usr/share/nginx/html/secrets.html, subPath: secrets.html }
            - { name: html, mountPath: /usr/share/nginx/html/variables.html, subPath: variables.html }   # → secrets.html
            - { name: html, mountPath: /usr/share/nginx/html/lab-header.js, subPath: lab-header.js }
            - { name: html, mountPath: /usr/share/nginx/html/exams.html, subPath: exams.html }
            - { name: html, mountPath: /usr/share/nginx/html/exams-admin.html, subPath: exams-admin.html }
            - { name: html, mountPath: /usr/share/nginx/html/tool.html, subPath: tool.html }
            - { name: html, mountPath: /usr/share/nginx/html/img/epireum-logo.png, subPath: epireum-logo.png }
            # bigger header limit: oauth2-proxy forwards the session + sign-in cookies
            - { name: html, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
      volumes:
        - { name: html, configMap: { name: home-html } }
---
apiVersion: v1
kind: Service
metadata:
  name: home
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "home") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: 80 }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home
  labels: {{- include "de-stack.labels" . | nindent 4 }}
  {{- if .Values.keycloak.enabled }}
  annotations:
    # oauth2-proxy's session cookie (holds the tokens) is bigger than nginx's default
    # 4k header buffer → "upstream sent too big header" / 502 right after login.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              {{- if .Values.keycloak.enabled }}
              service: { name: oauth2-proxy, port: { number: 4180 } }
              {{- else }}
              service: { name: home, port: { number: 80 } }
              {{- end }}
{{- end }}
{{- if .Values.keycloak.enabled }}
---
# home-api — "who am I" for the landing page + creates the learner's own lakehouse on
# first login (bucket <name>-lake with quota + storage policy, Polaris catalog, principal,
# grants, SQLPad account); serves My files and My catalogs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-api
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "home-api") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "home-api") | nindent 8 }}
      annotations:
        {{- include "de-stack.labChecksum" . | nindent 8 }}
    spec:
      serviceAccountName: home-api        # may update the trino-access ConfigMap (Trino's rules)
      initContainers:
        # the portal's database + login ("📝 Mock exams"; Postgres' init scripts only run on an empty
        # volume); members' PostgreSQL login `learner` may not connect to it
        - name: portal-db
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGUSER, value: "{{ .Values.postgres.user }}" }
            - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: postgres-password } } }
            - { name: PG_PORTAL_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: pg-portal-password } } }
          command:
            - sh
            - -c
            - |
              until pg_isready -q; do sleep 2; done
              if psql -tAc "SELECT 1 FROM pg_roles WHERE rolname = 'portal'" | grep -q 1; then
                psql -qc "ALTER USER portal WITH PASSWORD '$PG_PORTAL_PASSWORD'"
              else
                psql -qc "CREATE USER portal WITH PASSWORD '$PG_PORTAL_PASSWORD'"
              fi
              psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'portal'" | grep -q 1 || psql -qc "CREATE DATABASE portal OWNER portal"
              psql -qc "REVOKE CONNECT ON DATABASE portal FROM PUBLIC"
      containers:
        - name: home-api
          image: {{ .Values.homeApi.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: POLARIS_URL, value: "http://polaris:8181" }
            - { name: LEARNER_QUOTA_MB, value: {{ .Values.storage.learnerQuotaMB | quote }} }   # each learner's bucket <user>-lake
            # ⚙️ Settings shows these until a manager changes them (same values as the Hub's)
            - { name: HUB_IDLE_TIMEOUT, value: {{ .Values.jupyter.idleTimeout | default 900 | quote }} }
            - { name: SINGLEUSER_MEM, value: {{ .Values.jupyter.userMemory | quote }} }
            - { name: SINGLEUSER_CPU, value: {{ .Values.jupyter.userCpu | quote }} }
            # platform logins (provisioning): storage root, Polaris root, the Trino principal
            - { name: AWS_ACCESS_KEY_ID, value: {{ .Values.storage.rootUser | quote }} }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: storage-root-password } } }
            - { name: POLARIS_ROOT_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: polaris-root-secret } } }
            - { name: TRINO_LAB_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: trino-lab-secret } } }
            - { name: POLARIS_ADMIN, value: "root:$(POLARIS_ROOT_SECRET)" }
            - { name: TRINO_POLARIS_LOGIN, value: "trino_lab:$(TRINO_LAB_SECRET)" }
            - { name: SQLPAD_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: sqlpad-admin-password } } }
            - { name: SQLPAD_ADMIN, value: "{{ .Values.sqlpad.adminEmail }}:$(SQLPAD_ADMIN_PASSWORD)" }   # invites learners to SQLPad
            - { name: TRINO_RULES_CONFIGMAP, value: trino-access }   # Trino's access rules, kept in step with Polaris
            # ⚙️ Settings → Services: managers turn units off/on (scale to 0/1); stopped tools' tiles grey
            # the release deployed (its vX.Y.Z tag; ansible sets it) — managers get a "newer release" banner
            - { name: LAB_VERSION, value: {{ .Values.labVersion | default "" | quote }} }
            - { name: LAB_UNITS, value: "SQL=trino,sqlpad;Notebooks=jupyterhub;Spark=spark-master,spark-worker,spark-connect;Airflow=airflow,airflow-parser;Superset=superset;Polaris console=polaris-console" }
            - { name: LAB_SERVICES, value: "jupyter=jupyterhub:8000,spark=spark-master:8080,sqlpad=sqlpad:3000,airflow=airflow-apiserver:8080,superset=superset:8088,governance=polaris-console:8080" }
            # "Manage members" (managers only): Keycloak admin + a JupyterHub service token
            - { name: KEYCLOAK_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: keycloak-admin-password } } }
            - { name: KEYCLOAK_ADMIN, value: "{{ .Values.keycloak.adminUser }}:$(KEYCLOAK_ADMIN_PASSWORD)" }
            - { name: HUB_ADMIN_TOKEN, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: hub-admin-token } } }
            - { name: AIRFLOW_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: airflow-admin-password } } }
            - { name: AIRFLOW_ADMIN, value: "{{ .Values.airflow.adminUser }}:$(AIRFLOW_ADMIN_PASSWORD)" }   # delete tidies the member's Airflow role / history
            # "My secrets" — the key vault (vault.yaml)
            {{- if .Values.vault.enabled }}
            - { name: VAULT_ADDR, value: http://vault:8200 }
            - { name: VAULT_ADMIN_TOKEN, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: vault-admin-token } } }
            {{- end }}
            # "📝 Mock exams" — the portal's own database (the portal-db init container makes it)
            - { name: PG_PORTAL_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: pg-portal-password } } }
            - { name: PORTAL_DB_URL, value: "postgresql://portal:$(PG_PORTAL_PASSWORD)@postgres:5432/portal" }
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
          volumeMounts:   # lab code + starter files from the lab-code / lab-seed ConfigMaps
            - { name: lab-code, mountPath: /app/lakehouse.py, subPath: lakehouse.py }
            - { name: lab-code, mountPath: /app/app.py, subPath: home-api.py }
            - { name: lab-code, mountPath: /app/labadmin.py, subPath: labadmin.py }
            - { name: lab-code, mountPath: /app/labvault.py, subPath: labvault.py }
            - { name: lab-code, mountPath: /app/labexams.py, subPath: labexams.py }
            - { name: lab-code, mountPath: /app/exam_demo.json, subPath: exam_demo.json }
            - { name: lab-seed, mountPath: /app/seed }
      volumes:
        - { name: lab-code, configMap: { name: lab-code } }
        {{- include "de-stack.labSeedVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: home-api
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "home-api") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: 8000 }
---
# oauth2-proxy — guards the landing page with the Keycloak login (realm de-lab).
# Browser-facing issuer/login on auth.<baseHost>; token + keys via the keycloak Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "oauth2-proxy") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "oauth2-proxy") | nindent 8 }}
    spec:
      containers:
        - name: oauth2-proxy
          image: {{ .Values.oauth2Proxy.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: OAUTH2_PROXY_HTTP_ADDRESS, value: "0.0.0.0:4180" }
            - { name: OAUTH2_PROXY_PROVIDER, value: keycloak-oidc }
            - { name: OAUTH2_PROXY_CLIENT_ID, value: de-lab-home }
            - { name: OAUTH2_PROXY_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: oidc-home-secret } } }
            - { name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD, value: S256 }
            - { name: OAUTH2_PROXY_OIDC_ISSUER_URL, value: "http://auth.{{ .Values.ingress.baseHost }}/realms/de-lab" }
            - { name: OAUTH2_PROXY_SKIP_OIDC_DISCOVERY, value: "true" }
            - { name: OAUTH2_PROXY_LOGIN_URL, value: "http://auth.{{ .Values.ingress.baseHost }}/realms/de-lab/protocol/openid-connect/auth" }
            - { name: OAUTH2_PROXY_REDEEM_URL, value: "http://keycloak:8080/realms/de-lab/protocol/openid-connect/token" }
            - { name: OAUTH2_PROXY_OIDC_JWKS_URL, value: "http://keycloak:8080/realms/de-lab/protocol/openid-connect/certs" }
            - { name: OAUTH2_PROXY_REDIRECT_URL, value: "http://{{ .Values.ingress.baseHost }}/oauth2/callback" }
            - { name: OAUTH2_PROXY_UPSTREAMS, value: "http://home:80/,http://home-api:8000/api/" }
            - { name: OAUTH2_PROXY_PASS_USER_HEADERS, value: "true" }
            - { name: OAUTH2_PROXY_EMAIL_DOMAINS, value: "*" }
            - { name: OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL, value: "true" }
            - { name: OAUTH2_PROXY_OIDC_EMAIL_CLAIM, value: preferred_username }   # registration asks no email
            - { name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON, value: "true" }
            - { name: OAUTH2_PROXY_COOKIE_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: oauth2-cookie-secret } } }
            - { name: OAUTH2_PROXY_COOKIE_SECURE, value: "false" }
            - { name: OAUTH2_PROXY_COOKIE_NAME, value: _de_lab }
            # session (tokens) in Redis: the cookie holds only a ticket, so request headers stay small
            - { name: OAUTH2_PROXY_SESSION_STORE_TYPE, value: redis }
            - { name: OAUTH2_PROXY_REDIS_CONNECTION_URL, value: "redis://redis:6379/1" }
            # follow the Keycloak session: refreshed every minute, Keycloak refuses once it ended → login page
            - { name: OAUTH2_PROXY_COOKIE_REFRESH, value: 1m }
            - { name: OAUTH2_PROXY_COOKIE_EXPIRE, value: 12h }
            # one CSRF/PKCE cookie per login attempt (second tab / stale login page → 500 otherwise)
            - { name: OAUTH2_PROXY_COOKIE_CSRF_PER_REQUEST, value: "true" }
            - { name: OAUTH2_PROXY_COOKIE_CSRF_EXPIRE, value: 15m }
            - { name: OAUTH2_PROXY_WHITELIST_DOMAINS, value: "auth.{{ .Values.ingress.baseHost }}" }
          ports:
            - { name: http, containerPort: 4180 }
          readinessProbe:
            httpGet: { path: /ping, port: 4180 }
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "oauth2-proxy") | nindent 4 }}
  ports:
    - { name: http, port: 4180, targetPort: 4180 }
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: home-api
  labels: {{- include "de-stack.labels" . | nindent 4 }}
---
# home-api keeps Trino's access rules (ConfigMap trino-access) in step with Polaris — that one
# ConfigMap and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-api-trino-rules
  labels: {{- include "de-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["trino-access"]
    verbs: ["get", "patch"]
---
# ⚙️ Settings → Services: scale the units' Deployments to 0 / 1 — these, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: home-api-units
  labels: {{- include "de-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    resourceNames: [trino, sqlpad, jupyterhub, spark-master, spark-worker, spark-connect, airflow, airflow-parser, superset, polaris-console]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-api-units
  labels: {{- include "de-stack.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: home-api-units }
subjects:
  - { kind: ServiceAccount, name: home-api }      # namespace = the binding's own
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: home-api-trino-rules
  labels: {{- include "de-stack.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: home-api-trino-rules }
subjects:
  - { kind: ServiceAccount, name: home-api }      # namespace = the binding's own
{{- end }}
