{{- if .Values.jupyter.enabled }}
# JupyterHub — every learner signs in with the lab account (Keycloak) and gets their OWN
# Jupyter pod (KubeSpawner, pod jupyter-<user>, work volume claim-<user>) whose `iceberg`
# catalog is their own Polaris lakehouse; notebooks/ and dags/ mirror to their bucket.
# Same hub config as the local stack (jupyterhub_config.py, HUB_SPAWNER=kubernetes).
# The proxy (configurable-http-proxy) runs inside the hub pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jupyterhub
  labels: {{- include "de-stack.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jupyterhub-spawner
  labels: {{- include "de-stack.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "services", "secrets"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jupyterhub-spawner
  labels: {{- include "de-stack.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: jupyterhub
roleRef:
  kind: Role
  name: jupyterhub-spawner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterhub-data
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.jupyter.hubStorage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterhub
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "jupyterhub") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "jupyterhub") | nindent 8 }}
      annotations:
        {{- include "de-stack.labChecksum" . | nindent 8 }}
    spec:
      serviceAccountName: jupyterhub
      enableServiceLinks: false
      containers:
        - name: hub
          image: {{ .Values.jupyter.hubImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: HUB_SPAWNER, value: kubernetes }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: HUB_CONNECT_IP, value: jupyterhub }
            - { name: HUB_PUBLIC_URL, value: "http://jupyter.{{ .Values.ingress.baseHost }}" }
            - { name: KEYCLOAK_PUBLIC_URL, value: "http://auth.{{ .Values.ingress.baseHost }}" }
            - { name: KEYCLOAK_INTERNAL_URL, value: "http://keycloak:8080" }
            - { name: OAUTH_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: oidc-jupyterhub-secret } } }
            # encrypts the stored Keycloak tokens (auth_state) — lets the Hub follow the login
            - { name: JUPYTERHUB_CRYPT_KEY, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: jupyterhub-crypt-key } } }
            - { name: HUB_ADMIN_TOKEN, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: hub-admin-token } } }   # home-api's Manage members
            - { name: POLARIS_URL, value: "http://polaris:8181" }
            - { name: LEARNER_QUOTA_MB, value: {{ .Values.storage.learnerQuotaMB | quote }} }
            - { name: SINGLEUSER_IMAGE, value: {{ include "de-stack.image" (dict "root" $ "repo" .Values.jupyter.repo "tag" .Values.jupyter.tag) | quote }} }
            - { name: SINGLEUSER_PULL_POLICY, value: {{ .Values.global.imagePullPolicy }} }
            - { name: SINGLEUSER_MEM, value: {{ .Values.jupyter.userMemory | quote }} }
            - { name: SINGLEUSER_CPU, value: {{ .Values.jupyter.userCpu | quote }} }
            - { name: SINGLEUSER_STORAGE, value: {{ .Values.jupyter.userStorage | quote }} }
            - { name: SINGLEUSER_STORAGE_CLASS, value: {{ .Values.global.storageClass }} }
            # passed on to every learner pod
            - { name: SPARK_REMOTE, value: "sc://spark-connect:15002" }
            - { name: AWS_ACCESS_KEY_ID, value: "{{ .Values.storage.rootUser }}" }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: storage-root-password } } }
            - { name: POLARIS_ROOT_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: polaris-root-secret } } }
            - { name: TRINO_LAB_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: trino-lab-secret } } }
            - { name: POLARIS_ADMIN, value: "root:$(POLARIS_ROOT_SECRET)" }
            # each member's server gets its own vault token (lab_secret) — minted with this one
            {{- if .Values.vault.enabled }}
            - { name: VAULT_ADDR, value: http://vault:8200 }
            - { name: VAULT_ADMIN_TOKEN, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: vault-admin-token } } }
            {{- end }}
            - { name: TRINO_POLARIS_LOGIN, value: "trino_lab:$(TRINO_LAB_SECRET)" }
            - { name: SQLPAD_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: sqlpad-admin-password } } }
            - { name: SQLPAD_ADMIN, value: "{{ .Values.sqlpad.adminEmail }}:$(SQLPAD_ADMIN_PASSWORD)" }   # invites learners to SQLPad
            - { name: AWS_DEFAULT_REGION, value: "us-east-1" }
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: AWS_S3_ENDPOINT, value: "http://storage:9000" }
          ports:
            - { name: proxy, containerPort: 8000 }
            - { name: hub, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /hub/health, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { memory: 256Mi, cpu: 50m }
            limits:   { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /srv/jupyterhub/data }
            - { name: lab-code, mountPath: /srv/jupyterhub/lakehouse.py, subPath: lakehouse.py }
            - { name: lab-code, mountPath: /srv/jupyterhub/labvault.py, subPath: labvault.py }
            - { name: lab-code, mountPath: /srv/jupyterhub/jupyterhub_config.py, subPath: jupyterhub_config.py }
            - { name: lab-seed, mountPath: /srv/jupyterhub/seed }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: jupyterhub-data } }
        - { name: lab-code, configMap: { name: lab-code } }
        {{- include "de-stack.labSeedVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterhub
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "jupyterhub") | nindent 4 }}
  ports:
    - { name: proxy, port: 8000, targetPort: 8000 }
    - { name: hub, port: 8081, targetPort: 8081 }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter
  labels: {{- include "de-stack.labels" . | nindent 4 }}
  annotations:
    # notebooks/terminals use websockets; uploads can be large
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "512m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: jupyter.{{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: jupyterhub, port: { number: 8000 } }
{{- end }}
{{- end }}
