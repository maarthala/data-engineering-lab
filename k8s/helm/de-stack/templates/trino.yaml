{{- if .Values.trino.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  labels: {{- include "de-stack.labels" . | nindent 4 }}
data:
  config.properties: |
{{ .Files.Get "files/trino/config.properties" | indent 4 }}
  jvm.config: |
{{ .Files.Get "files/trino/jvm.config" | indent 4 }}
  access-control.properties: |
{{ .Files.Get "files/trino/access-control.properties" | indent 4 }}
---
# Who may query what. home-api rewrites rules.json from Polaris (owners, shares) through the
# Kubernetes API and re-applies it within 30 s when a chart apply resets it to this start value
# (only the platform's own users until then). Mounted as a directory so updates reach the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-access
  labels: {{- include "de-stack.labels" . | nindent 4 }}
data:
  rules.json: |
    {"catalogs": [{"user": "lab|manager|admin", "allow": "owner"}]}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
  labels: {{- include "de-stack.labels" . | nindent 4 }}
data:
  iceberg.properties: |
{{ .Files.Get "files/trino/catalog/iceberg.properties" | indent 4 }}
  shopflow.properties: |
{{ .Files.Get "files/trino/catalog/shopflow.properties" | indent 4 }}
{{- if .Values.adventureworks.enabled }}
  adventureworks.properties: |
{{ .Files.Get "files/trino/catalog/adventureworks.properties" | indent 4 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "trino") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "trino") | nindent 8 }}
    spec:
      containers:
        - name: trino
          image: {{ .Values.trino.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:   # read by the catalog files as ${ENV:…}
            - { name: POLARIS_ROOT_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: polaris-root-secret } } }
            - { name: STORAGE_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: storage-root-password } } }
          ports:
            - { name: http, containerPort: 8080 }
          volumeMounts:
            - { name: cfg, mountPath: /etc/trino/config.properties, subPath: config.properties }
            - { name: cfg, mountPath: /etc/trino/jvm.config, subPath: jvm.config }
            - { name: cfg, mountPath: /etc/trino/access-control.properties, subPath: access-control.properties }
            - { name: access, mountPath: /etc/trino/access }
            - { name: catalog, mountPath: /etc/trino/catalog/iceberg.properties, subPath: iceberg.properties }
            - { name: catalog, mountPath: /etc/trino/catalog/shopflow.properties, subPath: shopflow.properties }
{{- if .Values.adventureworks.enabled }}
            - { name: catalog, mountPath: /etc/trino/catalog/adventureworks.properties, subPath: adventureworks.properties }
{{- end }}
          readinessProbe:
            httpGet: { path: /v1/info, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - { name: cfg, configMap: { name: trino-config } }
        - { name: catalog, configMap: { name: trino-catalog } }
        - { name: access, configMap: { name: trino-access } }
---
# Learners don't talk to Trino directly: only the services that pass on who is signed in
# (SQLPad, Superset) and the platform's own (home-api, JupyterHub provisioning, cdc-runner's
# 🧹 table maintenance) may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trino-clients
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "trino") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [sqlpad, superset, home-api, jupyterhub, cdc-runner] }] }
      ports:
        - { port: 8080, protocol: TCP }
---
apiVersion: v1
kind: Service
metadata:
  name: trino
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "trino") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
# (no Ingress: the Trino UI is for the platform manager — kubectl port-forward svc/trino 8080)
{{- end }}
