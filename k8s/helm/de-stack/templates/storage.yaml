{{- if .Values.storage.enabled }}
# Object storage — S3-compatible, reached by every client as http://storage:9000 (root keys
# from .Values.storage). The implementation is RustFS (Apache-2.0); the generic name means it
# can be swapped for another S3 store without touching clients. Console at
# storage.<baseHost>/rustfs/console/ — "Login with Epireum lab account" (Keycloak client
# `storage`; the username is the `policy` claim → each learner's own policy = only
# <user>-lake, created by home-api / JupyterHub).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-data
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.storage.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "storage") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "storage") | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 10001                 # the image runs as rustfs (10001)
      initContainers:
        # hostpath volumes come up root-owned — hand /data to the rustfs user
        - name: data-perms
          image: {{ .Values.storage.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: { runAsUser: 0 }
          command: ["sh", "-c", "chown -R 10001:10001 /data"]
          volumeMounts:
            - { name: data, mountPath: /data }
      containers:
        - name: storage
          image: {{ .Values.storage.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: RUSTFS_VOLUMES, value: /data }
            - { name: RUSTFS_ADDRESS, value: "0.0.0.0:9000" }
            - { name: RUSTFS_CONSOLE_ADDRESS, value: "0.0.0.0:9001" }
            - { name: RUSTFS_CONSOLE_ENABLE, value: "true" }
            - { name: RUSTFS_ACCESS_KEY, value: {{ .Values.storage.rootUser | quote }} }
            - { name: RUSTFS_SECRET_KEY, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: storage-root-password } } }
            # Quotas fail closed until the usage scanner has counted a bucket (a new
            # learner's bucket refuses uploads until then). Lab data is tiny: scan every 10s.
            - { name: RUSTFS_SCANNER_CYCLE, value: "10" }
            {{- if .Values.storage.publicS3.enabled }}
            # bucket-in-hostname requests (https://<bucket>.<host>/key), as Snowflake sends them
            - { name: RUSTFS_SERVER_DOMAINS, value: {{ .Values.storage.publicS3.host | quote }} }
            {{- end }}
            {{- if .Values.keycloak.enabled }}
            # Console SSO. RustFS refuses outbound calls to private hosts unless allowed;
            # discovery goes to the internal Keycloak, tokens carry the PUBLIC issuer.
            - { name: RUSTFS_OUTBOUND_ALLOW_ORIGINS, value: "http://keycloak:8080" }
            - { name: RUSTFS_IDENTITY_OPENID_ENABLE, value: "on" }
            - { name: RUSTFS_IDENTITY_OPENID_CONFIG_URL, value: "http://keycloak:8080/realms/de-lab/.well-known/openid-configuration" }
            - { name: RUSTFS_IDENTITY_OPENID_ISSUER, value: "http://auth.{{ .Values.ingress.baseHost }}/realms/de-lab" }
            - { name: RUSTFS_IDENTITY_OPENID_CLIENT_ID, value: storage }
            - { name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: oidc-storage-secret } } }
            - { name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME, value: policy }
            - { name: RUSTFS_IDENTITY_OPENID_SCOPES, value: "openid,profile" }
            - { name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME, value: "Epireum lab account" }
            - { name: RUSTFS_BROWSER_REDIRECT_URL, value: "http://storage.{{ .Values.ingress.baseHost }}" }
            {{- end }}
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /health, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: storage-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: storage
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "storage") | nindent 4 }}
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storage-console
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: storage.{{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storage
                port: { number: 9001 }
{{- end }}
{{- with .Values.storage.publicS3 }}
{{- if .enabled }}
---
# Public S3 API: Let's Encrypt via DNS-01 through acme-dns (no GoDaddy API, no port 80).
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-s3
  labels: {{- include "de-stack.labels" $ | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .email }}
    privateKeySecretRef: { name: letsencrypt-s3-account }
    solvers:
      - dns01:
          acmeDNS:
            host: https://auth.acme-dns.io
            accountSecretRef: { name: {{ .acmeDnsSecret }}, key: acmedns.json }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: s3-public
  labels: {{- include "de-stack.labels" $ | nindent 4 }}
spec:
  secretName: s3-public-tls
  dnsNames: [{{ .host | quote }}, {{ printf "*.%s" .host | quote }}]
  issuerRef: { name: letsencrypt-s3, kind: Issuer }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storage-s3-public
  labels: {{- include "de-stack.labels" $ | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"          # S3 uploads of any size
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # the only ingress open to the internet; every *.<baseHost> UI is limited to the LAN by
    # the controller-wide whitelist-source-range (nginx-load-balancer-microk8s-conf)
    nginx.ingress.kubernetes.io/whitelist-source-range: "0.0.0.0/0"
spec:
  ingressClassName: {{ $.Values.ingress.className }}
  tls:
    - hosts: [{{ .host | quote }}, {{ printf "*.%s" .host | quote }}]
      secretName: s3-public-tls
  rules:
    {{- range list .host (printf "*.%s" .host) }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storage
                port: { number: 9000 }
    {{- end }}
{{- end }}
{{- end }}
---
# Seed the shared bucket (parity with the compose storage-init job).
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-init
  labels: {{- include "de-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "storage-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: {{ .Values.storage.mcImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: STORAGE_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: storage-root-password } } }
          command: ["/bin/sh", "-c"]
          args:
            - |
              until mc alias set m http://storage:9000 {{ .Values.storage.rootUser }} "$STORAGE_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "waiting for object storage..."; sleep 3;
              done
              mc mb --ignore-existing m/demo-bucket
              # learners' buckets <user>-lake (+ quota + own-bucket policy) are created by
              # home-api / JupyterHub on first login
              echo "buckets ready:"; mc ls m/
{{- end }}
