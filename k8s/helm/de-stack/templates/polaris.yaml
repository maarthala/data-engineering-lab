{{- if .Values.polaris.enabled }}
# Apache Polaris — Iceberg-native governed catalog (Trino + Spark), Postgres-backed.
# Mixed auth: Polaris client id/secret logins (root, pipelines, learner Spark sessions)
# AND Keycloak tokens (the Console's "Sign in with Epireum lab account").
# Replaces Unity Catalog as the live governance solution.
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-config
  labels: {{- include "de-stack.labels" . | nindent 4 }}
data:
  # Quarkus reads config/application.properties relative to the app (/deployments).
  application.properties: |
    polaris.realm-context.realms=POLARIS
    polaris.readiness.ignore-severe-issues=true
    quarkus.otel.sdk.disabled=true
    # persistence → Postgres (db polarisdb). database-type is set via env (below):
    # as a properties-file key it fails Quarkus config validation; the env source
    # is lenient, matching the working compose setup.
    polaris.persistence.type=relational-jdbc
    quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/polarisdb
    quarkus.datasource.username=polaris
    # quarkus.datasource.password: env QUARKUS_DATASOURCE_PASSWORD (secret pg-polaris-password)
    # object storage (static creds — no STS)
    polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=true
    polaris.features."ALLOW_NAMESPACE_CUSTOM_LOCATION"=true
    polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["FILE","S3"]
    # A learner's extra catalogs (My catalogs) live inside their bucket, which their main
    # lakehouse <user>_lake already covers — Polaris rejects that overlap unless allowed.
    polaris.features."ALLOW_OVERLAPPING_CATALOG_URLS"=true
{{- if .Values.keycloak.enabled }}
    # Mixed auth: Polaris' own client-id/secret logins AND Keycloak tokens. The token's
    # principal_name / principal_roles (= the username) select the learner's Polaris
    # principal + principal-role created at provisioning → their own lakehouse.
    polaris.authentication."POLARIS".type=mixed
    quarkus.oidc.tenant-enabled=true
    quarkus.oidc.auth-server-url=http://keycloak:8080/realms/de-lab
    quarkus.oidc.client-id=polaris
    # quarkus.oidc.credentials.secret: env QUARKUS_OIDC_CREDENTIALS_SECRET (secret oidc-polaris-secret)
    quarkus.oidc.roles.role-claim-path=principal_roles
    polaris.oidc.principal-mapper.name-claim-path=principal_name
    polaris.oidc.principal-roles-mapper.mappings[0].regex=(.+)
    polaris.oidc.principal-roles-mapper.mappings[0].replacement=PRINCIPAL_ROLE:$1
{{- else }}
    polaris.authentication.type=internal
    quarkus.oidc.tenant-enabled=false
{{- end }}
---
# One-shot: bootstrap the schema + realm into Postgres. Delete before re-apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "polaris-bootstrap") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: {{ .Values.polaris.adminImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: POLARIS_PERSISTENCE_TYPE, value: relational-jdbc }
            - { name: POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE, value: postgresql }
            - { name: QUARKUS_DATASOURCE_JDBC_URL, value: "jdbc:postgresql://postgres:5432/polarisdb" }
            - { name: QUARKUS_DATASOURCE_USERNAME, value: polaris }
            - { name: QUARKUS_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: pg-polaris-password } } }
            - { name: POLARIS_ROOT_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: polaris-root-secret } } }
          args: ["bootstrap", "--realm=POLARIS", "--credential=POLARIS,root,$(POLARIS_ROOT_SECRET)"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "polaris") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "polaris") | nindent 8 }}
    spec:
      containers:
        - name: polaris
          image: {{ .Values.polaris.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 8181 }
            - { name: mgmt, containerPort: 8182 }
          env:
            - { name: AWS_REGION, value: "us-east-1" }
            - { name: AWS_ACCESS_KEY_ID, value: "{{ .Values.storage.rootUser }}" }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: storage-root-password } } }
            - { name: QUARKUS_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: pg-polaris-password } } }
            - { name: QUARKUS_OIDC_CREDENTIALS_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: oidc-polaris-secret } } }
            # lenient env source (unmapped keys ignored) — declares the JDBC dialect
            - { name: POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE, value: postgresql }
          volumeMounts:
            - { name: cfg, mountPath: /deployments/config/application.properties, subPath: application.properties }
          readinessProbe:
            httpGet: { path: /q/health, port: 8182 }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - { name: cfg, configMap: { name: polaris-config } }
---
apiVersion: v1
kind: Service
metadata:
  name: polaris
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "polaris") | nindent 4 }}
  ports:
    - { name: http, port: 8181, targetPort: 8181 }
    - { name: mgmt, port: 8182, targetPort: 8182 }
{{- if .Values.ingress.enabled }}
---
# API on its own host (Spark/Trino/CLI hit this directly).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polaris
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: polaris.{{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: polaris, port: { number: 8181 } }
{{- end }}
{{- end }}
