{{- if .Values.sqlpad.enabled }}
# SQLPad — web SQL workbench for running ANY SQL (SELECT + INSERT/UPDATE/DELETE + DDL/MERGE)
# against the OLTP source (Postgres) and the OLAP lakehouse (Trino/Iceberg). Connections
# are pre-seeded via env. State (saved queries) persists on a small PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlpad-data
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.sqlpad.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlpad
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "sqlpad") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "sqlpad") | nindent 8 }}
    spec:
      # The Service is named "sqlpad", so k8s would inject SQLPAD_PORT=tcp://…:3000 etc.
      # SQLPad reads all SQLPAD_* env as config, so those service links break its port
      # binding — disable them.
      enableServiceLinks: false
      containers:
        - name: sqlpad
          image: {{ .Values.sqlpad.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: SQLPAD_PORT,           value: "3000" }
            - { name: SQLPAD_ADMIN,          value: "{{ .Values.sqlpad.adminEmail }}" }
            - { name: SQLPAD_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: sqlpad-admin-password } } }
            - { name: SQLPAD_APP_LOG_LEVEL,  value: "warn" }
            {{- if .Values.keycloak.enabled }}
            # Sign in with the lab account (Keycloak realm de-lab, client sqlpad); learners are
            # pre-created by home-api / JupyterHub on first lab login (see lakehouse.invite_sqlpad).
            - { name: PUBLIC_URL,                 value: "http://sqlpad.{{ .Values.ingress.baseHost }}" }
            - { name: SQLPAD_OIDC_ISSUER,         value: "http://keycloak:8080/realms/de-lab" }
            - { name: SQLPAD_OIDC_CLIENT_ID,      value: sqlpad }
            - { name: SQLPAD_OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: oidc-sqlpad-secret } } }
            - { name: SQLPAD_OIDC_SCOPE,          value: "openid profile" }
            - { name: SQLPAD_OIDC_LINK_HTML,      value: "Sign in with Epireum lab account" }
            {{- end }}
            - { name: SQLPAD_QUERY_RESULT_MAX_ROWS, value: "50000" }
            # OLTP — ShopFlow (Postgres)
            - { name: SQLPAD_CONNECTIONS__shopflow__name,     value: "ShopFlow — OLTP (Postgres)" }
            - { name: SQLPAD_CONNECTIONS__shopflow__driver,   value: "postgres" }
            - { name: SQLPAD_CONNECTIONS__shopflow__host,     value: "lab-db" }
            - { name: SQLPAD_CONNECTIONS__shopflow__port,     value: "5432" }
            - { name: SQLPAD_CONNECTIONS__shopflow__database, value: "shopflow" }
            - { name: SQLPAD_CONNECTIONS__shopflow__username, value: "learner" }
            - { name: SQLPAD_CONNECTIONS__shopflow__password, value: "learner" }
            # OLTP — AdventureWorks (Postgres)
            - { name: SQLPAD_CONNECTIONS__adventureworks__name,     value: "AdventureWorks — OLTP (Postgres)" }
            - { name: SQLPAD_CONNECTIONS__adventureworks__driver,   value: "postgres" }
            - { name: SQLPAD_CONNECTIONS__adventureworks__host,     value: "lab-db" }
            - { name: SQLPAD_CONNECTIONS__adventureworks__port,     value: "5432" }
            - { name: SQLPAD_CONNECTIONS__adventureworks__database, value: "adventureworks" }
            - { name: SQLPAD_CONNECTIONS__adventureworks__username, value: "learner" }
            - { name: SQLPAD_CONNECTIONS__adventureworks__password, value: "learner" }
{{- if .Values.labDb.enabled }}
            # Tidewell's live systems (lab-db, kept changing by cdc-sim; read only) — Capstone 3
            - { name: SQLPAD_CONNECTIONS__liveshop__name, value: "Tidewell web shop (Postgres)" }
            - { name: SQLPAD_CONNECTIONS__liveshop__driver, value: "postgres" }
            - { name: SQLPAD_CONNECTIONS__liveshop__host, value: "lab-db" }
            - { name: SQLPAD_CONNECTIONS__liveshop__port, value: "5432" }
            - { name: SQLPAD_CONNECTIONS__liveshop__database, value: "shop" }
            - { name: SQLPAD_CONNECTIONS__liveshop__username, value: "reader" }
            - { name: SQLPAD_CONNECTIONS__liveshop__password, value: "reader" }
            - { name: SQLPAD_CONNECTIONS__livestore__name, value: "Tidewell stores (Postgres)" }
            - { name: SQLPAD_CONNECTIONS__livestore__driver, value: "postgres" }
            - { name: SQLPAD_CONNECTIONS__livestore__host, value: "lab-db" }
            - { name: SQLPAD_CONNECTIONS__livestore__port, value: "5432" }
            - { name: SQLPAD_CONNECTIONS__livestore__database, value: "store" }
            - { name: SQLPAD_CONNECTIONS__livestore__username, value: "reader" }
            - { name: SQLPAD_CONNECTIONS__livestore__password, value: "reader" }
            - { name: SQLPAD_CONNECTIONS__liveloyalty__name, value: "Tidewell loyalty (Postgres)" }
            - { name: SQLPAD_CONNECTIONS__liveloyalty__driver, value: "postgres" }
            - { name: SQLPAD_CONNECTIONS__liveloyalty__host, value: "lab-db" }
            - { name: SQLPAD_CONNECTIONS__liveloyalty__port, value: "5432" }
            - { name: SQLPAD_CONNECTIONS__liveloyalty__database, value: "loyalty" }
            - { name: SQLPAD_CONNECTIONS__liveloyalty__username, value: "reader" }
            - { name: SQLPAD_CONNECTIONS__liveloyalty__password, value: "reader" }
{{- end }}
            # OLAP — Lakehouse (Trino / Iceberg)
          ports:
            - { name: http, containerPort: 3000 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/sqlpad }
          readinessProbe:
            httpGet: { path: /api/app, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: sqlpad-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: sqlpad
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "sqlpad") | nindent 4 }}
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sqlpad
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: sqlpad.{{ .Values.ingress.baseHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: sqlpad, port: { number: 3000 } }
{{- end }}
{{- end }}
