{{- if .Values.streaming.enabled }}
# The Streaming unit — 📡 Ingestion with Debezium (CDC_ENGINE=debezium) and 📨 Pub/Sub: Kafka (one
# broker, KRaft), one Kafka Connect worker and event-sim (members' event streams). cdc-runner makes each job's two connectors (a Debezium Postgres
# source, an Iceberg sink), pauses and resumes them. Off until needed: replicas from
# streaming.replicas (0), switched in Manage → ⚙️ Settings → Services (a chart apply sets it back).
#  kafka            the change stream of every job, kept 7 days, on its own volume
#  kafka-connect    the worker + its helper (connect_secrets.py): cdc-runner hands the helper the
#                   files a connector's ${dir:…} reads — passwords never sit in a connector's config
#  event-sim        publishes each member's 📨 Pub/Sub stream to their topic <member>.<name>
# Kafka listens twice: :9092 for the lab's own services (no login — super users), :9094 for members'
# notebooks and Spark (a SCRAM login each, made by cdc-runner; ACLs: their own topics / groups).
# NetworkPolicies below: only those services reach :9092, members' pods and Spark only :9094.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.global.storageClass }}
  resources:
    requests:
      storage: {{ .Values.streaming.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.streaming.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "kafka") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "kafka") | nindent 8 }}
    spec:
      enableServiceLinks: false          # KAFKA_* service variables would be read as broker settings
      automountServiceAccountToken: false
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: {{ .Values.streaming.kafkaImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093,MEMBERS://:9094" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092,MEMBERS://kafka:9094" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,MEMBERS:SASL_PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_LISTENER_NAME_MEMBERS_SASL_ENABLED_MECHANISMS, value: SCRAM-SHA-512 }
            - { name: KAFKA_LISTENER_NAME_MEMBERS_SCRAM___SHA___512_SASL_JAAS_CONFIG, value: "org.apache.kafka.common.security.scram.ScramLoginModule required;" }
            - { name: KAFKA_AUTHORIZER_CLASS_NAME, value: org.apache.kafka.metadata.authorizer.StandardAuthorizer }
            - { name: KAFKA_SUPER_USERS, value: "User:ANONYMOUS" }       # the no-login listeners: the lab's services, the controller
            - { name: KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND, value: "false" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1" }
            - { name: KAFKA_LOG_RETENTION_HOURS, value: "168" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m" }
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: members, containerPort: 9094 }
          resources:
            requests: { memory: 512Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: kafka-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "kafka") | nindent 4 }}
  ports:
    - { name: kafka, port: 9092, targetPort: 9092 }
    - { name: members, port: 9094, targetPort: 9094 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.streaming.replicas }}
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "kafka-connect") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "kafka-connect") | nindent 8 }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: kafka-connect
          image: {{ .Values.streaming.connectImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { name: rest, containerPort: 8083 }
          resources:
            requests: { memory: 768Mi }
            limits: { memory: 1536Mi }
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - { name: secrets, mountPath: /run/lab-secrets, readOnly: true }
        - name: secrets-helper
          image: {{ .Values.cdc.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "/app/connect_secrets.py"]
          env:
            - { name: CDC_SECRETS_TOKEN, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: connect-secrets-token } } }
          ports:
            - { name: secrets, containerPort: 8090 }
          resources:
            requests: { memory: 32Mi }
            limits: { memory: 96Mi }
          volumeMounts:
            - { name: secrets, mountPath: /run/lab-secrets }
            - { name: lab-code, mountPath: /app/connect_secrets.py, subPath: connect_secrets.py }
      volumes:
        - { name: secrets, emptyDir: { medium: Memory, sizeLimit: 8Mi } }   # never on disk
        - { name: lab-code, configMap: { name: lab-code } }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  selector: {{- include "de-stack.selector" (dict "app" "kafka-connect") | nindent 4 }}
  ports:
    - { name: rest, port: 8083, targetPort: 8083 }
    - { name: secrets, port: 8090, targetPort: 8090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-sim
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.streaming.replicas }}
  selector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "event-sim") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "de-stack.selector" (dict "app" "event-sim") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: event-sim
          image: {{ .Values.cdc.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "/app/event_sim.py"]
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
            - { name: EVENT_SIM_SHOP_DB, value: "postgresql://reader:reader@lab-db:5432/shop" }   # Tidewell's customers, products, stores
            - { name: PG_PORTAL_PASSWORD, valueFrom: { secretKeyRef: { name: {{ $.Values.secrets.name }}, key: pg-portal-password } } }
            - { name: PORTAL_DB_URL, value: "postgresql://portal:$(PG_PORTAL_PASSWORD)@postgres:5432/portal" }
          resources:
            requests: { memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
{{- range list "event_sim.py" "labpubsub.py" "labschema.py" }}
            - { name: lab-code, mountPath: /app/{{ . }}, subPath: {{ . }} }
{{- end }}
      volumes:
        - { name: lab-code, configMap: { name: lab-code } }
---
# :9092 — only the Streaming unit itself and cdc-runner (the broker too: it sends some transaction
# requests to itself through its service name); :9094 — members' notebooks and Spark, with a login …
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-clients
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "kafka") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [kafka, kafka-connect, cdc-runner, event-sim] }] }
      ports:
        - { port: 9092, protocol: TCP }
    - from:
        - podSelector: { matchLabels: { component: singleuser-server } }          # members' Jupyter (KubeSpawner)
        - podSelector: { matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [spark-connect, spark-worker, flink-taskmanager, beam-job-server] }] }   # beam-job-server: plans a streaming read
      ports:
        - { port: 9094, protocol: TCP }
---
# … and to Kafka Connect (its REST API and the secrets helper): cdc-runner; home-api only asks
# whether it's up (the Ingestion page's "Streaming is off" notice)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-connect-clients
  labels: {{- include "de-stack.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "de-stack.selector" (dict "app" "kafka-connect") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: { matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [cdc-runner] }] }
      ports:
        - { port: 8083, protocol: TCP }
        - { port: 8090, protocol: TCP }
    - from:
        - podSelector: { matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [home-api] }] }
      ports:
        - { port: 8083, protocol: TCP }
{{- end }}
