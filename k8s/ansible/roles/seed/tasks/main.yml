---
# Seed the governed Polaris catalog. The chart's polaris-bootstrap Job already
# created the admin realm (root/s3cr3t); here we create the catalog, namespaces,
# personas, and graded RBAC by running common/polaris/seed-polaris.sh against the
# Polaris API over a local port-forward (runs on the build_host / Mac).

- name: Wait for Polaris to be ready
  ansible.builtin.command: "kubectl -n {{ namespace }} rollout status deploy/polaris --timeout=240s"
  changed_when: false

- name: Wait for the polaris-bootstrap Job (admin realm) to complete
  ansible.builtin.command: "kubectl -n {{ namespace }} wait --for=condition=complete job/polaris-bootstrap --timeout=180s"
  changed_when: false

- name: Seed the governed catalog (catalog, namespaces, personas, RBAC)
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n {{ namespace }} port-forward svc/polaris {{ polaris_local_port }}:8181 >/tmp/de-stack-polaris-pf.log 2>&1 &
    PF=$!
    trap 'kill $PF 2>/dev/null || true' EXIT
    # wait until the port-forward is actually serving (any HTTP response = up)
    for i in $(seq 1 20); do
      curl -s -o /dev/null "http://localhost:{{ polaris_local_port }}/api/catalog/v1/config" && break || sleep 1
    done
    sec() { kubectl -n {{ namespace }} get secret de-stack-secrets -o jsonpath="{.data.$1}" | base64 -d; }
    POLARIS_ROOT_CREDENTIAL="root:$(sec polaris-root-secret)" POLARIS_PERSONA_SECRET="$(sec polaris-persona-secret)" \
    POLARIS_URL="http://localhost:{{ polaris_local_port }}" bash "{{ polaris_seed_script }}"
  args:
    executable: /bin/bash
  register: polaris_seed
  changed_when: true

- name: Seed complete
  ansible.builtin.debug:
    msg: >-
      Polaris seeded: catalog polaris_lake (engine name `iceberg`) with
      bronze/silver/gold namespaces + analyst/engineer/lead personas and graded
      RBAC. Personas log in with client id = secret = name; admin is root/s3cr3t.

- name: Give the manager account its private password (the realm import ships manager/manager)
  ansible.builtin.shell: |
    set -euo pipefail
    sec() { kubectl -n {{ namespace }} get secret de-stack-secrets -o jsonpath="{.data.$1}" | base64 -d; }
    kubectl -n {{ namespace }} exec deploy/keycloak -- env ADMINPW="$(sec keycloak-admin-password)" MGRPW="$(sec manager-password)" sh -c '
      K=/opt/keycloak/bin/kcadm.sh
      $K config credentials --server http://localhost:8080 --realm master --user admin --password "$ADMINPW" >/dev/null
      $K set-password -r de-lab --username manager --new-password "$MGRPW"'
  args:
    executable: /bin/bash
  no_log: true
  changed_when: true

- name: Add the Keycloak clients a live realm is missing (the realm import runs only once)
  ansible.builtin.shell: |
    set -euo pipefail
    sec() { kubectl -n {{ namespace }} get secret de-stack-secrets -o jsonpath="{.data.$1}" | base64 -d; }
    kc() { kubectl -n {{ namespace }} exec -i deploy/keycloak -- env ADMINPW="$(sec keycloak-admin-password)" sh -c '
      K=/opt/keycloak/bin/kcadm.sh
      $K config credentials --server http://localhost:8080 --realm master --user admin --password "$ADMINPW" >/dev/null
      '"$1"; }
    realm=$(kubectl -n {{ namespace }} exec deploy/keycloak -- cat /opt/keycloak/data/import/de-lab-realm.json)
    have=$(kc '$K get clients -r de-lab --fields clientId' | grep -o '"clientId" : "[^"]*"' | cut -d'"' -f4)
    for cid in $(echo "$realm" | python3 -c 'import json,sys; print(*(c["clientId"] for c in json.load(sys.stdin)["clients"]))'); do
      echo "$have" | grep -qx "$cid" && continue
      echo "$realm" | python3 -c 'import json,sys; print(json.dumps([c for c in json.load(sys.stdin)["clients"] if c["clientId"] == sys.argv[1]][0]))' "$cid" \
        | kc '$K create clients -r de-lab -f -'
      echo "added client $cid"
    done
  args:
    executable: /bin/bash
  register: kc_clients
  changed_when: "'added client' in kc_clients.stdout"

- name: Give the Keycloak sign-in clients their private secrets (the realm import ships defaults)
  ansible.builtin.shell: |
    set -euo pipefail
    sec() { kubectl -n {{ namespace }} get secret de-stack-secrets -o jsonpath="{.data.$1}" | base64 -d; }
    kubectl -n {{ namespace }} exec deploy/keycloak -- env ADMINPW="$(sec keycloak-admin-password)" \
      S_HOME="$(sec oidc-home-secret)" S_JH="$(sec oidc-jupyterhub-secret)" S_AF="$(sec oidc-airflow-secret)" \
      S_SS="$(sec oidc-superset-secret)" S_SQ="$(sec oidc-sqlpad-secret)" S_ST="$(sec oidc-storage-secret)" \
      S_PO="$(sec oidc-polaris-secret)" S_VA="$(sec oidc-vault-secret)" sh -c '
      K=/opt/keycloak/bin/kcadm.sh
      $K config credentials --server http://localhost:8080 --realm master --user admin --password "$ADMINPW" >/dev/null
      for pair in de-lab-home:S_HOME jupyterhub:S_JH airflow:S_AF superset:S_SS sqlpad:S_SQ storage:S_ST polaris:S_PO vault:S_VA; do
        cid=${pair%%:*}; val=$(eval echo \$${pair#*:})
        id=$($K get clients -r de-lab -q clientId=$cid --fields id | grep -o "[0-9a-f-]\{36\}")
        $K update clients/$id -r de-lab -s secret="$val"
      done'
  args:
    executable: /bin/bash
  no_log: true
  changed_when: true
