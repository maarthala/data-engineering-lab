---
# ============================================================================
# de-stack bootstrap config. Build images on the Mac, ctr-import them onto the
# MicroK8s node, then deploy the Helm chart in ordered waves + seed Polaris.
# ============================================================================

# Repo root (this ansible/ dir lives at <repo>/k8s/ansible).
repo_root: "{{ playbook_dir }}/../.."
kubeconfig: "{{ lookup('env','HOME') }}/.kube/config-de-node"
namespace: de-stack
helm_release: de-stack
chart_dir: "{{ repo_root }}/k8s/helm/de-stack"

# Where image tarballs are staged (Mac) and shipped (node).
stage_dir_local: "/tmp/de-stack-images"
stage_dir_node: "/tmp/de-stack-images"

# ---------------------------------------------------------------------------
# Custom images built directly from common/dockerfiles (context = that dir), then
# tagged to the refs the Helm chart expects. All stock/governance images (incl.
# apache/polaris) are pulled by the kubelet — nothing is built from source.
# ---------------------------------------------------------------------------
dockerfiles_dir: "{{ repo_root }}/common/dockerfiles"
build_images:
  - { dockerfile: "Dockerfile.spark",        ref: "ghcr.io/maarthala/de-stack/spark:latest",       flatten: false }
  - { dockerfile: "Dockerfile.jupyter",      ref: "ghcr.io/maarthala/de-stack/jupyter:latest",      flatten: false }
  - { dockerfile: "Dockerfile.superset",     ref: "ghcr.io/maarthala/de-stack/superset:latest",     flatten: false }
  - { dockerfile: "Dockerfile.airflow-slim", ref: "ghcr.io/maarthala/de-stack/airflow-slim:latest", flatten: false }
  - { dockerfile: "Dockerfile.home-api",     ref: "ghcr.io/maarthala/de-stack/home-api:latest",     flatten: false }
  - { dockerfile: "Dockerfile.jupyterhub",   ref: "ghcr.io/maarthala/de-stack/jupyterhub:latest",   flatten: false }
  - { dockerfile: "Dockerfile.polaris-console", ref: "ghcr.io/maarthala/de-stack/polaris-console:latest", flatten: false }

# The home image bakes the built training site (context = training/, not the
# shared dockerfiles dir), so it's built by its own task rather than the loop.
home_image: "ghcr.io/maarthala/de-stack/home:latest"

# All image refs to save on the Mac + import on the node.
load_images: >-
  {{ (build_images | map(attribute='ref') | list) + [home_image] }}

# ---------------------------------------------------------------------------
# Deploy waves — applied in order; each waits for readiness before the next.
# (Only templates for enabled services; disabled ones render to nothing.)
# ---------------------------------------------------------------------------
deploy_waves:
  - name: "commodity"
    templates: [postgres.yaml, redis.yaml, storage.yaml]
  - name: "catalog"
    templates: [polaris.yaml, adventureworks.yaml, keycloak.yaml]   # Polaris server + console + bootstrap Job; AdventureWorks one-shot loader Job (needs Postgres, idempotent); Keycloak (front door — before the apps wave's oauth2-proxy)
  - name: "compute"
    # configmaps.yaml first: spark/spark-connect mount spark-config + hive-config from it
    # (in the apps wave they sat in FailedMount until the wave's 240s wait timed out).
    templates: [configmaps.yaml, spark.yaml, spark-connect.yaml, trino.yaml]
  - name: "apps"
    # lab-code.yaml FIRST: the apps mount it with subPath, which never refreshes — a pod that
    # starts before the ConfigMap is updated keeps the old code. vault.yaml next (it mounts
    # lab-code too; the Hub, home-api and Airflow use it for "My secrets").
    templates: [lab-code.yaml, vault.yaml, airflow.yaml, jupyter.yaml, superset.yaml, home.yaml, sqlpad.yaml]
# NOTE: only ENABLED templates belong here — `helm template -s <t>` on a disabled
# service renders nothing and `kubectl apply` then errors on empty input.

# ---------------------------------------------------------------------------
# Polaris seed (run once Polaris + its bootstrap Job are up). The chart's
# polaris-bootstrap Job creates the admin realm (root/s3cr3t); the seed role then
# runs common/polaris/seed-polaris.sh to create the governed catalog, the
# bronze/silver/gold namespaces, the analyst/engineer/lead principals, and the
# graded RBAC. The script talks to the Polaris API via a local port-forward.
# ---------------------------------------------------------------------------
polaris_seed_script: "{{ repo_root }}/common/polaris/seed-polaris.sh"
polaris_local_port: 18181     # local port-forwarded to svc/polaris:8181 during seeding

# Secrets live in vault.yml (see vault.example.yml). Referenced by the secrets role:
#   git_pat_token: <fine-grained GitHub PAT; needs Contents:write for Jupyter auto-push>
